/* ---- views.js ---- */
/* ============================================================
   Views — each returns an HTML string for the main panel
   ============================================================ */
const TABS = [
  ['overview', 'Overview'], ['progress', 'Progress & time'], ['discovery', 'Discovery'], ['business', 'Business & market'], ['finance', 'Finance'], ['org', 'People & org'],
  ['tools', 'Tools'], ['processes', 'Processes'], ['interviews', 'Interviews'], ['crossover', 'Crossover'],
  ['recs', 'Recommendations'], ['scenarios', 'Scenarios'], ['report', 'Report'], ['data', 'Data & Claude']
];

const card = (title, body, { sub = '', cls = '', actions = '' } = {}) =>
  `<section class="card ${cls}"><header class="card-h"><div><h3>${title}</h3>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${actions}</header>${body}</section>`;
const sevChip = (s) => `<span class="chip sev-${s}">${s === 'high' ? '▲ High' : s === 'medium' ? '● Medium' : '○ Low'}</span>`;
const stChip = (x) => x._removed ? '<span class="chip st-removed">✕ Removed</span>' : x._added ? '<span class="chip st-added">+ New</span>' : (x._changed && x._changed.length) ? '<span class="chip st-changed">~ Changed</span>' : '';
const empty = (msg) => `<p class="empty">${msg}</p>`;
const pct = (v) => `${Math.round(v)}%`;
const hrs = (v) => `${Math.round(v).toLocaleString('en-GB')} h`;

function deltaHTML(cur, next, fmt, lowerIsGood = true) {
  const d = next - cur; if (Math.abs(d) < 0.5) return '<span class="k-delta">no change</span>';
  const good = lowerIsGood ? d < 0 : d > 0;
  return `<span class="k-delta ${good ? 'delta-good' : 'delta-bad'}">${d > 0 ? '▲' : '▼'} ${fmt(Math.abs(d))} vs current</span>`;
}
const kpi = (label, value, delta = '') => `<div class="kpi"><div class="k-label">${label}</div><div class="k-value${String(value).replace(/<[^>]+>/g, '').length > 14 ? ' k-text' : ''}">${value}</div>${delta}</div>`;

function scenarioBanner(e) {
  if (ui.scenario === 'current') return '';
  return `<div class="banner">Showing the <strong>${esc(scenarioName(e, ui.scenario))}</strong> scenario. Changes are flagged: <span class="chip st-added">+ New</span> <span class="chip st-changed">~ Changed</span> <span class="chip st-removed">✕ Removed</span> <button class="link" data-action="setScenario" data-id="current">Back to current state</button></div>`;
}

/* ---------------- Overview ---------------- */
function viewOverview(e) {
  const imp = scenarioImpact(e, ui.scenario);
  const { base, m } = imp; const isCur = ui.scenario === 'current';
  const tiles = [
    kpi('Headcount', `${m.headcount}`, isCur ? `<div class="k-delta">${base.fte.toFixed(1)} FTE</div>` : deltaHTML(base.headcount, m.headcount, (v) => v)),
    kpi('Annual payroll', fmtMoney(m.payroll), isCur ? '' : deltaHTML(base.payroll, m.payroll, fmtMoney)),
    kpi('Tool spend / yr', fmtMoney(m.toolSpend), isCur ? `<div class="k-delta">${m.toolCount} tools</div>` : deltaHTML(base.toolSpend, m.toolSpend, fmtMoney)),
    kpi('Mapped process hours / mo', hrs(m.procHours), isCur ? `<div class="k-delta">${base.procHours ? pct(base.manualHours / base.procHours * 100) : '0%'} manual</div>` : deltaHTML(base.procHours, m.procHours, hrs)),
    kpi('Run-rate revenue', fmtMoney(annualRevenue(e)), `<div class="k-delta">from finance periods</div>`)
  ];
  if (!isCur) tiles.push(
    kpi('Cash saving / yr', fmtMoney(imp.cashSaving), `<div class="k-delta">+ ${fmtMoney(imp.revenueUplift)} revenue uplift</div>`),
    kpi('One-off cost', fmtMoney(imp.oneOff), `<div class="k-delta">payback ${imp.paybackMonths == null ? 'n/a' : imp.paybackMonths.toFixed(1) + ' months'}</div>`));

  const scen = e.scenarios.map((s) => ({ s, i: scenarioImpact(e, s.id) }));
  const scenTable = scen.length ? `<table class="tbl"><thead><tr><th>Scenario</th><th class="r">Headcount Δ</th><th class="r">Cash saving/yr</th><th class="r">Revenue uplift</th><th class="r">Hours freed/mo</th><th class="r">One-off</th><th class="r">Payback</th><th></th></tr></thead><tbody>
    ${scen.map(({ s, i }) => `<tr><td><strong>${esc(s.name)}</strong><div class="muted small">${esc(s.description || '')}</div></td><td class="r">${i.headcountDelta}</td><td class="r">${fmtMoney(i.cashSaving)}</td><td class="r">${fmtMoney(i.revenueUplift)}</td><td class="r">${hrs(i.hoursSaved)}</td><td class="r">${fmtMoney(i.oneOff)}</td><td class="r">${i.paybackMonths == null ? '—' : i.paybackMonths.toFixed(1) + ' mo'}</td><td><button class="btn sm" data-action="setScenario" data-id="${s.id}">View</button></td></tr>`).join('')}
    </tbody></table>` : empty('No scenarios yet. Create them under Scenarios.');

  const top = scoreRecommendations(e).slice(0, 5);
  const ins = insights(e, fmtMoney, ui.anon).slice(0, 6);
  return `${scenarioBanner(e)}
  <div class="page-h"><div><span class="eyebrow">${esc(e.client.sector || 'Client')}${e.client.subSector ? ' · ' + esc(e.client.subSector) : ''}</span><h1>${esc(e.client.name)}</h1><p class="muted">${esc(e.client.goals || e.client.description || 'Start by completing the business profile, or paste structured data from Claude in Data & Claude.')}</p></div></div>
  <div class="kpis">${tiles.join('')}</div>
  ${card('Scenarios compared', scenTable, { cls: 'scroll-x', sub: 'Each scenario is the current state with a set of recommendations applied.' })}
  <div class="grid-2">
    ${card('Top recommendations', top.length ? `<ol class="rank">${top.map((r) => `<li><div><strong>${esc(r.rec.title)}</strong><div class="muted small">${esc(r.rec.type || '')} · ${esc(r.rec.horizon || '')} · ${fmtMoney(r.cash + r.revenue)}/yr cash + revenue · ${hrs(r.hoursSaved)}/mo freed</div></div><span class="score">${r.score}</span></li>`).join('')}</ol>` : empty('No recommendations yet.'), { actions: '<button class="btn sm" data-action="tab" data-id="recs">All →</button>' })}
    ${card('Key crossover signals', ins.length ? `<ul class="insights">${ins.map((x) => `<li>${sevChip(x.severity)} <strong>${esc(x.title)}</strong><div class="muted small">${esc(x.area)}: ${esc(x.detail)}</div></li>`).join('')}</ul>` : empty('Signals appear as data comes in.'), { actions: '<button class="btn sm" data-action="tab" data-id="crossover">All →</button>' })}
  </div>
  ${card('Discovery coverage', hbars(completeness(e).map(([l, v]) => ({ label: l, value: v * 100 })), { fmt: pct, max: 100, color: 'var(--s1)' }), { sub: 'How complete each area is. Gaps here mean weaker analysis.' })}`;
}

  const table = `<table class="tbl"><thead><tr><th>Name</th><th>Role</th><th>Department</th><th>Reports to</th><th class="r">Cost / yr</th><th class="r">FTE</th><th class="r">Mapped hrs/mo</th><th class="r">% of capacity</th><th class="r">Processes</th><th class="r">Interviews</th><th></th></tr></thead><tbody>
    ${ppl.map((p) => { const l = load[p.id]; const cap = (num(p.fte) || 1) * HOURS_PER_FTE_MONTH; return `<tr class="${p._removed ? 'row-removed' : ''}"><td>${ui.anon ? '—' : esc(p.name)}</td><td>${esc(p.title || '')}</td><td><i class="swatch" style="background:${deptColor(e.departments, p.departmentId)}"></i>${esc(dById[p.departmentId] ? dById[p.departmentId].name : '')}</td><td>${ui.anon ? esc(pById[p.managerId] ? pById[p.managerId].title : '') : esc(pById[p.managerId] ? pById[p.managerId].name : '')}</td><td class="r">${fmtMoney(num(p.annualCost))}</td><td class="r">${num(p.fte) || 1}</td><td class="r">${l ? Math.round(l.hours) : 0}</td><td class="r">${l ? pct(l.hours / cap * 100) : '0%'}</td><td class="r">${l ? l.processes.size : 0}</td><td class="r">${ivCount[p.id] || 0}</td><td>${stChip(p)}</td></tr>`; }).join('')}</tbody></table>`;
  return `${scenarioBanner(e)}<div class="page-h"><div><span class="eyebrow">People & org</span><h1>${isCur ? 'Current structure' : 'Proposed structure'}</h1><p class="muted">Hover any card for detail. Mapped hours come from process steps, so low numbers usually mean unmapped work, not idle people.</p></div></div>
  ${controls}${orgLegend(e.departments)}
  ${!isCur && ui.compare ? `<div class="compare"><div><h4>Current</h4>${chartCur}</div><div><h4>${esc(scenarioName(e, ui.scenario))}</h4>${chartNew}</div></div>` : (isCur ? chartCur : chartNew)}
  ${card('People, cost & load', table, { cls: 'scroll-x' })}`;
}

/* ---------------- Tools ---------------- */
function viewTools(e) {
  const st = stateFor(e, ui.scenario);
  const tools = st.tools.filter((t) => ui.ghosts || !t._removed);
  const depts = live(st.departments);
  const cats = {}; live(st.tools).forEach((t) => { const c = (t.category || '').toLowerCase(); if (c) cats[c] = (cats[c] || 0) + 1; });
  const usage = {}; live(st.processes).forEach((p) => live(p.steps).forEach((s) => { if (s.toolId) usage[s.toolId] = (usage[s.toolId] || 0) + stepHours(s, p); }));
  const matrix = `<table class="tbl matrix"><thead><tr><th>Tool</th>${depts.map((d) => `<th class="c" title="${esc(d.name)}"><i class="swatch" style="background:${deptColor(e.departments, d.id)}"></i>${esc(trunc(d.name, 12))}</th>`).join('')}</tr></thead><tbody>
    ${tools.map((t) => `<tr class="${t._removed ? 'row-removed' : ''}"><td>${esc(t.name)} ${stChip(t)}</td>${depts.map((d) => `<td class="c">${splitList(t.departmentIds).includes(d.id) ? '●' : ''}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  return `${scenarioBanner(e)}<div class="page-h"><div><span class="eyebrow">Tools</span><h1>Tool stack, cost & overlap</h1></div></div>
  <div class="grid-2">
    ${card('Annual cost by tool', hbars(live(st.tools).map((t) => ({ label: t.name, value: num(t.monthlyCost) * 12, tip: t.category })).sort((a, b) => b.value - a.value), { fmt: fmtMoney }))}
    ${card('Hours of process work running through each tool', hbars(Object.entries(usage).map(([id, h]) => ({ label: (byId(st.tools)[id] || { name: id }).name, value: h })).sort((a, b) => b.value - a.value), { fmt: hrs, color: 'var(--s3)' }), { sub: 'From mapped process steps, per month.' })}
  </div>
  ${card('Tool register', `<table class="tbl"><thead><tr><th>Tool</th><th>Category</th><th class="r">Monthly</th><th class="r">Seats</th><th class="r">Active</th><th class="r">Cost / active user / mo</th><th>Purpose</th><th></th></tr></thead><tbody>
    ${tools.map((t) => `<tr class="${t._removed ? 'row-removed' : ''}"><td><strong>${esc(t.name)}</strong></td><td>${esc(t.category || '')}${cats[(t.category || '').toLowerCase()] > 1 ? ' <span class="chip sev-medium">● Overlap</span>' : ''}</td><td class="r">${fmtMoney(num(t.monthlyCost))}</td><td class="r">${num(t.seats) || '—'}</td><td class="r">${num(t.activeUsers) || '—'}</td><td class="r">${num(t.activeUsers) ? fmtMoney(num(t.monthlyCost) / num(t.activeUsers)) : '—'}</td><td class="muted small">${esc(t.purpose || '')}</td><td>${stChip(t)}</td></tr>`).join('')}</tbody></table>`, { cls: 'scroll-x' })}
  ${card('Which departments use which tools', matrix, { cls: 'scroll-x' })}`;
}

/* ---------------- Processes ---------------- */
function viewProcesses(e) {
  const st = stateFor(e, ui.scenario); const cur = stateFor(e, 'current');
  const procs = st.processes;
  if (!procs.length) return `<div class="page-h"><div><span class="eyebrow">Processes</span><h1>Process maps</h1></div></div>${empty('No processes yet. Add them in Data & Claude. Each process has steps, and each step has an actor, a tool, a duration and an optional pain point.')}`;
  if (!procs.find((p) => p.id === ui.processId)) ui.processId = procs[0].id;
  const p = procs.find((x) => x.id === ui.processId); const pc = cur.processes.find((x) => x.id === p.id);
  const h = processHours(p), mh = processManualHours(p);
  const list = `<div class="proc-list">${procs.map((x) => `<button class="proc-btn ${x.id === p.id ? 'on' : ''} ${x._removed ? 'row-removed' : ''}" data-action="proc" data-id="${x.id}"><strong>${esc(x.name)}</strong><span>${hrs(processHours(x))}/mo · ${live(x.steps).length} steps</span>${stChip(x)}</button>`).join('')}</div>`;
  const stats = `<div class="kpis">
    ${kpi('Hours / month', hrs(h), pc && ui.scenario !== 'current' ? deltaHTML(processHours(pc), h, hrs) : '')}
    ${kpi('Manual share', h ? pct(mh / h * 100) : '—')}
    ${kpi('Staff cost / yr', fmtMoney(processCostMonthly(p, st) * 12), pc && ui.scenario !== 'current' ? deltaHTML(processCostMonthly(pc, cur) * 12, processCostMonthly(p, st) * 12, fmtMoney) : '')}
    ${kpi('Runs / month', num(p.runsPerMonth) || '—', `<div class="k-delta">${esc(p.frequency || '')}</div>`)}
    ${kpi('Pain points', live(p.steps).filter((s) => s.painPoint).length)}
  </div>`;
  const legendHTML = `<div class="legend"><span><span class="chip">▭ Manual step</span></span><span><span class="chip" style="border-style:dashed;border-color:var(--s1)">▭ Automated</span></span><span><span class="chip sev-high">! Pain point</span></span><span><span class="chip st-added">+ New</span></span><span><span class="chip st-changed">~ Changed</span></span><span><span class="chip st-removed">✕ Removed</span></span></div>`;
  const z = `style="zoom:${ui.zoom}"`;
  const lanes = ui.scenario !== 'current' && pc
    ? `<h4>Before (current)</h4><div class="lane-wrap" ${z}>${swimlane(pc, cur.people, cur.tools, { anonymise: ui.anon })}</div><h4>After: ${esc(scenarioName(e, ui.scenario))}</h4><div class="lane-wrap" ${z}>${swimlane(p, st.people, st.tools, { anonymise: ui.anon })}</div>`
    : `<div class="lane-wrap" ${z}>${swimlane(p, st.people, st.tools, { anonymise: ui.anon })}</div>`;
  return `${scenarioBanner(e)}<div class="page-h"><div><span class="eyebrow">Processes</span><h1>${esc(p.name)}</h1><p class="muted">${esc(p.inputs || '')} → ${esc(p.outputs || '')}</p></div></div>
  <div class="proc-layout">${list}<div>${stats}
    <div class="toolbar"><label class="tog"><input type="checkbox" data-ui="anon" ${ui.anon ? 'checked' : ''}> Anonymise</label><button class="btn sm" data-action="zoom" data-id="-1">−</button><button class="btn sm" data-action="zoom" data-id="1">+</button></div>
    ${legendHTML}${lanes}
    ${card('All processes by monthly hours', hbars(live(procs).map((x) => ({ label: x.name, value: processHours(x), tip: `${pct(processManualHours(x) / Math.max(1, processHours(x)) * 100)} manual · ${fmtMoney(processCostMonthly(x, st) * 12)}/yr` })).sort((a, b) => b.value - a.value), { fmt: hrs, color: 'var(--s1)' }))}
  </div></div>`;
}

/* ---------------- Interviews ---------------- */
function viewInterviews(e) {
  const pById = byId(e.people); const themes = themeCounts(e);
  return `<div class="page-h"><div><span class="eyebrow">Interviews</span><h1>What people told us</h1><p class="muted">Tag themes consistently, e.g. "manual reporting". Themes raised by several people become crossover signals.</p></div><div class="btn-row"><button class="btn" data-action="startCapture">+ Capture an interview</button></div></div>
  ${card('Themes by number of interviews', hbars(themes.map((t) => ({ label: t.theme, value: t.count, tip: [...t.people].map((id) => pById[id] ? (ui.anon ? pById[id].title : pById[id].name) : '').join(', ') })), { fmt: (v) => v, color: 'var(--s7)' }))}
  <div class="iv-grid">${e.interviews.map((iv) => { const p = pById[iv.personId]; return `<article class="card iv">
    <header><strong>${p ? esc(ui.anon ? p.title : p.name) : esc(iv.personLabel || 'Unknown')}</strong><span class="muted small">${p && !ui.anon ? esc(p.title || '') + ' · ' : ''}${esc(iv.date || '')}</span></header>
    <p>${esc(iv.summary || '')}</p>
    ${splitList(iv.painPoints).length ? `<h5>Pain points</h5><ul>${splitList(iv.painPoints).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${iv.ideas ? `<h5>Ideas</h5><p class="small">${esc(iv.ideas)}</p>` : ''}
    ${iv.quotes ? `<blockquote>${esc(iv.quotes)}</blockquote>` : ''}
    <div class="tags">${splitList(iv.themes).map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>
    ${Object.keys(iv.answers || {}).length || (iv.outliers || []).length ? `<details class="small"><summary>${Object.keys(iv.answers || {}).length} structured answers · ${(iv.outliers || []).length} unexpected points</summary>${CRITERIA.map((c) => { const qs = Object.entries(iv.answers || {}).filter(([q]) => QINDEX[q] && QINDEX[q].crit === c.id); const os = (iv.outliers || []).filter((o) => o.crit === c.id); return qs.length || os.length ? `<h5>${esc(c.label)}</h5><dl>${qs.map(([q, a]) => `<dt>${esc(QINDEX[q].q)}</dt><dd>${esc(a)}</dd>`).join('')}${os.map((o) => `<dt>Unexpected</dt><dd>${esc(o.text)}</dd>`).join('')}</dl>` : ''; }).join('')}</details>` : ''}
    <div class="btn-row"><button class="btn sm" data-action="editInterview" data-id="${esc(iv.id)}">Open in capture form</button></div></article>`; }).join('') || empty('No interviews yet. Paste notes into Claude and ask for interview JSON (see Data & Claude).')}</div>`;
}

/* ---------------- Crossover ---------------- */
function viewCrossover(e) {
  const ins = insights(e, fmtMoney, ui.anon);
  const areas = ['All', ...new Set(ins.map((i) => i.area))];
  const shown = ui.area && ui.area !== 'All' ? ins.filter((i) => i.area === ui.area) : ins;
  const st = stateFor(e, ui.scenario);
  const sc = departmentScorecard(e, st);
  const people = live(st.people).filter((p) => personLoad(st)[p.id]);
  const procs = live(st.processes);
  const matrix = people.map((p) => procs.map((pr) => sum(live(pr.steps).filter((s) => s.actorId === p.id && !s.automated), (s) => stepHours(s, pr))));
  const maxPay = Math.max(1, ...sc.map((d) => d.payroll + d.toolSpend));
  return `${scenarioBanner(e)}<div class="page-h"><div><span class="eyebrow">Crossover</span><h1>Where the data points meet</h1><p class="muted">Signals found by crossing finance, people, tools, processes, customers and interviews. They are prompts to investigate, not conclusions.</p></div></div>
  <div class="toolbar">${areas.map((a) => `<button class="btn sm ${((ui.area || 'All') === a) ? 'on' : ''}" data-action="area" data-id="${esc(a)}">${esc(a)}</button>`).join('')}</div>
  ${card(`Signals (${shown.length})`, shown.length ? `<ul class="insights">${shown.map((x) => `<li>${sevChip(x.severity)} <span class="chip">${esc(x.area)}</span> <strong>${esc(x.title)}</strong><div class="muted small">${esc(x.detail)}</div></li>`).join('')}</ul>` : empty('No signals yet.'))}
  ${card('Department scorecard', sc.length ? `<table class="tbl"><thead><tr><th>Department</th><th class="r">People</th><th>People + tool cost / yr</th><th class="r">Processes</th><th class="r">Process hrs/mo</th><th class="r">Manual</th><th class="r">Pain points raised</th></tr></thead><tbody>
    ${sc.map((d) => `<tr><td><i class="swatch" style="background:${deptColor(e.departments, d.dept.id)}"></i>${esc(d.dept.name)}</td><td class="r">${d.headcount}</td><td><div class="inline-bar"><span style="width:${(d.payroll + d.toolSpend) / maxPay * 100}%"></span></div>${fmtMoney(d.payroll + d.toolSpend)}</td><td class="r">${d.processes}</td><td class="r">${Math.round(d.hours)}</td><td class="r">${d.hours ? pct(d.manualPct) : '—'}</td><td class="r">${d.pain}</td></tr>`).join('')}</tbody></table>` : empty('Add departments.'), { cls: 'scroll-x', sub: 'Crosses people, tools, processes and interview pain points for each department.' })}
  ${card('Who carries which process (hours / month)', heatmap(people.map((p) => ui.anon ? p.title : p.name), procs.map((p) => p.name), matrix, { fmt: (v) => Math.round(v) }), { cls: 'scroll-x', sub: 'Darker means more hours. Look for one person carrying a whole process, or senior people doing manual work.' })}`;
}

/* ---------------- Recommendations ---------------- */
function viewRecs(e) {
  const rows = scoreRecommendations(e);
  const types = ['All', ...new Set(e.recommendations.map((r) => r.type).filter(Boolean))];
  const shown = ui.recType && ui.recType !== 'All' ? rows.filter((r) => r.rec.type === ui.recType) : rows;
  const statusOpts = REC_STAGES;
  return `<div class="page-h"><div><span class="eyebrow">Recommendations</span><h1>Ranked changes</h1><p class="muted">Each recommendation is scored on its own against the current state. Score = 50% value, 20% low effort, 15% low risk, 15% confidence. Value = cash saving + revenue uplift + half the value of freed hours. Freed hours are capacity, not cash, unless headcount changes.</p></div>
    <button class="btn" data-action="addRec">+ Add recommendation</button></div>
  <div class="toolbar">${types.map((t) => `<button class="btn sm ${((ui.recType || 'All') === t) ? 'on' : ''}" data-action="recType" data-id="${esc(t)}">${esc(t)}</button>`).join('')}</div>
  ${card('', shown.length ? `<table class="tbl recs"><thead><tr><th>#</th><th>Recommendation</th><th>Score</th><th class="r">Cash / yr</th><th class="r">Revenue / yr</th><th class="r">Hours freed / mo</th><th class="r">Headcount</th><th class="r">One-off</th><th class="r">Payback</th><th class="c">Effort</th><th class="c">Risk</th><th class="c">Conf.</th><th>Status</th></tr></thead><tbody>
    ${shown.map((r, i) => `<tr class="${r.rec.status === 'Rejected' ? 'row-removed' : ''}"><td>${i + 1}</td><td><strong>${esc(r.rec.title)}</strong> <span class="chip">${esc(r.rec.type || '—')}</span> <span class="chip">${esc(r.rec.horizon || '—')}</span><div class="muted small">${esc(r.rec.description || '')}</div>${(r.rec.ops || []).length ? `<div class="faint small">${r.rec.ops.length} modelled change${r.rec.ops.length > 1 ? 's' : ''}: ${esc(r.rec.ops.map((o) => o.op).join(', '))}</div>` : '<div class="faint small">Not modelled yet. Add ops so it shows in the scenarios.</div>'}</td>
    <td><div class="score-bar"><span style="width:${r.score}%"></span></div><span class="small">${r.score}</span></td>
    <td class="r">${fmtMoney(r.cash)}</td><td class="r">${fmtMoney(r.revenue)}</td><td class="r">${Math.round(r.hoursSaved)}</td><td class="r">${r.headcountDelta || '—'}</td><td class="r">${fmtMoney(r.oneOff)}</td><td class="r">${r.payback == null ? '—' : r.payback.toFixed(1) + ' mo'}</td>
    <td class="c">${num(r.rec.effort) || '—'}</td><td class="c">${num(r.rec.risk) || '—'}</td><td class="c">${num(r.rec.confidence) || '—'}</td>
    <td><select data-cell data-coll="recommendations" data-id="${r.rec.id}" data-field="status">${statusOpts.map((s) => `<option ${r.rec.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')}
    </tbody></table>` : empty('No recommendations yet.'), { cls: 'scroll-x' })}
  <p class="muted small">Edit details, costs and modelled changes ("ops") in Data & Claude → Recommendations. Claude can draft the ops for you. See the schema in the README.</p>`;
}

/* ---------------- Scenarios ---------------- */
function viewScenarios(e) {
  const recs = scoreRecommendations(e);
  const impacts = e.scenarios.map((s) => ({ s, i: scenarioImpact(e, s.id) }));
  return `<div class="page-h"><div><span class="eyebrow">Scenarios</span><h1>Build "what it could be"</h1><p class="muted">Tick which recommendations each scenario includes. Every view (org, processes, tools, finance) can then be switched to that scenario from the selector at the top.</p></div><button class="btn" data-action="addScenario">+ Add scenario</button></div>
  ${e.scenarios.length ? card('Scenario builder', `<table class="tbl"><thead><tr><th>Recommendation</th>${e.scenarios.map((s) => `<th class="c"><input class="inline" data-cell data-coll="scenarios" data-id="${s.id}" data-field="name" value="${esc(s.name)}"></th>`).join('')}</tr></thead><tbody>
    ${recs.map((r) => `<tr><td>${esc(r.rec.title)} <span class="faint small">(score ${r.score})</span></td>${e.scenarios.map((s) => `<td class="c"><input type="checkbox" data-action="toggleRecInScenario" data-scenario="${s.id}" data-rec="${r.rec.id}" ${splitList(s.recommendationIds).includes(r.rec.id) ? 'checked' : ''}></td>`).join('')}</tr>`).join('')}
    <tr><td></td>${e.scenarios.map((s) => `<td class="c"><button class="btn sm" data-action="setScenario" data-id="${s.id}">View</button> <button class="btn sm ghost" data-action="delScenario" data-id="${s.id}" title="Delete scenario">✕</button></td>`).join('')}</tr>
    </tbody></table>`, { cls: 'scroll-x' }) : empty('No scenarios yet.')}
  ${impacts.length ? `<div class="grid-2">
    ${card('Annual cash saving + revenue uplift', hbars(impacts.map(({ s, i }) => ({ label: s.name, value: i.cashSaving + i.revenueUplift, tip: `cash ${fmtMoney(i.cashSaving)} · revenue ${fmtMoney(i.revenueUplift)}` })), { fmt: fmtMoney, color: 'var(--s3)' }))}
    ${card('One-off investment', hbars(impacts.map(({ s, i }) => ({ label: s.name, value: i.oneOff, tip: i.paybackMonths == null ? '' : `payback ${i.paybackMonths.toFixed(1)} months` })), { fmt: fmtMoney, color: 'var(--s2)' }))}
  </div>` : ''}`;
}

/* ---------------- Report (settings + preview) ---------------- */
function viewReport(e) {
  const toggle = `<div class="toolbar"><button class="btn sm ${ui.reportType === 'status' ? 'on' : ''}" data-action="reportType" data-id="status">Status report (progress, time, delays)</button><button class="btn sm ${ui.reportType !== 'status' ? 'on' : ''}" data-action="reportType" data-id="diagnostic">Diagnostic report (findings & recommendations)</button></div>`;
  if (ui.reportType === 'status') {
    return `<div class="page-h"><div><span class="eyebrow">Report</span><h1>Client status report</h1><p class="muted">Generated live from Progress & time. Send it after every fortnightly review, or whenever the founders ask. The Delays & changes section is always included, even when it is empty.</p></div>
      <div class="btn-row"><button class="btn" data-action="printReport">Print / save PDF</button><button class="btn" data-action="downloadReport">Download HTML report</button></div></div>
      ${toggle}<div class="report-preview status-preview"><div id="report-doc" class="rpt">${e.engagement.phases.length ? renderStatusReport(e) : '<p>Set up the engagement in Progress & time first.</p>'}</div></div>`;
  }
  const r = e.report; const sec = r.sections;
  const secLabels = { snapshot: 'Current-state snapshot', findings: 'Key findings', org: 'Org chart: current vs proposed', processes: 'Process maps: before / after', recommendations: 'Recommendations roadmap', financials: 'Financial impact', nextSteps: 'Next steps' };
  return `<div class="page-h"><div><span class="eyebrow">Report</span><h1>Founder report</h1><p class="muted">Preview below. Export as PDF (print) or as one self-contained HTML file you can email. Exports hold no raw data and do not depend on this tool or on Claude.</p></div>
    <div class="btn-row"><button class="btn" data-action="printReport">Print / save PDF</button><button class="btn" data-action="downloadReport">Download HTML report</button></div></div>
  ${toggle}
  <div class="report-layout">
    <aside class="card report-settings">
      ${field('report.title', 'Report title', r.title)}${field('report.preparedFor', 'Prepared for', r.preparedFor)}
      <label class="fld"><span>Scenario to present</span><select data-bind="report.scenarioId"><option value="">None (current state only)</option>${e.scenarios.map((s) => `<option value="${s.id}" ${r.scenarioId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}<option value="all" ${r.scenarioId === 'all' ? 'selected' : ''}>All recommendations</option></select></label>
      <label class="tog"><input type="checkbox" data-bind="report.anonymise" ${r.anonymise ? 'checked' : ''}> Anonymise people (roles only)</label>
      <p class="faint small">Anonymising hides names in charts and tables. It does not edit names you typed into free text.</p>
      <h5>Sections</h5>${Object.keys(secLabels).map((k) => `<label class="tog"><input type="checkbox" data-bind="report.sections.${k}" ${sec[k] ? 'checked' : ''}> ${secLabels[k]}</label>`).join('')}
      <h5>Processes to include</h5>${e.processes.map((p) => `<label class="tog"><input type="checkbox" data-action="toggleReportProc" data-id="${p.id}" ${(r.processIds || []).includes(p.id) ? 'checked' : ''}> ${esc(p.name)}</label>`).join('') || '<p class="faint small">No processes.</p>'}
      ${field('report.summary', 'Executive summary', r.summary, { area: true })}
      ${field('report.nextSteps', 'Next steps (one per line)', r.nextSteps, { area: true })}
    </aside>
    <div class="report-preview"><div id="report-doc" class="rpt">${renderReport(e)}</div></div>
  </div>`;
}

/* ---- views2.js ---- */
/* ============================================================
   Progress & time, Discovery (coverage, founder intake, interview capture), Status report
   ============================================================ */
const sel = (opts, v, attrs, blank = true) => `<select ${attrs}>${blank ? '<option value=""></option>' : ''}${opts.map((o) => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
const ecell = (coll, row, field, type = 'text', extra = '') => `<input data-cell data-coll="${coll}" data-id="${esc(row.id)}" data-field="${field}" data-type="${type === 'number' ? 'num' : type}" type="${type}" value="${esc(row[field])}" ${extra}>`;
const ecellSel = (coll, row, field, opts, blank = true) => sel(opts, row[field], `data-cell data-coll="${coll}" data-id="${esc(row.id)}" data-field="${field}"`, blank);
const ecellArea = (coll, row, field, rows = 2) => `<textarea data-cell data-coll="${coll}" data-id="${esc(row.id)}" data-field="${field}" rows="${rows}">${esc(row[field])}</textarea>`;
const delBtn = (coll, id) => `<button class="btn sm ghost" data-action="delRow" data-coll="${coll}" data-id="${esc(id)}" title="Delete">✕</button>`;
const reqChip = (s) => ({ Received: '<span class="chip st-added">✓ Received</span>', Overdue: '<span class="chip st-removed">▲ Overdue</span>', Waiting: '<span class="chip">○ Waiting</span>' }[s] || `<span class="chip">${esc(s)}</span>`);
const phaseChip = (s) => ({ Done: '<span class="chip st-added">✓ Done</span>', 'In progress': '<span class="chip sev-high">● In progress</span>', 'On hold': '<span class="chip st-changed">❚❚ On hold</span>' }[s] || '<span class="chip">○ Not started</span>');

/* ---------- Gantt (phases, slips, reviews, today) ---------- */
function phaseGantt(e, { compact = false } = {}) {
  const g = e.engagement; if (!g.phases.length || !g.start || !g.end) return '';
  const st = engagementStatus(e);
  const s = new Date(g.start + 'T00:00:00').getTime(), en = new Date(g.end + 'T00:00:00').getTime() + 864e5;
  const W = 900, LW = compact ? 230 : 260, RH = 30, TOP = 22;
  const x = (iso) => LW + (new Date(iso + 'T00:00:00').getTime() - s) / (en - s) * (W - LW - 10);
  const H = TOP + g.phases.length * RH + 8;
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="gantt-svg" role="img" aria-label="Engagement timeline">`;
  [0, 1, 2, 3].forEach((k) => { const d = new Date(g.start + 'T00:00:00'); d.setMonth(d.getMonth() + k); const iso = d.toISOString().slice(0, 10); if (iso > g.end) return; svg += `<line class="g-grid" x1="${x(iso)}" x2="${x(iso)}" y1="${TOP - 4}" y2="${H}"/><text class="g-lab" x="${x(iso) + 4}" y="12">Month ${k + 1} · ${fmtD(iso)}</text>`; });
  splitList(g.reviewDates).forEach((r) => { if (r >= g.start && r <= g.end) svg += `<line class="g-review" x1="${x(r)}" x2="${x(r)}" y1="${TOP - 4}" y2="${H}"><title>Fortnightly review ${fmtD(r)}</title></line>`; });
  g.phases.forEach((p, i) => {
    const y = TOP + i * RH; const slip = num(st.slipByPhase[p.id]);
    const cls = p.status === 'Done' ? 'done' : p.status === 'In progress' ? 'doing' : p.status === 'On hold' ? 'hold' : 'todo';
    svg += `<text class="g-name" x="0" y="${y + 19}">${esc(trunc(p.name, compact ? 34 : 40))}</text>`;
    if (p.start && p.end) {
      const x1 = x(p.start), x2 = x(addDaysISO(p.end, 1));
      svg += `<rect class="g-bar ${cls}" x="${x1}" y="${y + 7}" width="${Math.max(4, x2 - x1)}" height="16" rx="4" data-tip="${esc(p.name)} · ${fmtD(p.start)}–${fmtD(p.end)} · ${p.status} · ${num(p.plannedDays)} days planned, ${num(st.byPhase[p.id] || 0)} used"/>`;
      if (slip > 0) { const x3 = x(addDaysISO(p.end, 1 + slip)); const dl = e.engagement.delays.filter((d) => d.phaseId === p.id).map((d) => `${d.cause}: +${num(d.daysImpact)}d`).join(' · '); svg += `<rect class="g-slip" x="${x2}" y="${y + 7}" width="${Math.max(4, x3 - x2)}" height="16" rx="3" data-tip="⚑ Slipped ${slip} days · ${esc(dl)}"/><text class="g-sliplab" x="${x3 + 4}" y="${y + 19}">⚑ +${slip}d</text>`; }
    }
  });
  if (st.today >= g.start && st.today <= g.end) svg += `<line class="g-today" x1="${x(st.today)}" x2="${x(st.today)}" y1="${TOP - 8}" y2="${H}"/><text class="g-todaylab" x="${x(st.today) + 3}" y="${H - 2}">Today</text>`;
  return `<div class="chart gantt-wrap">${svg}</div><div class="legend"><span><i style="background:var(--ink)"></i>Done</span><span><i style="background:var(--red)"></i>In progress</span><span><i style="background:var(--grid);outline:1px solid var(--faint)"></i>Not started</span><span><i class="hatch"></i>⚑ Slip from logged delays</span><span><i style="background:transparent;border-left:2px dashed var(--red);border-radius:0"></i>Fortnightly review</span></div>`;
}

/* ---------- Progress & time ---------- */
function viewProgress(e) {
  const g = e.engagement;
  if (!g.phases.length) {
    return `<div class="page-h"><div><span class="eyebrow">Progress & time</span><h1>Set up the engagement</h1><p class="muted">Enter the contract basics. The Studio then creates the standard three-month plan, the client information requests and the first activities. You can edit everything afterwards.</p></div></div>
    ${card('Contract basics', `<div class="form-grid">
      ${field('engagement.contact', 'Client point of contact (decision-maker)', g.contact)}${field('engagement.contactRole', 'Their role', g.contactRole)}
      ${field('engagement.start', 'Start date', g.start, { type: 'date' })}${field('engagement.end', 'End date', g.end, { type: 'date' })}
      ${field('engagement.daysTotal', 'Consulting days in total', g.daysTotal, { type: 'number' })}${field('engagement.daysPerMonth', 'Days per contract month', g.daysPerMonth, { type: 'number' })}
      ${field('engagement.targetMonthly', 'Monthly recurring savings target', g.targetMonthly, { type: 'number' })}${field('engagement.reviewDates', 'Review dates (optional, comma separated)', g.reviewDates, { ph: 'Calculated if left blank' })}
    </div><div class="btn-row"><button class="btn" data-action="seedPlan">Create plan</button></div>`)}`;
  }
  const st = engagementStatus(e); const sv = savingsTracker(e);
  const monthUsed = num(st.byMonth[st.thisMonth] || 0);
  const overMonth = monthUsed > num(g.daysPerMonth);
  const phaseOpts = g.phases.map((p) => [p.id, p.name]);
  const pName = (id) => (g.phases.find((p) => p.id === id) || {}).name || '—';
  const flag = st.openDelays.length || st.totalSlip > 0;

  const kpis = `<div class="kpis">
    ${kpi('Current phase', esc(st.current ? st.current.name : '—'), st.current ? `<div class="k-delta">${fmtD(st.current.start)} – ${fmtD(st.current.end)}</div>` : '')}
    ${kpi('Consulting days used', `${st.used.toFixed(1)} / ${num(g.daysTotal)}`, `<div class="k-delta ${st.remaining < 0 ? 'delta-bad' : ''}">${st.remaining.toFixed(1)} remaining</div>`)}
    ${kpi(`Contract month ${Math.max(1, st.thisMonth)}`, `${monthUsed.toFixed(1)} / ${num(g.daysPerMonth)}`, `<div class="k-delta ${overMonth ? 'delta-bad' : ''}">${overMonth ? '▲ over the monthly allowance' : 'days this month'}</div>`)}
    ${kpi('Term elapsed', st.termDays ? pct(st.elapsed / st.termDays * 100) : '—', `<div class="k-delta">${st.daysLeftInTerm} calendar days to ${fmtD(g.end)}</div>`)}
    <div class="kpi ${flag ? 'kpi-flag' : ''}"><div class="k-label">⚑ Delays & changes</div><div class="k-value">${st.openDelays.length} open</div><div class="k-delta ${st.totalSlip > 0 ? 'delta-bad' : ''}">${st.totalSlip > 0 ? `+${st.totalSlip} days total slip` : 'no slip logged'}</div></div>
    <div class="kpi ${st.overdue.length ? 'kpi-flag' : ''}"><div class="k-label">Waiting on client</div><div class="k-value">${st.reqs.filter((r) => r._status === 'Waiting' || r._status === 'Overdue').length}</div><div class="k-delta ${st.overdue.length ? 'delta-bad' : ''}">${st.overdue.length} overdue</div></div>
    ${sv.target ? kpi('Savings approved / month', fmtMoney(sv.approved), `<div class="k-delta">target ${fmtMoney(sv.target)} · realised ${fmtMoney(sv.realised)}</div>`) : ''}
  </div>`;

  const delays = `<section class="card flag-card" id="delays"><header class="card-h"><div><h3>⚑ Delays & changes log</h3><p class="sub">Every slip, whatever the cause, with its date, reason, impact and the date written notice was given. This section appears in every status report. Log TGM-side slips too: that's what makes the log credible.</p></div><button class="btn" data-action="addDelay">+ Log delay / change</button></header>
    ${g.delays.length ? `<div class="scroll-x"><table class="tbl grid-edit"><thead><tr><th>Raised</th><th>Phase</th><th>Cause</th><th>What happened</th><th>Days impact</th><th>Written notice sent</th><th>Status</th><th>Resolution / action</th><th></th></tr></thead><tbody>
      ${g.delays.slice().sort((a, b) => (b.dateRaised || '').localeCompare(a.dateRaised || '')).map((d) => `<tr class="${d.status === 'Resolved' ? '' : 'row-flag'}"><td>${ecell('engagement.delays', d, 'dateRaised', 'date')}</td><td>${ecellSel('engagement.delays', d, 'phaseId', phaseOpts)}</td><td>${ecellSel('engagement.delays', d, 'cause', DELAY_CAUSES)}</td><td>${ecellArea('engagement.delays', d, 'description')}</td><td>${ecell('engagement.delays', d, 'daysImpact', 'number', 'style="width:70px"')}</td><td>${ecell('engagement.delays', d, 'noticeDate', 'date')}</td><td>${ecellSel('engagement.delays', d, 'status', ['Open', 'Resolved'], false)}</td><td>${ecellArea('engagement.delays', d, 'resolution')}</td><td>${delBtn('engagement.delays', d.id)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="empty">No delays or changes logged. That will show as "none recorded" in status reports, which is itself worth reporting.</p>'}
    ${st.totalSlip > 0 ? `<p class="small delta-bad">⚑ ${st.totalSlip} days of slip logged. The contract end date (${fmtD(g.end)}) is fixed, so later phases are compressed unless an extension is agreed in writing (clauses 2.4 and 5.7).</p>` : ''}
  </section>`;

  const reqs = card(`Waiting on client (${st.reqs.filter((r) => r._status === 'Waiting' || r._status === 'Overdue').length} open · ${st.overdue.length} overdue)`, `<div class="scroll-x"><table class="tbl grid-edit"><thead><tr><th>Status</th><th>Item</th><th>Owner</th><th>Requested</th><th>Due</th><th>Received</th><th>Override</th><th>Notes</th><th></th></tr></thead><tbody>
    ${st.reqs.map((r) => `<tr class="${r._status === 'Overdue' ? 'row-flag' : ''}"><td>${reqChip(r._status)}${r._status === 'Overdue' ? `<div><button class="link small" data-action="delayFromRequest" data-id="${esc(r.id)}">⚑ Log as delay</button></div>` : ''}</td><td>${ecellArea('engagement.requests', r, 'item')}</td><td>${ecell('engagement.requests', r, 'owner')}</td><td>${ecell('engagement.requests', r, 'requestedDate', 'date')}</td><td>${ecell('engagement.requests', r, 'dueDate', 'date')}</td><td>${ecell('engagement.requests', r, 'receivedDate', 'date')}</td><td>${ecellSel('engagement.requests', r, 'status', ['Not needed', 'Not available'])}</td><td>${ecellArea('engagement.requests', r, 'notes')}</td><td>${delBtn('engagement.requests', r.id)}</td></tr>`).join('')}
    </tbody></table></div><div class="btn-row"><button class="btn sm" data-action="addRow" data-coll="engagement.requests">+ Add request</button></div>`, { sub: 'Requests become Overdue automatically after their due date. Log a delay when a late item holds up the work.' });

  const actCol = (title, list, empty) => `<div class="act-col"><h4>${title} (${list.length})</h4>${list.length ? list.map((a) => `<div class="act ${a.status === 'Waiting on client' ? 'act-wait' : ''}"><div class="act-top">${ecellArea('engagement.activities', a, 'title', 1)}</div><div class="act-meta">${ecellSel('engagement.activities', a, 'phaseId', phaseOpts)} ${ecell('engagement.activities', a, a.status === 'Done' ? 'doneDate' : 'due', 'date')} ${ecellSel('engagement.activities', a, 'status', ACTIVITY_STATUSES, false)} ${delBtn('engagement.activities', a.id)}</div></div>`).join('') : `<p class="empty">${empty}</p>`}</div>`;
  const acts = card('What\'s done, what\'s happening, what\'s next', `<div class="act-grid">${actCol('✓ Done', st.done, 'Nothing completed yet.')}${actCol('● In progress / waiting', st.doing, 'Nothing in progress.')}${actCol('→ Next', st.next, 'Nothing queued.')}</div><div class="btn-row"><button class="btn sm" data-action="addActivity">+ Add activity</button></div>`, { sub: 'Marking an activity Done stamps today\'s date automatically.' });

  const timeRows = g.timeLog.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const time = card(`Time log: ${st.used.toFixed(1)} of ${num(g.daysTotal)} days used`, `<div class="grid-2">
      <div><h4>By phase (used vs planned)</h4>${hbars(g.phases.map((p) => ({ label: p.name, value: num(st.byPhase[p.id] || 0), tip: `${num(st.byPhase[p.id] || 0)} used of ${num(p.plannedDays)} planned`, color: num(st.byPhase[p.id] || 0) > num(p.plannedDays) ? 'var(--crit)' : 'var(--s1)' })), { fmt: (v) => v.toFixed(1) + ' d', max: Math.max(1, ...g.phases.map((p) => Math.max(num(p.plannedDays), num(st.byPhase[p.id] || 0)))) })}</div>
      <div><h4>By contract month (allowance ${num(g.daysPerMonth)})</h4>${hbars([1, 2, 3].map((m) => ({ label: `Month ${m}`, value: num(st.byMonth[m] || 0), color: num(st.byMonth[m] || 0) > num(g.daysPerMonth) ? 'var(--crit)' : 'var(--s3)' })), { fmt: (v) => v.toFixed(1) + ' d', max: Math.max(num(g.daysPerMonth), ...Object.values(st.byMonth)) })}
      <p class="faint small">Unused Month-2 days may carry into Month 3 by written agreement; the total of ${num(g.daysTotal)} cannot increase (clause 3.4).</p></div></div>
    <div class="scroll-x"><table class="tbl grid-edit"><thead><tr><th>Date</th><th>Phase</th><th>Days</th><th>What was done</th><th>Notes</th><th></th></tr></thead><tbody>
    ${timeRows.map((t) => `<tr><td>${ecell('engagement.timeLog', t, 'date', 'date')}</td><td>${ecellSel('engagement.timeLog', t, 'phaseId', phaseOpts)}</td><td>${ecellSel('engagement.timeLog', t, 'days', ['0.25', '0.5', '0.75', '1'], false)}</td><td>${ecellArea('engagement.timeLog', t, 'activity', 1)}</td><td>${ecellArea('engagement.timeLog', t, 'notes', 1)}</td><td>${delBtn('engagement.timeLog', t.id)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No time logged yet.</td></tr>'}
    </tbody></table></div><div class="btn-row"><button class="btn sm" data-action="addTime">+ Log time</button></div>`, { sub: 'Logged in half days (8-hour day), as in the contract. Reported at every fortnightly review.' });

  const savings = sv.target ? card('Savings tracker (contract)', savingsBlock(sv), { sub: 'Monthly recurring savings, net of new recurring costs. Stage comes from each recommendation\'s status.' }) : '';

  const phases = card('Phases', `<div class="scroll-x"><table class="tbl grid-edit"><thead><tr><th>Phase</th><th>Start</th><th>End</th><th>Planned days</th><th>Used</th><th>Status</th><th>Deliverables</th></tr></thead><tbody>
    ${g.phases.map((p) => `<tr><td>${ecell('engagement.phases', p, 'name')}</td><td>${ecell('engagement.phases', p, 'start', 'date')}</td><td>${ecell('engagement.phases', p, 'end', 'date')}</td><td>${ecell('engagement.phases', p, 'plannedDays', 'number', 'style="width:70px"')}</td><td class="r">${num(st.byPhase[p.id] || 0).toFixed(1)}</td><td>${ecellSel('engagement.phases', p, 'status', PHASE_STATUSES, false)}</td><td>${ecellArea('engagement.phases', p, 'deliverables')}</td></tr>`).join('')}</tbody></table></div>
    <details class="small"><summary>Contract settings</summary><div class="form-grid">${field('engagement.contact', 'Point of contact', g.contact)}${field('engagement.contactRole', 'Role', g.contactRole)}${field('engagement.start', 'Start', g.start, { type: 'date' })}${field('engagement.end', 'End', g.end, { type: 'date' })}${field('engagement.daysTotal', 'Days total', g.daysTotal, { type: 'number' })}${field('engagement.daysPerMonth', 'Days / month', g.daysPerMonth, { type: 'number' })}${field('engagement.targetMonthly', 'Monthly savings target', g.targetMonthly, { type: 'number' })}${field('engagement.baselineMonthly', 'Agreed monthly cost baseline', g.baselineMonthly, { type: 'number' })}${field('engagement.reviewDates', 'Review dates', g.reviewDates)}</div></details>`);

  return `<div class="page-h"><div><span class="eyebrow">Progress & time</span><h1>Where the engagement stands</h1><p class="muted">Point of contact: <strong>${esc(g.contact || '—')}</strong>${g.contactRole ? ' · ' + esc(g.contactRole) : ''}. Next review: <strong>${esc(fmtD(splitList(g.reviewDates).find((d) => d >= st.today) || ''))}</strong>.</p></div>
    <div class="btn-row"><button class="btn" data-action="statusReport">Status report →</button></div></div>
    ${kpis}${card('Timeline', phaseGantt(e))}${delays}<div class="grid-2">${acts}${reqs}</div>${time}${savings}${phases}`;
}

function savingsBlock(sv) {
  const mx = Math.max(sv.target, sv.identified, 1);
  const bar = (v, c, label) => `<div class="sv-row"><span>${label}</span><div class="sv-track"><span style="width:${v / mx * 100}%;background:${c}"></span><i style="left:${sv.target / mx * 100}%" title="Target"></i></div><b>${fmtMoney(v)}</b></div>`;
  return `<div class="sv">${bar(sv.identified, 'var(--seq-3)', 'Identified')}${bar(sv.approved, 'var(--seq-5)', 'Approved')}${bar(sv.realised, 'var(--seq-7)', 'Realised')}
    <p class="small muted">Target ${fmtMoney(sv.target)}/month (marker line)${sv.baseline ? ` against an agreed baseline of ${fmtMoney(sv.baseline)}/month` : ' · baseline not yet agreed'}. Reported separately: one-off savings ${fmtMoney(sv.oneOffSavings)}; one-off costs of approved items ${fmtMoney(sv.oneOffCosts)}; time freed ${Math.round(sv.hours)} hrs/month (capacity, not cash).</p></div>
    ${sv.rows.length ? `<table class="tbl"><thead><tr><th>Initiative</th><th>Stage</th><th class="r">Net recurring / month</th><th class="r">One-off cost</th><th class="r">Hours freed / mo</th></tr></thead><tbody>${sv.rows.map((r) => `<tr class="${r.stage === 'Rejected' ? 'row-removed' : ''}"><td>${esc(r.rec.title)}</td><td><span class="chip ${r.stage === 'Realised' ? 'st-added' : r.stage === 'Approved' || r.stage === 'In progress' ? 'st-changed' : ''}">${esc(r.stage)}</span></td><td class="r ${r.monthlyNet < 0 ? 'delta-bad' : ''}">${fmtMoney(r.monthlyNet)}</td><td class="r">${fmtMoney(r.oneOffCost)}</td><td class="r">${Math.round(r.hoursMonth)}</td></tr>`).join('')}</tbody></table>` : ''}`;
}

/* ---------- Discovery: coverage, founder intake, interview capture ---------- */
function viewDiscovery(e) {
  if (ui.capture) return viewCapture(e);
  const cov = coverage(e); const mx = Math.max(1, ...cov.rows.flatMap((r) => r.counts));
  const cell = (n) => { if (!n) return '<td class="cov-0">—</td>'; const k = Math.min(6, Math.floor(n / mx * 6.999)); return `<td style="background:${SEQ[k]};color:${k >= 4 ? '#fff' : 'var(--ink)'}">${n}</td>`; };
  const covTable = `<table class="heat cov"><tr><th>Criterion</th>${cov.cols.map((c) => `<th>${c}</th>`).join('')}<th>Total</th><th>Feeds</th></tr>
    ${cov.rows.map((r) => `<tr><th>${esc(r.c.label)}</th>${r.counts.map(cell).join('')}<td><strong>${r.total}</strong>${r.total === 0 ? ' <span class="chip sev-high">▲ gap</span>' : r.total < 3 ? ' <span class="chip sev-medium">● thin</span>' : ''}</td><td class="faint small">${esc(r.c.feeds)}</td></tr>`).join('')}</table>`;
  const people = e.people.slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  const done = new Set(e.interviews.map((i) => i.personId));
  const sections = INTAKE_SECTIONS;
  const intake = e.intake.length ? e.intake.map((r) => `<details class="intake"><summary><strong>${esc(r.respondent)}</strong> <span class="muted small">${esc(r.role)} · ${esc(r.timestamp || r.date)} · ${Object.keys(r.answers).length} answers</span></summary>
      ${sections.map((s) => { const qs = s.questions.filter((q) => r.answers[q.id]); return qs.length ? `<h5>${esc(s.title)}</h5><dl>${qs.map((q) => `<dt>${esc(q.q)} <span class="chip">${esc((CRITERIA.find((c) => c.id === q.crit) || {}).label || '')}</span></dt><dd>${esc(r.answers[q.id])}</dd>`).join('')}</dl>` : ''; }).join('')}</details>`).join('')
    : '<p class="empty">No founder responses yet.</p>';
  return `<div class="page-h"><div><span class="eyebrow">Discovery</span><h1>What we know, and where the gaps are</h1><p class="muted">Every answer is stored against a discovery criterion. Coverage shows which criteria are well evidenced and which still need questions.</p></div>
    <div class="btn-row"><button class="btn" data-action="startCapture">+ Capture an interview</button></div></div>
  ${card('Discovery coverage (answers per criterion)', `<div class="scroll-x">${covTable}</div>`, { sub: 'Darker means more evidence. "Gap" and "thin" show where to aim the next interviews.' })}
  <div class="grid-2">
    ${card(`Founder questionnaire (${e.intake.length} responses)`, `<div class="btn-row"><label class="btn sm">Import responses CSV<input type="file" accept=".csv,text/csv" id="intakeFile" hidden></label></div>
      <p class="faint small">In the responses Google Sheet: File → Download → CSV, then import it here. Re-importing updates existing responses. Or ask Claude to read the Sheet from your Drive and produce the JSON.</p>${intake}`)}
    ${card('Interview checklist', people.length ? `<table class="tbl"><thead><tr><th>Person</th><th>Level</th><th>Question set</th><th></th></tr></thead><tbody>${people.map((p) => { const d = e.departments.find((x) => x.id === p.departmentId); const dt = deptType(d); return `<tr><td>${esc(p.name)}<div class="faint small">${esc(p.title || '')}</div></td><td>${esc(guessLevel(e, p))}</td><td class="small">${esc((DEPT_TYPES.find((x) => x[0] === dt) || ['', 'core only'])[1])}</td><td>${done.has(p.id) ? '<span class="chip st-added">✓ Interviewed</span>' : `<button class="btn sm" data-action="startCapture" data-id="${esc(p.id)}">Interview</button>`}</td></tr>`; }).join('')}</tbody></table>` : '<p class="empty">Add the org chart (People) first. The checklist and question sets then build themselves from it.</p>', { sub: 'Built from the org chart. Level and department decide each person\'s questions.' })}
  </div>`;
}

const DRAFT_KEY = () => STORE_KEY + '.draft';
function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY()) || 'null'); } catch (err) { return null; } }
function saveDraft(d) { try { localStorage.setItem(DRAFT_KEY(), JSON.stringify(d)); } catch (err) { /* ignore */ } }

function viewCapture(e) {
  const d = ui.draft;
  const p = e.people.find((x) => x.id === d.personId);
  const dept = e.departments.find((x) => x.id === (p ? p.departmentId : d.departmentId));
  const dtype = d.deptType || deptType(dept);
  const set = questionSet(d.level, dtype);
  const critLabel = (id) => (CRITERIA.find((c) => c.id === id) || {}).label || id;
  const qBlock = (title, qs) => qs.length ? `<h4>${title}</h4>${qs.map((q) => `<div class="qa"><label><span>${esc(q.q)}</span><span class="chip">${esc(critLabel(q.crit))}</span></label><textarea data-draft="answers.${q.id}" rows="2">${esc(d.answers[q.id] || '')}</textarea></div>`).join('')}` : '';
  const filled = Object.values(d.answers).filter((v) => String(v).trim()).length;
  const total = set.core.length + set.level.length + set.dept.length;
  return `<div class="page-h"><div><span class="eyebrow">Capture interview${d.editingId ? ' (editing)' : ''}</span><h1>${esc(p ? p.name : (d.personLabel || 'New interview'))}</h1><p class="muted">${filled} of ${total} questions answered. Your draft saves as you type. Skip anything that doesn't fit, and use Unexpected points for whatever comes up.</p></div>
    <div class="btn-row"><button class="btn" data-action="saveCapture">Save interview</button><button class="btn ghost" data-action="cancelCapture">Close</button></div></div>
  <div class="capture">
    <aside class="card">
      <label class="fld"><span>Person (from org chart)</span>${sel(e.people.map((x) => [x.id, x.name + (x.title ? ' · ' + x.title : '')]), d.personId, 'data-draftsel="personId"')}</label>
      ${p ? '' : `<label class="fld"><span>…or name / role if not on the org chart</span><input data-draft="personLabel" value="${esc(d.personLabel || '')}"></label>`}
      <label class="fld"><span>Level</span>${sel([['founder', 'Founder / director'], ['manager', 'Manager'], ['staff', 'Team member']], d.level, 'data-draftsel="level"', false)}</label>
      <label class="fld"><span>Department question set</span>${sel(DEPT_TYPES, dtype, 'data-draftsel="deptType"')}</label>
      <label class="fld"><span>Date</span><input type="date" data-draft="date" value="${esc(d.date)}"></label>
      <label class="fld"><span>Interviewer</span><input data-draft="interviewer" value="${esc(d.interviewer || '')}"></label>
      <label class="fld"><span>Duration (minutes)</span><input type="number" data-draft="durationMins" value="${esc(d.durationMins || '')}"></label>
      <label class="tog"><input type="checkbox" data-draftchk="logTime" ${d.logTime ? 'checked' : ''}> Add to time log (Listening phase)</label>
      <h5>Wrap-up</h5>
      <label class="fld"><span>Summary (2–3 lines)</span><textarea data-draft="summary" rows="3">${esc(d.summary || '')}</textarea></label>
      <label class="fld"><span>Themes (comma separated, keep consistent)</span><input data-draft="themes" value="${esc(d.themes || '')}" list="themeList"><datalist id="themeList">${themeCounts(e).map((t) => `<option value="${esc(t.theme)}">`).join('')}</datalist></label>
      <label class="fld"><span>Pain points (one per line)</span><textarea data-draft="painPoints" rows="3">${esc(d.painPoints || '')}</textarea></label>
      <label class="fld"><span>Ideas</span><textarea data-draft="ideas" rows="2">${esc(d.ideas || '')}</textarea></label>
      <label class="fld"><span>Quote worth keeping</span><textarea data-draft="quotes" rows="2">${esc(d.quotes || '')}</textarea></label>
    </aside>
    <div class="card qcol">
      ${qBlock('Core questions (everyone)', set.core)}
      ${qBlock(d.level === 'founder' ? 'Founder questions' : d.level === 'manager' ? 'Manager questions' : 'Team member questions', set.level)}
      ${qBlock(dtype ? `${(DEPT_TYPES.find((x) => x[0] === dtype) || ['', ''])[1]} questions` : '', set.dept)}
      <h4>Unexpected points</h4><p class="faint small">Anything outside the script. Tag each one so it still lands against a criterion.</p>
      ${(d.outliers || []).map((o, i) => `<div class="qa outlier"><textarea data-draft="outliers.${i}.text" rows="2" placeholder="What came up?">${esc(o.text || '')}</textarea>${sel(CRITERIA.map((c) => [c.id, c.label]), o.crit, `data-draftsel="outliers.${i}.crit"`)}</div>`).join('')}
      <button class="btn sm" data-action="addOutlier">+ Add unexpected point</button>
    </div>
  </div>`;
}

/* ---------- Client status report ---------- */
function renderStatusReport(e) {
  const g = e.engagement; const st = engagementStatus(e); const sv = savingsTracker(e);
  const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const nextReview = splitList(g.reviewDates).find((d) => d > st.today);
  const awaiting = e.recommendations.filter((r) => r.status === 'Identified');
  const waiting = st.reqs.filter((r) => r._status === 'Waiting' || r._status === 'Overdue').sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
  let h = `<header class="rpt-cover"><div class="rpt-brand">THE <strong>GROWTH</strong> MACHINE</div><h1>Status report</h1><p class="rpt-client">${esc(e.client.name)}</p>
    <p class="rpt-meta">As at ${date}${g.contact ? ` · For ${esc(g.contact)}` : ''} · Engagement ${fmtD(g.start, { day: 'numeric', month: 'short', year: 'numeric' })} – ${fmtD(g.end, { day: 'numeric', month: 'short', year: 'numeric' })} · Confidential</p></header>`;
  h += `<section class="rpt-sec"><h2>At a glance</h2><div class="kpis">
    ${kpi('Current phase', esc(st.current ? st.current.name : '—'))}
    ${kpi('Consulting days used', `${st.used.toFixed(1)} of ${num(g.daysTotal)}`, `<div class="k-delta">${st.remaining.toFixed(1)} remaining · month ${Math.max(1, st.thisMonth)}: ${num(st.byMonth[st.thisMonth] || 0).toFixed(1)} of ${num(g.daysPerMonth)}</div>`)}
    ${kpi('Term elapsed', st.termDays ? pct(st.elapsed / st.termDays * 100) : '—', `<div class="k-delta">${st.daysLeftInTerm} days to go</div>`)}
    <div class="kpi ${st.openDelays.length || st.totalSlip ? 'kpi-flag' : ''}"><div class="k-label">⚑ Delays & changes</div><div class="k-value">${st.openDelays.length} open</div><div class="k-delta">${st.totalSlip ? `+${st.totalSlip} days slip in total` : 'none affecting the timeline'}</div></div>
    ${kpi('Waiting on you', `${waiting.length} items`, `<div class="k-delta ${st.overdue.length ? 'delta-bad' : ''}">${st.overdue.length} overdue</div>`)}
    ${sv.target ? kpi('Savings approved', `${fmtMoney(sv.approved)}/mo`, `<div class="k-delta">target ${fmtMoney(sv.target)}/mo</div>`) : ''}
  </div>${nextReview ? `<p class="small muted">Next review: ${fmtD(nextReview, { weekday: 'long', day: 'numeric', month: 'long' })}.</p>` : ''}</section>`;
  h += `<section class="rpt-sec"><h2>Where we are in the plan</h2>${phaseGantt(e, { compact: true })}</section>`;
  h += `<section class="rpt-sec flag-sec"><h2>⚑ Delays & changes</h2>${g.delays.length ? `<table class="tbl"><thead><tr><th>Raised</th><th>Phase</th><th>Cause</th><th>What happened</th><th class="r">Impact</th><th>Notice</th><th>Status / action</th></tr></thead><tbody>
    ${g.delays.slice().sort((a, b) => (a.dateRaised || '').localeCompare(b.dateRaised || '')).map((d) => `<tr><td class="nowrap">${fmtD(d.dateRaised)}</td><td>${esc((g.phases.find((p) => p.id === d.phaseId) || {}).name || '—')}</td><td>${esc(d.cause || '')}</td><td>${esc(d.description || '')}</td><td class="r">${num(d.daysImpact) ? '+' + num(d.daysImpact) + ' days' : '—'}</td><td class="nowrap">${d.noticeDate ? fmtD(d.noticeDate) : '—'}</td><td>${d.status === 'Resolved' ? '✓ Resolved' : '⚑ Open'}${d.resolution ? ' · ' + esc(d.resolution) : ''}</td></tr>`).join('')}</tbody></table>
    ${st.totalSlip ? `<p class="small">The end date (${fmtD(g.end, { day: 'numeric', month: 'long', year: 'numeric' })}) is fixed. The ${st.totalSlip} days of slip will be absorbed by reprioritising the later phases, unless a change is agreed in writing.</p>` : ''}` : '<p>No delays or changes recorded in this period.</p>'}</section>`;
  const li = (a) => `<li>${esc(a.title)}${a.due && a.status !== 'Done' ? ` <span class="muted small">· due ${fmtD(a.due)}</span>` : ''}${a.doneDate && a.status === 'Done' ? ` <span class="muted small">· ${fmtD(a.doneDate)}</span>` : ''}${a.status === 'Waiting on client' ? ' <span class="chip st-changed">waiting on client</span>' : ''}</li>`;
  h += `<section class="rpt-sec"><div class="rpt-2"><div><h3>✓ Done</h3>${st.done.length ? `<ul>${st.done.map(li).join('')}</ul>` : '<p class="muted">—</p>'}</div><div><h3>● In progress</h3>${st.doing.length ? `<ul>${st.doing.map(li).join('')}</ul>` : '<p class="muted">—</p>'}<h3>→ Next</h3>${st.next.length ? `<ul>${st.next.slice(0, 8).map(li).join('')}</ul>` : '<p class="muted">—</p>'}</div></div></section>`;
  h += `<section class="rpt-sec"><h2>What we need from you</h2>${waiting.length ? `<table class="tbl"><thead><tr><th>Item</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>${waiting.map((r) => `<tr><td>${esc(r.item)}</td><td>${esc(r.owner || '')}</td><td class="nowrap">${fmtD(r.dueDate)}</td><td>${r._status === 'Overdue' ? '▲ Overdue' : 'Waiting'}</td></tr>`).join('')}</tbody></table>` : '<p>Nothing outstanding. Thank you.</p>'}
    ${awaiting.length ? `<h3>Decisions awaiting approval</h3><ul>${awaiting.map((r) => `<li>${esc(r.title)}</li>`).join('')}</ul>` : ''}</section>`;
  h += `<section class="rpt-sec"><h2>Time used</h2><div class="rpt-2"><div><h3>By phase</h3>${hbars(g.phases.map((p) => ({ label: p.name, value: num(st.byPhase[p.id] || 0), tip: `${num(p.plannedDays)} planned` })), { fmt: (v) => v.toFixed(1) + ' d', max: Math.max(1, ...g.phases.map((p) => Math.max(num(p.plannedDays), num(st.byPhase[p.id] || 0)))) })}</div>
    <div><h3>By contract month</h3>${hbars([1, 2, 3].map((m) => ({ label: `Month ${m}`, value: num(st.byMonth[m] || 0) })), { fmt: (v) => `${v.toFixed(1)} of ${num(g.daysPerMonth)} d`, max: Math.max(num(g.daysPerMonth), ...Object.values(st.byMonth)), color: 'var(--s3)' })}</div></div></section>`;
  if (sv.target) h += `<section class="rpt-sec"><h2>Savings tracker</h2>${savingsBlock(sv)}</section>`;
  h += `<footer class="rpt-foot">The Growth Machine · Status report generated ${date}. Figures are working estimates until validated against the agreed baseline.</footer>`;
  return h;
}

/* ============================================================
   Founder report — rendered from the engagement, exportable as PDF (print) or standalone HTML
   ============================================================ */
function renderReport(e) {
  const r = e.report, sec = r.sections, anon = !!r.anonymise;
  const scId = r.scenarioId || '';
  const cur = stateFor(e, 'current');
  const hasScenario = !!scId;
  const next = hasScenario ? stateFor(e, scId) : null;
  const base = metrics(cur); const rev = annualRevenue(e);
  const imp = hasScenario ? scenarioImpact(e, scId) : null;
  const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const scored = scoreRecommendations(e);
  const inScope = hasScenario ? scored.filter((x) => scenarioRecIds(e, scId).includes(x.rec.id)) : scored.filter((x) => x.rec.status !== 'Rejected');
  const ins = insights(e, fmtMoney, anon).filter((x) => x.severity !== 'low').slice(0, 8);
  const para = (t) => String(t || '').split(/\n{2,}/).map((p) => `<p>${esc(p)}</p>`).join('');
  let h = '';

  h += `<header class="rpt-cover"><div class="rpt-brand">THE <strong>GROWTH</strong> MACHINE</div>
    <h1>${esc(r.title || 'Operational Diagnostic')}</h1>
    <p class="rpt-client">${esc(e.client.name)}</p>
    <p class="rpt-meta">Prepared for ${esc(r.preparedFor || 'the founders')} · ${date} · Confidential</p></header>`;

  if (r.summary) h += `<section class="rpt-sec"><h2>Executive summary</h2>${para(r.summary)}
    ${imp ? `<div class="kpis">${kpi('Recommended scenario', esc(scenarioName(e, scId)))}${kpi('Annual cash saving', fmtMoney(imp.cashSaving))}${kpi('Revenue uplift', fmtMoney(imp.revenueUplift))}${kpi('One-off investment', fmtMoney(imp.oneOff))}${kpi('Payback', imp.paybackMonths == null ? '—' : imp.paybackMonths.toFixed(1) + ' months')}</div>` : ''}</section>`;

  if (sec.snapshot) h += `<section class="rpt-sec"><h2>Where the business is today</h2>
    <div class="kpis">${kpi('Run-rate revenue', fmtMoney(rev))}${kpi('Headcount', `${base.headcount}`)}${kpi('Annual payroll', fmtMoney(base.payroll))}${kpi('Payroll / revenue', rev ? pct(base.payroll / rev * 100) : '—')}${kpi('Tool spend / yr', fmtMoney(base.toolSpend))}${kpi('Mapped process hours / mo', hrs(base.procHours))}</div>
    <div class="rpt-2">
      <div><h3>People + tool cost by department</h3>${hbars(departmentScorecard(e, cur).map((d) => ({ label: d.dept.name, value: d.payroll + d.toolSpend, swatch: deptColor(e.departments, d.dept.id) })).sort((a, b) => b.value - a.value), { fmt: fmtMoney })}</div>
      <div><h3>Revenue by customer segment</h3>${hbars(e.segments.map((s) => ({ label: s.name, value: num(s.annualRevenue) })).sort((a, b) => b.value - a.value), { fmt: fmtMoney, color: 'var(--s2)' })}</div>
    </div></section>`;

  if (sec.findings && (e.findings.length || ins.length)) h += `<section class="rpt-sec"><h2>Key findings</h2>
    ${e.findings.length ? `<ol class="rpt-findings">${e.findings.map((f) => `<li>${sevChip(f.severity || 'medium')} <strong>${esc(f.title)}</strong><p>${esc(f.evidence || '')}</p></li>`).join('')}</ol>` : ''}
    ${ins.length ? `<h3>What the data shows</h3><ul class="insights">${ins.map((x) => `<li>${sevChip(x.severity)} <strong>${esc(x.title)}</strong><div class="muted small">${esc(x.detail)}</div></li>`).join('')}</ul>` : ''}</section>`;

  if (sec.org && cur.people.length) h += `<section class="rpt-sec rpt-break"><h2>Organisation${hasScenario ? ': current vs proposed' : ''}</h2>${orgLegend(e.departments)}
    <h3>Current</h3><div class="rpt-fig">${orgChart(cur.people, cur.departments, { anonymise: anon, showGhosts: false, showCost: false })}</div>
    ${hasScenario ? `<h3>Proposed: ${esc(scenarioName(e, scId))}</h3><div class="rpt-fig">${orgChart(next.people, next.departments, { anonymise: anon, showGhosts: true, showCost: false })}</div>` : ''}</section>`;

  if (sec.processes && (r.processIds || []).length) {
    h += `<section class="rpt-sec rpt-break"><h2>Process maps${hasScenario ? ': before and after' : ''}</h2>`;
    (r.processIds || []).forEach((pid) => {
      const p = cur.processes.find((x) => x.id === pid); if (!p) return;
      const pn = next ? next.processes.find((x) => x.id === pid) : null;
      h += `<h3>${esc(p.name)}</h3><p class="muted small">${hrs(processHours(p))}/month · ${pct(processManualHours(p) / Math.max(1, processHours(p)) * 100)} manual · about ${fmtMoney(processCostMonthly(p, cur) * 12)}/yr staff time${pn ? ` → after: ${hrs(processHours(pn))}/month, about ${fmtMoney(processCostMonthly(pn, next) * 12)}/yr` : ''}</p>
        <div class="rpt-fig">${swimlane(p, cur.people, cur.tools, { anonymise: anon })}</div>
        ${pn ? `<div class="rpt-fig">${swimlane(pn, next.people, next.tools, { anonymise: anon })}</div>` : ''}`;
    });
    h += '</section>';
  }

  if (sec.recommendations && inScope.length) {
    const horizons = ['0-3 months', '3-6 months', '6-12 months', '12+ months', ''];
    h += `<section class="rpt-sec rpt-break"><h2>Recommendations roadmap</h2><p class="muted small">Ranked by priority score: value, effort, risk and confidence.</p>`;
    horizons.forEach((hz) => {
      const items = inScope.filter((x) => (x.rec.horizon || '') === hz || (!hz && !horizons.includes(x.rec.horizon || '')));
      if (!items.length) return;
      h += `<h3>${hz || 'Unscheduled'}</h3><table class="tbl"><thead><tr><th>Recommendation</th><th class="r">Cash / yr</th><th class="r">Revenue / yr</th><th class="r">Hours freed / mo</th><th class="r">One-off</th><th class="r">Payback</th></tr></thead><tbody>
        ${items.map((x) => `<tr><td><strong>${esc(x.rec.title)}</strong> <span class="chip">${esc(x.rec.type || '')}</span><div class="muted small">${esc(x.rec.description || '')}</div></td><td class="r">${fmtMoney(x.cash)}</td><td class="r">${fmtMoney(x.revenue)}</td><td class="r">${Math.round(x.hoursSaved)}</td><td class="r">${fmtMoney(x.oneOff)}</td><td class="r">${x.payback == null ? '—' : x.payback.toFixed(1) + ' mo'}</td></tr>`).join('')}</tbody></table>`;
    });
    h += '</section>';
  }

  if (sec.financials && e.scenarios.length) {
    const rows = e.scenarios.map((s) => ({ s, i: scenarioImpact(e, s.id) }));
    h += `<section class="rpt-sec"><h2>Financial impact by scenario</h2>
      <table class="tbl"><thead><tr><th>Scenario</th><th class="r">Headcount Δ</th><th class="r">Payroll saving</th><th class="r">Tool saving</th><th class="r">Other saving</th><th class="r">Revenue uplift</th><th class="r">One-off</th><th class="r">Payback</th></tr></thead><tbody>
      ${rows.map(({ s, i }) => `<tr class="${s.id === scId ? 'rpt-hl' : ''}"><td><strong>${esc(s.name)}</strong><div class="muted small">${esc(s.description || '')}</div></td><td class="r">${i.headcountDelta}</td><td class="r">${fmtMoney(i.payrollSaving)}</td><td class="r">${fmtMoney(i.toolSaving)}</td><td class="r">${fmtMoney(i.otherSaving)}</td><td class="r">${fmtMoney(i.revenueUplift)}</td><td class="r">${fmtMoney(i.oneOff)}</td><td class="r">${i.paybackMonths == null ? '—' : i.paybackMonths.toFixed(1) + ' mo'}</td></tr>`).join('')}
      </tbody></table>
      <p class="muted small">Savings are annualised estimates from the modelled changes. Freed hours are shown as capacity and only become cash when roles change. Figures should be validated with finance before decisions are made.</p></section>`;
  }

  if (sec.nextSteps && r.nextSteps) h += `<section class="rpt-sec"><h2>Next steps</h2><ol>${splitList(r.nextSteps.replace(/^\s*\d+[.)]\s*/gm, '')).map((x) => `<li>${esc(x)}</li>`).join('')}</ol></section>`;
  h += `<footer class="rpt-foot">The Growth Machine · thegrowthmachine.co · ${date} · Confidential. Prepared for ${esc(e.client.name)}.</footer>`;
  return h;
}

function downloadReportHTML(e, kind) {
  const isStatus = kind === 'status';
  const css = (document.getElementById('viz-css') || {}).textContent + '\n' + (document.getElementById('report-css') || {}).textContent;
  const html = `<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc((isStatus ? 'Status report' : (e.report.title || 'Report')) + ' · ' + e.client.name)}</title><style>${css}
body{margin:0;background:#f6f1e9;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171715}
.rpt{max-width:1100px;margin:24px auto;}
</style></head><body><main class="rpt">${isStatus ? renderStatusReport(e) : renderReport(e)}</main></body></html>`;
  const slug = (e.client.name + '-' + (isStatus ? 'status-report' : (e.report.title || 'report'))).toLowerCase().replace(/[^a-z0-9]+/g, '-');
  downloadFile(`${slug}-${new Date().toISOString().slice(0, 10)}.html`, html, 'text/html');
}

/* ============================================================
   App shell — storage, routing, actions, data editor, Claude bridge
   ============================================================ */
const STORE_KEY = 'tgm.studio.v1';
const ui = { tab: 'overview', scenario: 'current', processId: '', anon: false, ghosts: true, showCost: true, compare: true, zoom: 1, area: 'All', recType: 'All', coll: 'people', theme: '', reportType: 'status', capture: false, draft: null };
let db = { activeId: '', engagements: {} };

/* ---------- storage (localStorage, wrapped; the JSON file export is the real backup) ---------- */
function loadDB() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) db = JSON.parse(raw); } catch (err) { console.warn('Storage unavailable', err); }
  if (!db.engagements || !Object.keys(db.engagements).length) {
    const lb = locationBankShell(), demo = demoEngagement();
    db = { activeId: demo.id, engagements: { [lb.id]: lb, [demo.id]: demo } };
  }
  Object.keys(db.engagements).forEach((k) => { db.engagements[k] = normalise(db.engagements[k]); });
  if (db.engagements.eng_demo && !db.engagements.eng_demo.engagement.phases.length) db.engagements.eng_demo = demoEngagement(); // refresh old demo with tracking sample
  if (!db.engagements[db.activeId]) db.activeId = Object.keys(db.engagements)[0];
  try { Object.assign(ui, JSON.parse(localStorage.getItem(STORE_KEY + '.ui') || '{}'), { scenario: 'current' }); } catch (err) { /* ignore */ }
}
let saveTimer = null;
function save() {
  E().meta.lastUpdated = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); setStatus('Saved in this browser'); }
    catch (err) { setStatus('⚠ Could not save in this browser. Export JSON to keep your work.'); }
  }, 250);
}
function saveUI() { try { localStorage.setItem(STORE_KEY + '.ui', JSON.stringify({ tab: ui.tab, anon: ui.anon, showCost: ui.showCost, ghosts: ui.ghosts, compare: ui.compare, coll: ui.coll, theme: ui.theme })); } catch (err) { /* ignore */ } }
const E = () => db.engagements[db.activeId];
function flagBadge(e) {
  if (!e.engagement.phases.length) return '';
  const st = engagementStatus(e); const n = st.openDelays.length, o = st.overdue.length;
  if (!n && !o && !st.totalSlip) return '<span class="flag-badge ok" title="No open delays or overdue client items">✓ On track</span>';
  return `<button class="flag-badge" data-action="tab" data-id="progress" title="Open the delays & changes log">⚑ ${n} open delay${n === 1 ? '' : 's'}${st.totalSlip ? ` · +${st.totalSlip}d` : ''}${o ? ` · ${o} overdue from client` : ''}</button>`;
}
function setStatus(t) { const el = document.getElementById('status'); if (el) el.textContent = t; }

/* ---------- formatting ---------- */
function fmtMoney(v) {
  v = num(v); const cur = (E() && E().meta.currency) || 'ZAR';
  try {
    return new Intl.NumberFormat('en-GB', { style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol', maximumFractionDigits: Math.abs(v) >= 1e6 ? 2 : 0, notation: Math.abs(v) >= 1e6 ? 'compact' : 'standard' }).format(v);
  } catch (err) { return cur + ' ' + Math.round(v).toLocaleString('en-GB'); }
}
function fmtShort(v) {
  v = num(v); const cur = (E() && E().meta.currency) || 'ZAR';
  try { return new Intl.NumberFormat('en-GB', { style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol', notation: 'compact', maximumFractionDigits: 1 }).format(v); }
  catch (err) { return Math.round(v).toLocaleString('en-GB'); }
}

/* ---------- path helpers ---------- */
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }
function setPath(obj, path, val) { const ks = path.split('.'); const last = ks.pop(); const t = ks.reduce((o, k) => (o[k] = o[k] || {}), obj); t[last] = val; }

function cellInput(e, coll, row, [f, type]) {

/* ---------- actions ---------- */
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type: type || 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const slugify = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function copyText(t, msg) {
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast(msg || 'Copied')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg || 'Copied'); } catch (err) { toast('Copy failed. Select the text manually.'); } ta.remove();
  });
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600); }
function stripMarks(o) { return JSON.parse(JSON.stringify(o, (k, v) => (k.startsWith('_') ? undefined : v))); }

const actions = {

  newEng: () => { const n = prompt('Client name?'); if (!n) return; const e = blankEngagement(n); db.engagements[e.id] = e; db.activeId = e.id; ui.scenario = 'current'; ui.tab = 'business'; save(); render(); },
  duplicateEng: () => { const e = clone(E()); e.id = uid('eng'); e.client.name += ' (copy)'; db.engagements[e.id] = e; db.activeId = e.id; save(); render(); },

    const { engagement, counts } = mergeEngagement(E(), obj); engagement.id = db.activeId; db.engagements[db.activeId] = engagement; save(); render();
