<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Growth Machine Studio</title>
<style id="viz-css">/* Shared visual tokens + chart/org/swimlane styles (also embedded in exported reports) */
:root{
  color-scheme:light;
  --bg:#f6f1e9;--surface:#fffdf9;--surface-2:#eee7dd;--ink:#171715;--muted:#665f57;--faint:#8a8074;--line:#d7cfc3;--grid:#e6dfd4;
  --red:#c8221c;--red-soft:rgba(200,34,28,.08);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--s-other:#9a948b;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --good-ink:#0a7a0a;--warn-ink:#8a5a00;--crit-ink:#b02a2a;
  --seq-1:#cde2fb;--seq-2:#9ec5f4;--seq-3:#6da7ec;--seq-4:#3987e5;--seq-5:#256abf;--seq-6:#184f95;--seq-7:#0d366b;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#141311;--surface:#1c1b19;--surface-2:#252320;--ink:#f0efec;--muted:#b9b1a7;--faint:#8f877d;--line:#3a3733;--grid:#2c2a27;
    --red:#e1453f;--red-soft:rgba(225,69,63,.12);
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s-other:#77726b;
    --good-ink:#4cc94c;--warn-ink:#fab219;--crit-ink:#ef7676;
    --seq-1:#1d2a3a;--seq-2:#104281;--seq-3:#184f95;--seq-4:#1c5cab;--seq-5:#2a78d6;--seq-6:#5598e7;--seq-7:#9ec5f4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141311;--surface:#1c1b19;--surface-2:#252320;--ink:#f0efec;--muted:#b9b1a7;--faint:#8f877d;--line:#3a3733;--grid:#2c2a27;
  --red:#e1453f;--red-soft:rgba(225,69,63,.12);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s-other:#77726b;
  --good-ink:#4cc94c;--warn-ink:#fab219;--crit-ink:#ef7676;
  --seq-1:#1d2a3a;--seq-2:#104281;--seq-3:#184f95;--seq-4:#1c5cab;--seq-5:#2a78d6;--seq-6:#5598e7;--seq-7:#9ec5f4;
}

/* ---- KPI tiles ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.kpi .k-value{font-family:Georgia,"Times New Roman",serif;font-size:28px;line-height:1.1;margin-top:6px;color:var(--ink)}
.kpi .k-value.k-text{font-size:18px;line-height:1.25}
.kpi .k-delta{font-size:12px;margin-top:4px;color:var(--muted)}
.delta-good{color:var(--good-ink)}.delta-bad{color:var(--crit-ink)}

/* ---- Horizontal bars ---- */
.hbars{display:grid;gap:6px}
.hbar{display:grid;grid-template-columns:minmax(90px,180px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar .hb-label{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .hb-track{height:14px;background:transparent;position:relative}
.hbar .hb-fill{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hbar .hb-val{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;min-width:64px;text-align:right}

/* ---- SVG charts ---- */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .axis text,.chart text.axis{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--ink);fill-opacity:.04}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---- Heatmap ---- */
.heat{border-collapse:separate;border-spacing:2px;font-size:12px}
.heat th{font-weight:600;color:var(--muted);text-align:left;padding:4px 6px;white-space:nowrap}
.heat th.col{writing-mode:vertical-rl;transform:rotate(180deg);height:120px;vertical-align:bottom;text-align:left}
.heat td{width:38px;height:28px;text-align:center;border-radius:4px;font-variant-numeric:tabular-nums}

/* ---- Org chart ---- */
.org-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;max-height:78vh}
.org svg{display:block}
.org .edge{fill:none;stroke:var(--line);stroke-width:1.5}
.org .node rect.card{fill:var(--surface);stroke:var(--line);stroke-width:1}
.org .node text{font-family:inherit;fill:var(--ink)}
.org .node .n-name{font-size:12.5px;font-weight:700}
.org .node .n-title{font-size:11px;fill:var(--muted)}
.org .node .n-meta{font-size:10px;fill:var(--faint)}
.org .node.removed{opacity:.6}
.org .node.removed rect.card{stroke:var(--crit);stroke-dasharray:5 4;stroke-width:1.5}
.org .node.added rect.card{stroke:var(--good);stroke-width:2}
.org .node.changed rect.card{stroke:var(--warn);stroke-width:2}
.org .badge text{font-size:9.5px;font-weight:700;fill:#fff}
.org .badge.b-removed rect{fill:var(--crit)}.org .badge.b-added rect{fill:#0a7a0a}.org .badge.b-changed rect{fill:#8a5a00}

/* ---- Swimlane ---- */
.lane-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lane svg{display:block}
.lane .band{fill:var(--surface)}.lane .band.alt{fill:var(--surface-2)}
.lane .lane-label{font-size:11.5px;font-weight:700;fill:var(--ink)}
.lane .lane-sub{font-size:10px;fill:var(--muted)}
.lane .step rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.lane .step.manual rect.box{stroke:var(--ink);stroke-opacity:.35}
.lane .step.auto rect.box{stroke:var(--s1);stroke-width:1.5;stroke-dasharray:3 2}
.lane .step.removed{opacity:.5}.lane .step.removed rect.box{stroke:var(--crit);stroke-dasharray:5 4}
.lane .step.added rect.box{stroke:var(--good);stroke-width:2}
.lane .step.changed rect.box{stroke:var(--warn);stroke-width:2}
.lane .step text{font-family:inherit;fill:var(--ink)}
.lane .s-name{font-size:11.5px;font-weight:700}.lane .s-tool{font-size:10px;fill:var(--muted)}.lane .s-time{font-size:10px;fill:var(--faint)}
.lane .flow{fill:none;stroke:var(--faint);stroke-width:1.5}
.lane .flow.ghost{stroke-dasharray:4 4;opacity:.5}
.lane .pain circle{fill:var(--crit)}.lane .pain text{fill:#fff;font-size:10px;font-weight:800}
.lane .io{font-size:10.5px;fill:var(--muted)}

/* ---- Status chips (always icon + label, never colour alone) ---- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.chip.sev-high{border-color:var(--crit);color:var(--crit-ink)}
.chip.sev-medium{border-color:var(--warn);color:var(--warn-ink)}
.chip.sev-low{border-color:var(--line);color:var(--muted)}
.chip.st-added{border-color:var(--good);color:var(--good-ink)}
.chip.st-removed{border-color:var(--crit);color:var(--crit-ink)}
.chip.st-changed{border-color:var(--warn);color:var(--warn-ink)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.score-bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:60px}
.score-bar span{display:block;height:100%;background:var(--red);border-radius:3px}

/* ---- Engagement tracking (shared with exported status reports) ---- */
.kpi.kpi-flag{border-color:var(--crit);box-shadow:inset 4px 0 0 var(--crit)}
.kpi.kpi-flag .k-label{color:var(--crit-ink);font-weight:700}
.flag-card{border:1.5px solid var(--crit)!important;box-shadow:inset 5px 0 0 var(--crit)}
.flag-card h3{color:var(--crit-ink)}
.rpt-sec.flag-sec{border:1.5px solid var(--crit);border-radius:10px;padding:16px 18px;margin:18px 0;box-shadow:inset 5px 0 0 var(--crit)}
.rpt-sec.flag-sec h2{color:var(--crit-ink)}
tr.row-flag td{background:rgba(208,59,59,.06)}
.nowrap{white-space:nowrap}
.gantt-wrap svg{width:100%;height:auto}
.gantt-svg .g-grid{stroke:var(--grid);stroke-width:1}
.gantt-svg .g-lab{font-size:10px;fill:var(--muted)}
.gantt-svg .g-name{font-size:11.5px;fill:var(--ink);font-weight:600}
.gantt-svg .g-bar.done{fill:var(--ink)}
.gantt-svg .g-bar.doing{fill:var(--red)}
.gantt-svg .g-bar.todo{fill:var(--grid);stroke:var(--faint);stroke-width:1}
.gantt-svg .g-bar.hold{fill:var(--warn)}
.gantt-svg .g-slip{fill:var(--crit);fill-opacity:.25;stroke:var(--crit);stroke-width:1.2;stroke-dasharray:3 2}
.gantt-svg .g-sliplab{font-size:10.5px;font-weight:800;fill:var(--crit-ink)}
.gantt-svg .g-review{stroke:var(--red);stroke-width:1.2;stroke-dasharray:4 3;opacity:.7}
.gantt-svg .g-today{stroke:var(--ink);stroke-width:2}
.gantt-svg .g-todaylab{font-size:10px;font-weight:700;fill:var(--ink)}
.legend i.hatch{background:repeating-linear-gradient(45deg,rgba(208,59,59,.35) 0 3px,transparent 3px 6px);outline:1px dashed var(--crit)}
.sv{display:grid;gap:8px;margin-bottom:12px}
.sv-row{display:grid;grid-template-columns:90px 1fr 120px;gap:10px;align-items:center;font-size:13px}
.sv-row b{text-align:right;font-variant-numeric:tabular-nums}
.sv-track{position:relative;height:16px;background:var(--grid);border-radius:4px}
.sv-track span{display:block;height:100%;border-radius:4px}
.sv-track i{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px solid var(--ink)}
.capm th.me{color:var(--red)}
.cap{font-size:11.5px;white-space:nowrap}.cap-s{color:var(--ink);font-weight:650}.cap-p{color:var(--muted)}.cap-n{color:var(--faint)}

.pos-map{max-width:760px}

/* ---- Flow schematic (serpentine process flow + client journey) ---- */
.flow-wrap{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;overflow:auto}
.flow-svg{display:block;margin:0 auto;font-family:inherit}
.flow-svg .link{fill:none;stroke:var(--faint);stroke-width:2}
.flow-svg .link.handoff{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:7 4}
.flow-svg .link.ghost{opacity:.35}
.flow-svg .fa{fill:var(--faint)}
.flow-svg .pill rect{fill:var(--ink)}
.flow-svg .pill text{fill:var(--surface);font-size:12.5px;font-weight:600}
.flow-svg .pill .pl{font-weight:800;letter-spacing:.1em}
.fnode .nb{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.fnode.manual .nb{stroke:var(--faint)}
.fnode.auto .nb{stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3}
.fnode .band{opacity:.24}
.fnode .num{fill:var(--ink)}
.fnode .numt{fill:var(--surface);font-size:11px;font-weight:800}
.fnode .team{font-size:10.5px;font-weight:800;letter-spacing:.09em;fill:var(--ink)}
.fnode .nm{font-size:13.5px;font-weight:700;fill:var(--ink)}
.fnode .act{font-size:11.5px;fill:var(--muted)}
.fnode .sep{stroke:var(--grid);stroke-width:1}
.fnode .tool{font-size:11px;fill:var(--muted);font-weight:600}
.fnode .mode{font-size:11px;fill:var(--faint)}
.fnode .mode.m-auto{fill:var(--s1);font-weight:700}
.fnode.clk:hover .nb{stroke:var(--ink)}
.fnode.sel .nb{stroke:var(--ink);stroke-width:3}
.fnode.removed{opacity:.45}.fnode.removed .nb{stroke:var(--crit);stroke-dasharray:6 4}
.fnode.added .nb{stroke:var(--good);stroke-width:2.5}.fnode.changed .nb{stroke:var(--warn);stroke-width:2.5}
.fnode .stt{font-size:10px;font-weight:800}.stt-removed{fill:var(--crit-ink)}.stt-added{fill:var(--good-ink)}.stt-changed{fill:var(--warn-ink)}
.fl circle,.fl path{stroke:var(--surface);stroke-width:2}
.fl-issue circle{fill:var(--crit)}.fl-unverified path{fill:var(--warn)}.fl-weakness path{fill:var(--s7)}
.fl text{font-size:10.5px;font-weight:800;fill:#fff;font-family:inherit}.fl-unverified text{fill:#1a1300}
.ho circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}.ho text{font-size:11px;font-weight:800;fill:var(--ink)}
.clk{cursor:pointer}
.fl-ico{vertical-align:middle;flex:none;overflow:visible}
.flow-legend{margin:8px 0}.flow-legend>span{display:inline-flex;align-items:center;gap:4px}
.ho-ico{display:inline-grid;place-items:center;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:50%;font-size:11px;font-weight:800}
.journey{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:4px}
.jstage{flex:1 1 0;min-width:170px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.jstage.jempty{border-style:dashed;background:transparent}
.jh{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.jn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:11px;letter-spacing:0}
.jarrow{align-self:center;font-size:26px;color:var(--faint);flex:none}
.jp{text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px;cursor:pointer;display:grid;gap:5px;font:inherit;color:var(--ink)}
.jp:hover{border-color:var(--ink)}.jp.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.jp strong{font-size:12.5px;line-height:1.25}
.jc{display:flex;gap:8px;flex-wrap:wrap}.jcn{display:inline-flex;align-items:center;gap:1px;font-size:12px;font-weight:700}.jcn .fl-ico{width:17px;height:17px}
.jother{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.jother .jp{max-width:300px}
.conf{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;padding:2px 8px;border:1.5px solid;width:max-content}
.conf-warn{border-color:var(--warn);color:var(--warn-ink)}.conf-s1{border-color:var(--s1);color:var(--s1)}.conf-good{border-color:var(--good);color:var(--good-ink)}
.pbrief{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.pbrief h5{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:12px 0 4px}
.pbrief .psum{font-size:14.5px;margin:10px 0 0}
.pbrief ul{margin:0;padding-left:18px;display:grid;gap:4px}
.flow-panels{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;margin-top:12px}
ol.flags{list-style:none;padding:0;margin:0;display:grid;gap:6px;max-height:560px;overflow:auto}
ol.flags li{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
ol.flags li:hover,ol.flags li.on{border-color:var(--ink)}
.sd{display:grid;grid-template-columns:96px minmax(0,1fr);gap:5px 10px;margin:8px 0}.sd dt{font-weight:600;color:var(--muted);font-size:12px}.sd dd{margin:0}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.warn-t{color:var(--warn-ink);font-weight:600}
.ownf{list-style:none;padding:0;margin:4px 0;display:grid;gap:6px}.ownf li{display:flex;gap:8px;align-items:center}
@media (max-width:820px){.pbrief,.flow-panels{grid-template-columns:1fr}}
.flow-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}.flow-tools .zl{min-width:62px;text-align:center}
.flow-wrap.zoomed{max-height:calc(100vh - 120px);cursor:grab}.flow-wrap.panning{cursor:grabbing;user-select:none}
.flow-split{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;align-items:start}
.flow-side{position:sticky;top:70px;max-height:calc(100vh - 84px);overflow:auto}
.flow-side .card{padding:14px}
@media (max-width:1100px){.flow-split{grid-template-columns:1fr}.flow-side{position:static;max-height:none}}
.fnode.dim,.flow-svg .link.dim{opacity:.28}
.fnode.nbr .nb{stroke:var(--ink);stroke-width:2}
.fnode.sel .nb{stroke:var(--red);stroke-width:3.5;animation:fpulse .7s ease-out 2}
@keyframes fpulse{0%{stroke-width:9}100%{stroke-width:3.5}}
.flow-svg .link.hl{stroke:var(--red);stroke-width:3.5;opacity:1}
.nbx{display:grid;gap:2px;text-align:left;width:100%;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);font:inherit;color:var(--ink);margin:6px 0}
.nbx.clk:hover{border-color:var(--ink)}.nbx-end{border-style:solid;opacity:.8}
.jh.clk{cursor:pointer}.jh.clk:hover{color:var(--ink)}
.flow-side h4{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink);line-height:1.3}.flow-side h5{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:12px 0 6px}
/* sense-check states */
.fnode.rvs-assumed .num{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}.fnode.rvs-assumed .numt{fill:var(--ink)}
.fnode.rvs-confirmed .num,.fnode.rvs-corrected .num{fill:var(--good)}.fnode.rvs-unsure .num{fill:var(--warn)}.fnode.rvs-unsure .numt{fill:#1a1300}
.fnode.rvs-not-done .num{fill:var(--crit)}.fnode.rvs-not-done .nb{stroke:var(--crit);stroke-dasharray:4 4}.fnode.rvs-not-done .nm{text-decoration:line-through}
.fnode.rvs-confirmed .nb,.fnode.rvs-corrected .nb{stroke:var(--good)}
.fnode.decision .nb{stroke:var(--s4);stroke-width:2.5}
.fnode .inv{font-size:11px;fill:var(--ink);font-style:italic}.fnode .inv-d{fill:var(--warn-ink);font-style:normal;font-weight:700}
.fnode .mode.m-assumed{fill:var(--warn-ink);font-weight:700}.fnode .mode.m-confirmed{fill:var(--good-ink);font-weight:700}
.rv-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--ink)}
.rv-dot.rv-assumed{background:var(--surface)}.rv-dot.rv-confirmed,.rv-dot.rv-corrected{background:var(--good);border-color:var(--good)}.rv-dot.rv-unsure{background:var(--warn);border-color:var(--warn)}.rv-dot.rv-not-done{background:var(--crit);border-color:var(--crit)}
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.rv-verdicts{margin-bottom:10px}.btn.sm.rvb.on.rvb-confirmed,.btn.sm.rvb.on.rvb-corrected{background:var(--good);border-color:var(--good);color:#fff}.btn.sm.rvb.on.rvb-unsure{background:var(--warn);border-color:var(--warn);color:#1a1300}.btn.sm.rvb.on.rvb-not-done{background:var(--crit);border-color:var(--crit);color:#fff}
.rv-mine{margin-top:8px;border:1px dashed var(--warn);border-radius:10px;padding:6px 10px}.rv-mine summary{cursor:pointer;font-weight:600;font-size:12.5px}
.rv-nav{margin-top:10px;justify-content:flex-end}.rv-setup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.rv-grid,.rv-setup{grid-template-columns:1fr}}
.step-edit{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--surface-2)}
.fnode.sel .nb{stroke:var(--red)!important;stroke-width:3.5}
/* journey view (lanes) */
.jl .jl-stage{fill:var(--surface-2)}.jl .jl-st{font-size:10.5px;font-weight:800;letter-spacing:.1em;fill:var(--muted)}.jl .jl-pn{font-size:12.5px;font-weight:700;fill:var(--ink)}
.jl .jl-lane{fill:var(--surface)}.jl .jl-lane.alt{fill:var(--surface-2)}.jl .jl-lane.other{fill:var(--surface-2);opacity:.6}
.jl .jl-ln{font-size:14px;font-weight:800;fill:var(--ink)}.jl .jl-ls{font-size:11.5px;fill:var(--muted)}
.jl .jl-link{fill:none;stroke:var(--faint);stroke-width:1.8}.jl .jl-link.ho{stroke:var(--ink);stroke-width:2.2;stroke-dasharray:6 4}.jl .fb{fill:var(--ink)}

<style>/* App chrome */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,h5{margin:0}
.app{display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
#topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.18em;white-space:nowrap;margin-right:auto}
.brand strong{letter-spacing:.12em}.brand .cog{color:var(--red);font-size:20px;letter-spacing:0}
.brand em{font-style:normal;font-family:Georgia,serif;letter-spacing:0;font-size:15px;color:var(--red);margin-left:4px}
.hsel{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hsel select{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);min-width:160px}
.hbtns{display:flex;gap:6px}
#nav{background:var(--surface);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.nav-btn{text-align:left;background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.on{background:var(--red-soft);color:var(--red);font-weight:650}
.nav-foot{margin-top:auto;padding:10px 12px;display:grid;gap:4px}
#main{padding:22px 26px 60px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-h h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.page-h p{max-width:820px;margin:6px 0 0}
.eyebrow{display:inline-block;text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;font-weight:750;color:var(--red);margin-bottom:6px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.empty{color:var(--faint);font-style:italic;margin:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.card-h:empty,.card-h:has(h3:empty){display:none}
.card-h h3{font-size:14px;font-weight:700}.card-h .sub{margin:3px 0 0;font-size:12px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.scroll-x{overflow-x:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--red);background:var(--red);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.sm{padding:4px 10px;font-size:12px;background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:550}
.btn.sm:hover{border-color:var(--ink)}
.btn.sm.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--crit-ink);border-color:var(--crit)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.link{background:none;border:0;color:var(--red);cursor:pointer;font-weight:650;padding:0;margin-left:8px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-right:10px;cursor:pointer}
.banner{background:var(--surface);border:1px solid var(--warn);border-left-width:4px;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.banner.err{border-color:var(--crit)}
select,input[type=text],input[type=number],input[type=date],input:not([type]),textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
select:focus,input:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px}
textarea{width:100%;resize:vertical}
.fld{display:grid;gap:4px;font-size:12px;color:var(--muted);margin-bottom:10px}
.fld input,.fld select,.fld textarea{font-size:13px;color:var(--ink);width:100%}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.form-grid.wide{grid-template-columns:repeat(2,minmax(0,1fr))}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:top}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.tbl .c{text-align:center}
.tbl tr:hover td{background:var(--surface-2)}
.row-removed td,.row-removed{opacity:.55;text-decoration:line-through;text-decoration-color:var(--crit)}
.row-removed .chip{text-decoration:none}
.tbl.matrix td.c{color:var(--ink);font-size:12px}
.grid-edit td{padding:3px 4px}.grid-edit input,.grid-edit select{width:100%;min-width:90px;font-size:12px;padding:4px 6px}
.grid-edit textarea{min-width:220px;font-size:12px}
.grid-edit .id-cell{min-width:80px;color:var(--faint)}
input.inline{width:130px;font-size:12px;text-align:center}
.inline-bar{display:inline-block;width:80px;height:8px;background:var(--grid);border-radius:4px;margin-right:8px;vertical-align:middle;overflow:hidden}
.inline-bar span{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
/* lists */
.rank{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rank li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--grid)}
.rank .score{font-family:Georgia,serif;font-size:22px;color:var(--red)}
.insights{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.insights li{padding-bottom:10px;border-bottom:1px solid var(--grid)}
.insights .small{margin-top:3px}
/* org */
.compare{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.compare>div{min-width:0}
.compare h4,#main h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:6px 0}
/* processes */
.proc-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.proc-layout>div{display:grid;gap:12px;min-width:0}
.proc-list{display:grid;gap:6px;position:sticky;top:76px}
.proc-btn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:3px}
.proc-btn span{font-size:12px;color:var(--muted)}
.proc-btn.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
/* interviews */
.iv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.iv header{display:grid;gap:2px;margin-bottom:8px}
.iv p{margin:6px 0}.iv ul{margin:4px 0;padding-left:18px}
.iv h5{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:10px}
.iv blockquote{margin:10px 0;padding-left:10px;border-left:3px solid var(--red);font-family:Georgia,serif;font-style:italic}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
/* report */
.report-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.report-settings{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.report-settings h5{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px}
.report-settings .tog{display:flex;margin:4px 0}
.report-preview{min-width:0}
/* modal, toast, tooltip */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50}
#modal[hidden]{display:none}
.modal-card{background:var(--surface);border-radius:14px;padding:18px;width:min(860px,94vw)}
.modal-card textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;margin-top:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#tip{position:fixed;z-index:70;max-width:340px;background:var(--ink);color:var(--surface);font-size:12px;padding:7px 10px;border-radius:8px;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#tip[hidden]{display:none}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  #nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav-btn{white-space:nowrap}.nav-foot{display:none}
  .grid-2,.proc-layout,.report-layout,.form-grid,.form-grid.wide{grid-template-columns:1fr}
  .proc-list,.report-settings{position:static;max-height:none}
  #main{padding:16px}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  #topbar,#nav,.page-h,.report-settings,#toast,#tip,#modal{display:none!important}
  .app,#main,.report-layout{display:block;padding:0}
  .rpt{box-shadow:none;border:0;margin:0;padding:0}
}
/* engagement tracking (app only) */
.flag-badge{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--crit);color:var(--crit-ink);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}

details.intake{border-bottom:1px solid var(--grid);padding:8px 0}

details dl{margin:6px 0}details dt{font-weight:600;font-size:12.5px;margin-top:8px}details dd{margin:2px 0 0;color:var(--muted);font-size:12.5px;white-space:pre-wrap}

.star{color:var(--red)}

<body>
<div class="app">
  <header id="topbar"></header>
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" hidden></div>
<script>
const STUDIO_BUILD = '2026-11-06 07:16 UTC';
/* ---- model.js ---- */
/* ============================================================
   The Growth Machine — data model, scenario engine, scoring, insights
   ============================================================ */
const SCHEMA = 'tgm.engagement/1';
const HOURS_PER_FTE_YEAR = 1760;
const HOURS_PER_FTE_MONTH = HOURS_PER_FTE_YEAR / 12;

const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 8);
const clone = (o) => JSON.parse(JSON.stringify(o));
const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? num(f(x)) : num(x)), 0);
const live = (arr) => (arr || []).filter((x) => !x._removed);
const byId = (arr) => Object.fromEntries((arr || []).map((x) => [x.id, x]));
const splitList = (v) => Array.isArray(v) ? v : String(v || '').split(/[,;\n]/).map((s) => s.trim()).filter(Boolean);

const COLLECTIONS = ['intake', 'customQuestions', 'competitors', 'capabilities', 'intel', 'usps', 'opportunities', 'departments', 'people', 'tools', 'processes', 'segments', 'markets', 'topClients', 'revenueMovements', 'feedback', 'sources',
  'financePeriods', 'interviews', 'findings', 'recommendations', 'scenarios'];

function blankEngagement(name) {
  const today = todayISO();
  return {
    schema: SCHEMA,
    id: uid('eng'),
    client: { name: name || 'New client', sector: '', subSector: '', hq: '', website: '', founded: '', stage: '',
      businessModel: '', revenueModel: '', description: '', goals: '', constraints: '' },
    meta: { currency: 'ZAR', consultant: 'The Growth Machine', engagementStart: today, lastUpdated: new Date().toISOString(),
      lastExported: '', notes: '' },
    departments: [], people: [], tools: [], processes: [], segments: [], markets: [], topClients: [], revenueMovements: [], feedback: [], sources: [],
    financePeriods: [], interviews: [], findings: [], recommendations: [], scenarios: [],
    intake: [], customQuestions: [], competitors: [], capabilities: [], intel: [], usps: [], opportunities: [], engagement: blankEngagementBlock(),
    report: { title: '', preparedFor: '', summary: '', nextSteps: '', anonymise: true, scenarioId: '', processIds: [],
      sections: { snapshot: true, competition: true, findings: true, org: true, processes: true, recommendations: true, financials: true, nextSteps: true } }
  };
}

/** Fill missing keys so older / Claude-generated files always load. */
function normalise(e) {
  const b = blankEngagement(e && e.client && e.client.name);
  const out = Object.assign({}, b, e || {});
  out.client = Object.assign({}, b.client, out.client || {});
  out.meta = Object.assign({}, b.meta, out.meta || {});
  out.report = Object.assign({}, b.report, out.report || {});
  out.report.sections = Object.assign({}, b.report.sections, out.report.sections || {});
  if (!out.id) out.id = uid('eng');
  COLLECTIONS.forEach((c) => {
    if (!Array.isArray(out[c])) out[c] = [];
    out[c].forEach((x) => { if (!x.id) x.id = uid(c.slice(0, 3)); });
  });
  out.processes.forEach((p) => { if (!Array.isArray(p.steps)) p.steps = []; p.steps.forEach((s) => { if (!s.id) s.id = uid('s'); }); });
  out.recommendations.forEach((r) => { if (!Array.isArray(r.ops)) r.ops = []; });
  out.scenarios.forEach((s) => { s.recommendationIds = splitList(s.recommendationIds); });
  normaliseEngagementBlock(out);
  out.schema = SCHEMA;
  return out;
}

/** Merge a (partial) engagement, e.g. a file from Claude, into an existing one.
    - Upserts by id (no duplicates).
    - Freshness: a stamped file (_meta.generatedAt) only overwrites records whose updatedAt is older; unstamped files
      can only fill records that were never stamped. Anything edited by hand later than the file is kept.
    - Deleted records (meta.deleted tombstones) are not resurrected by an older file. */
/** Steps from an update file, merged by id into the Studio's steps: the file sets order and the fields it sends;
    fields only set in the Studio (severity, review, times, notes) are kept, and flags added in the Studio are kept too. */
const STUDIO_OWNED = ['painSeverity', 'painState', 'linkState']; // judgements made in the Studio win over a file's suggestion
/** One citation line for a source reference {id, part, side}: what, where in it, from whom, as of when, received when.
    Client-facing lines name roles only; internal lines add the person. */
function sourceLine(e, ref, internal) {
  const s = (e.sources || []).find((x) => x.id === ref.id) || { name: ref.id };
  const who = [s.from, internal && s.person ? `(${s.person})` : ''].filter(Boolean).join(' ');
  return [`${s.name}${s.type ? ` (${s.type})` : ''}`, ref.part, who ? `from ${who}` : '', s.asOf ? (/^(last edited|actuals|as at|as of)/i.test(s.asOf) ? s.asOf : `information as of ${s.asOf}`) : '', s.received ? `received ${s.received}${s.via ? ` via ${s.via}` : ''}` : ''].filter(Boolean).join(' · ');
}

function mergeSteps(old, incoming) {
  if (!incoming.length && old.length) return old; // an empty list in a file never wipes mapped steps
  const byOld = {}; old.forEach((s) => { if (s.id) byOld[s.id] = s; });
  return incoming.map((s) => {
    const o = s.id && byOld[s.id]; if (!o) return s;
    const keep = {}; Object.keys(o).forEach((k) => { if (s[k] === undefined || s[k] === '' || s[k] === null || (STUDIO_OWNED.includes(k) && o[k])) keep[k] = o[k]; });
    const m = Object.assign({}, o, s, keep);
    if (Array.isArray(o.flags) && o.flags.length) { const key = (f) => f.type + '|' + f.text; const prev = {}; o.flags.forEach((f) => { prev[key(f)] = f; });
      const have = new Set((m.flags || []).map(key)); m.flags = (m.flags || []).map((f) => (prev[key(f)] && prev[key(f)].state && !f.state ? Object.assign({}, f, { state: prev[key(f)].state }) : f)).concat(o.flags.filter((f) => !have.has(key(f)))); }
    return m;
  });
}

function mergeEngagement(base, incoming) {
  const out = clone(base);
  const ts = (incoming._meta && incoming._meta.generatedAt) || '';
  const counts = {}; const skipped = [];
  const isNewer = (rec) => !!(rec && rec.updatedAt && (!ts || rec.updatedAt > ts));
  const dead = (out.meta && out.meta.deleted) || {};
  const tomb = (coll, id) => dead[coll + ':' + id] && (!ts || dead[coll + ':' + id] > ts);
  const upsert = (arr, items, coll, prefix) => {
    const c = counts[coll] = { added: 0, updated: 0, skipped: 0 };
    items.forEach((item) => {
      const i = item.id ? arr.findIndex((x) => x.id === item.id) : -1;
      if (item._delete) { // an update file can retire a duplicate or obsolete record
        if (i >= 0 && !isNewer(arr[i])) { arr.splice(i, 1); out.meta.deleted = Object.assign({}, out.meta.deleted, { [coll + ':' + item.id]: ts || nowISO() }); c.updated++; }
        return;
      }
      if (i >= 0) {
        if (isNewer(arr[i])) { c.skipped++; skipped.push({ coll, id: item.id, why: 'newer data kept' }); return; }
        const merged = Object.assign({}, arr[i], item, ts ? { updatedAt: ts } : {});
        if (coll === 'processes' && Array.isArray(arr[i].steps) && Array.isArray(item.steps)) merged.steps = mergeSteps(arr[i].steps, item.steps);
        if ((coll === 'interviews' || coll === 'intake') && arr[i].answers && item.answers) merged.answers = Object.assign({}, arr[i].answers, item.answers); // an update adds answers; it never wipes ones captured in the Studio
        arr[i] = merged; c.updated++;
      } else {
        if (item.id && tomb(coll, item.id)) { c.skipped++; skipped.push({ coll, id: item.id, why: 'deleted after this file was made' }); return; }
        arr.push(Object.assign({ id: uid(prefix) }, item, ts ? { updatedAt: ts } : {})); c.added++;
      }
    });
  };
  ['client', 'meta', 'report'].forEach((k) => {
    if (!incoming[k] || typeof incoming[k] !== 'object') return;
    if (isNewer(out[k])) { skipped.push({ coll: k, id: '', why: 'newer data kept' }); return; }
    Object.entries(incoming[k]).forEach(([kk, v]) => { if (v !== '' && v != null && kk !== 'mergeLog' && kk !== 'deleted') out[k][kk] = v; });
    if (ts) out[k].updatedAt = ts;
  });
  COLLECTIONS.forEach((c) => { if (Array.isArray(incoming[c])) upsert(out[c], incoming[c], c, c.slice(0, 3)); });
  if (incoming.engagement && typeof incoming.engagement === 'object') {
    const g = out.engagement = Object.assign(blankEngagementBlock(), out.engagement || {});
    const scalarsNewer = isNewer(g);
    let scalarSet = false;
    Object.entries(incoming.engagement).forEach(([k, v]) => {
      if (Array.isArray(v)) { g[k] = Array.isArray(g[k]) ? g[k] : []; upsert(g[k], v, 'engagement.' + k, k.slice(0, 2)); }
      else if (v !== '' && v != null) { if (scalarsNewer) skipped.push({ coll: 'engagement', id: k, why: 'newer data kept' }); else { g[k] = v; scalarSet = true; } }
    });
    if (scalarSet && ts) g.updatedAt = ts;
  }
  return { engagement: normalise(out), counts, skipped, stamped: !!ts };
}

/* Records that existed before freshness tracking are stamped with this fixed cut-off (not "now"), so stamped files
   generated after it still apply, while unstamped legacy files can never overwrite them. */
const LEGACY_CUTOFF = '2026-11-02T11:30:00.000Z';

/** One-off: stamp every record that has no updatedAt, so files made before freshness tracking cannot overwrite them. */
function stampAll(e, ts) {
  const st = (x) => { if (x && typeof x === 'object' && !x.updatedAt) x.updatedAt = ts; };
  ['client', 'meta', 'report'].forEach((k) => st(e[k]));
  COLLECTIONS.forEach((c) => (e[c] || []).forEach(st));
  const g = e.engagement || {}; st(g);
  Object.values(g).forEach((v) => { if (Array.isArray(v)) v.forEach(st); });
  e.meta.tsMigrated = ts;
}

/* ---------------- Scenario engine ----------------
   Proposed state = current state + the "ops" of every recommendation in the scenario.
   Removed things are flagged (_removed) rather than deleted so views can show ghosts. */
function applyRecs(eng, recIds) {
  const s = { departments: clone(eng.departments), people: clone(eng.people), tools: clone(eng.tools), processes: clone(eng.processes) };
  const recs = byId(eng.recommendations);
  (recIds || []).forEach((rid) => {
    const r = recs[rid];
    if (!r) return;
    (r.ops || []).forEach((op) => { try { applyOp(s, op, r); } catch (err) { console.warn('Op failed', op, err); } });
  });
  return s;
}

function markChanged(obj, keys) { obj._changed = Array.from(new Set([...(obj._changed || []), ...keys])); }

function applyOp(s, op, rec) {
  const tag = rec.title || rec.id;
  const find = (coll, id) => s[coll].find((x) => x.id === id);
  const proc = op.processId ? find('processes', op.processId) : null;
  switch (op.op) {
    case 'removePerson': {
      const p = find('people', op.personId); if (!p || p._removed) return;
      live(s.people).filter((x) => x.managerId === p.id).forEach((r) => { r.managerId = p.managerId || ''; markChanged(r, ['managerId']); });
      p._removed = true; p._by = tag; break;
    }
    case 'addPerson': { const p = Object.assign({ id: uid('p') }, op.person, { _added: true, _by: tag }); s.people.push(p); break; }
    case 'updatePerson': { const p = find('people', op.personId); if (!p) return; Object.assign(p, op.changes); markChanged(p, Object.keys(op.changes || {})); p._by = tag; break; }
    case 'removeTool': { const t = find('tools', op.toolId); if (!t) return; t._removed = true; t._by = tag; break; }
    case 'addTool': { s.tools.push(Object.assign({ id: uid('t') }, op.tool, { _added: true, _by: tag })); break; }
    case 'updateTool': { const t = find('tools', op.toolId); if (!t) return; Object.assign(t, op.changes); markChanged(t, Object.keys(op.changes || {})); break; }
    case 'addProcess': { s.processes.push(Object.assign({ id: uid('pr'), steps: [] }, op.process, { _added: true, _by: tag })); break; }
    case 'removeProcess': { if (proc) { proc._removed = true; proc._by = tag; } break; }
    case 'updateProcess': { if (proc) { Object.assign(proc, op.changes); markChanged(proc, Object.keys(op.changes || {})); } break; }
    case 'addStep': {
      if (!proc) return;
      const st = Object.assign({ id: uid('s') }, op.step, { _added: true, _by: tag });
      const i = op.afterStepId ? proc.steps.findIndex((x) => x.id === op.afterStepId) : -1;
      if (i >= 0) proc.steps.splice(i + 1, 0, st); else proc.steps.push(st);
      markChanged(proc, ['steps']); break;
    }
    case 'updateStep': {
      if (!proc) return; const st = proc.steps.find((x) => x.id === op.stepId); if (!st) return;
      Object.assign(st, op.changes); markChanged(st, Object.keys(op.changes || {})); st._by = tag; markChanged(proc, ['steps']); break;
    }
    case 'removeStep': {
      if (!proc) return; const st = proc.steps.find((x) => x.id === op.stepId); if (!st) return;
      st._removed = true; st._by = tag; markChanged(proc, ['steps']); break;
    }
    case 'addDepartment': { s.departments.push(Object.assign({ id: uid('d') }, op.department, { _added: true })); break; }
    case 'updateDepartment': { const d = find('departments', op.departmentId); if (d) { Object.assign(d, op.changes); markChanged(d, Object.keys(op.changes || {})); } break; }
    case 'removeDepartment': { const d = find('departments', op.departmentId); if (d) { d._removed = true; d._by = tag; } break; }
    default: console.warn('Unknown op', op);
  }
}

/** Which recommendation ids are active for a scenario selection. */
function scenarioRecIds(eng, scenarioId) {
  if (!scenarioId || scenarioId === 'current') return [];
  if (scenarioId === 'all') return eng.recommendations.filter((r) => r.status !== 'Rejected').map((r) => r.id);
  const sc = eng.scenarios.find((x) => x.id === scenarioId);
  return sc ? splitList(sc.recommendationIds) : [];
}
function scenarioName(eng, scenarioId) {
  if (!scenarioId || scenarioId === 'current') return 'Current state';
  if (scenarioId === 'all') return 'All recommendations';
  const sc = eng.scenarios.find((x) => x.id === scenarioId);
  return sc ? sc.name : 'Current state';
}
function stateFor(eng, scenarioId) { return applyRecs(eng, scenarioRecIds(eng, scenarioId)); }

/* ---------------- Metrics ---------------- */
function personRate(p) { const f = num(p.fte) || 1; return num(p.annualCost) / (f * HOURS_PER_FTE_YEAR); }
function stepHours(step, proc) { return num(step.durationMins) * num(proc.runsPerMonth) / 60; }
function processHours(proc) {
  const st = live(proc.steps);
  if (st.some((s) => num(s.durationMins) > 0)) return sum(st, (s) => stepHours(s, proc));
  return num(proc.hoursPerMonth);
}
function processManualHours(proc) {
  const st = live(proc.steps);
  if (st.some((s) => num(s.durationMins) > 0)) return sum(st.filter((s) => !s.automated), (s) => stepHours(s, proc));
  return proc.automated ? 0 : num(proc.hoursPerMonth);
}
function avgRate(state) {
  const ppl = live(state.people);
  const hrs = sum(ppl, (p) => (num(p.fte) || 1) * HOURS_PER_FTE_YEAR);
  return hrs ? sum(ppl, (p) => p.annualCost) / hrs : 0;
}
function processCostMonthly(proc, state) {
  const people = byId(state.people); const rate = avgRate(state);
  const st = live(proc.steps);
  if (!st.length) return processHours(proc) * rate;
  return sum(st.filter((s) => !s.automated), (s) => stepHours(s, proc) * (people[s.actorId] ? personRate(people[s.actorId]) : rate));
}

function metrics(state) {
  const ppl = live(state.people), tools = live(state.tools), procs = live(state.processes);
  return {
    headcount: ppl.length,
    fte: sum(ppl, (p) => num(p.fte) || 1),
    payroll: sum(ppl, (p) => p.annualCost),
    toolSpend: sum(tools, (t) => num(t.monthlyCost) * 12),
    toolCount: tools.length,
    procHours: sum(procs, processHours),
    manualHours: sum(procs, processManualHours),
    processCost: sum(procs, (p) => processCostMonthly(p, state)),
    avgRate: avgRate(state)
  };
}

/** Per-person load: hours/month spent on mapped process steps. */
function personLoad(state) {
  const load = {};
  live(state.processes).forEach((proc) => live(proc.steps).forEach((s) => {
    if (!s.actorId || s.automated) return;
    load[s.actorId] = load[s.actorId] || { hours: 0, processes: new Set(), steps: 0 };
    load[s.actorId].hours += stepHours(s, proc);
    load[s.actorId].processes.add(proc.id);
    load[s.actorId].steps++;
  }));
  return load;
}

function latestPeriod(eng) { return eng.financePeriods.length ? eng.financePeriods[eng.financePeriods.length - 1] : null; }
function annualRevenue(eng) {
  const fp = eng.financePeriods;
  if (fp.length) {
    const last4 = fp.slice(-4);
    const months = sum(last4, (p) => num(p.months) || 3);
    return months ? sum(last4, (p) => p.revenue) * 12 / months : 0;
  }
  return sum(eng.segments, (s) => s.annualRevenue);
}

/* ---------------- Scenario + recommendation impact ---------------- */
function scenarioImpact(eng, scenarioId) {
  const base = metrics(stateFor(eng, 'current'));
  const ids = scenarioRecIds(eng, scenarioId);
  const m = metrics(applyRecs(eng, ids));
  const recs = eng.recommendations.filter((r) => ids.includes(r.id));
  const payrollSaving = base.payroll - m.payroll;
  const toolSaving = base.toolSpend - m.toolSpend;
  const otherSaving = sum(recs, (r) => r.otherAnnualSaving);
  const revenueUplift = sum(recs, (r) => r.revenueUplift);
  const cashSaving = payrollSaving + toolSaving + otherSaving;
  const hoursSaved = base.procHours - m.procHours;
  const oneOff = sum(recs, (r) => r.oneOffCost);
  const monthlyBenefit = (cashSaving + revenueUplift) / 12;
  return {
    base, m, recs, payrollSaving, toolSaving, otherSaving, revenueUplift, cashSaving, hoursSaved,
    capacityValue: hoursSaved * 12 * base.avgRate, oneOff,
    paybackMonths: oneOff > 0 && monthlyBenefit > 0 ? oneOff / monthlyBenefit : (oneOff === 0 && monthlyBenefit > 0 ? 0 : null),
    headcountDelta: m.headcount - base.headcount
  };
}

/** Value + priority score for every recommendation (each measured on its own against current state). */
function scoreRecommendations(eng) {
  const base = metrics(stateFor(eng, 'current'));
  const rows = eng.recommendations.map((r) => {
    const m = metrics(applyRecs(eng, [r.id]));
    const cash = (base.payroll - m.payroll) + (base.toolSpend - m.toolSpend) + num(r.otherAnnualSaving);
    const hoursSaved = base.procHours - m.procHours;
    const capacity = hoursSaved * 12 * base.avgRate;
    const revenue = num(r.revenueUplift);
    const value = cash + revenue + capacity * 0.5;
    const oneOff = num(r.oneOffCost);
    const monthly = (cash + revenue) / 12;
    return { rec: r, cash, hoursSaved, capacity, revenue, value, oneOff,
      payback: oneOff > 0 && monthly > 0 ? oneOff / monthly : (oneOff === 0 && monthly > 0 ? 0 : null),
      headcountDelta: m.headcount - base.headcount };
  });
  const maxV = Math.max(1, ...rows.map((x) => x.value));
  rows.forEach((x) => {
    const e = num(x.rec.effort) || 3, k = num(x.rec.risk) || 3, c = num(x.rec.confidence) || 3;
    x.score = Math.round(100 * (0.5 * Math.max(0, x.value) / maxV + 0.2 * (5 - e) / 4 + 0.15 * (5 - k) / 4 + 0.15 * (c - 1) / 4));
  });
  return rows.sort((a, b) => b.score - a.score);
}

/* ---------------- Crossover insights (rule engine) ---------------- */
function themeCounts(eng) {
  const counts = {};
  eng.interviews.forEach((iv) => splitList(iv.themes).forEach((t) => {
    const k = t.toLowerCase();
    counts[k] = counts[k] || { theme: t, count: 0, people: new Set() };
    counts[k].count++; if (iv.personId) counts[k].people.add(iv.personId);
  }));
  return Object.values(counts).sort((a, b) => b.count - a.count);
}

function insights(eng, fmtMoney, anon) {
  const state = stateFor(eng, 'current');
  const out = [];
  const add = (area, severity, title, detail) => out.push({ area, severity, title, detail });
  const people = live(state.people), pById = byId(state.people), tools = live(state.tools), procs = live(state.processes);
  const m = metrics(state);
  const rev = annualRevenue(eng);
  const nm = (p) => (anon ? (p.title || 'A role') : p.name);
  const name = (id) => (pById[id] ? nm(pById[id]) : 'Unknown');

  // Finance × People
  if (rev > 0 && m.payroll > 0) {
    const pct = m.payroll / rev * 100;
    if (pct > 50) add('Finance × People', pct > 65 ? 'high' : 'medium', `Payroll is ${pct.toFixed(0)}% of revenue`,
      `Annual payroll ${fmtMoney(m.payroll)} against run-rate revenue ${fmtMoney(rev)}. Revenue per FTE is ${fmtMoney(rev / (m.fte || 1))}.`);
    else add('Finance × People', 'low', `Revenue per FTE: ${fmtMoney(rev / (m.fte || 1))}`, `Payroll is ${pct.toFixed(0)}% of revenue.`);
  }
  // Tools
  const cats = {};
  tools.forEach((t) => { const c = (t.category || '').trim().toLowerCase(); if (!c) return; (cats[c] = cats[c] || []).push(t); });
  Object.values(cats).filter((g) => g.length > 1).forEach((g) => add('Tools', 'medium', `Overlapping tools: ${g.map((t) => t.name).join(' + ')}`,
    `${g.length} tools in "${g[0].category}" cost ${fmtMoney(sum(g, (t) => num(t.monthlyCost) * 12))}/yr combined. Consolidation candidate.`));
  tools.forEach((t) => {
    const seats = num(t.seats), active = num(t.activeUsers);
    if (seats && active && seats > active * 1.25 && num(t.monthlyCost) > 0) {
      const waste = num(t.monthlyCost) * 12 * (1 - active / seats);
      add('Tools', waste > 20000 ? 'medium' : 'low', `${t.name}: ${seats - active} unused seats`, `${active}/${seats} seats active. Roughly ${fmtMoney(waste)}/yr on idle licences.`);
    }
  });
  // Processes
  procs.forEach((p) => {
    const h = processHours(p), mh = processManualHours(p);
    if (h >= 15 && mh / h > 0.6) add('Process × Cost', h > 60 ? 'high' : 'medium', `${p.name}: ${Math.round(mh / h * 100)}% manual`,
      `${Math.round(h)} hrs/month, ${Math.round(mh)} of them manual, costing about ${fmtMoney(processCostMonthly(p, state) * 12)}/yr in staff time. Automation candidate.`);
    const actors = new Set(live(p.steps).filter((s) => s.actorId && !s.automated).map((s) => s.actorId));
    if (actors.size === 1 && h >= 10) add('Process × People', 'medium', `Single point of failure: ${p.name}`, `Every manual step is done by ${name([...actors][0])}. Knowledge is concentrated in one person.`);
    const painSteps = live(p.steps).filter((s) => s.painPoint);
    if (painSteps.length >= 2) add('Process × Interviews', 'medium', `${p.name}: ${painSteps.length} steps flagged as painful`, painSteps.map((s) => `${s.name}: ${s.painPoint}`).join(' · '));
  });
  // Tool friction: pain points concentrated on one tool
  const toolPain = {};
  procs.forEach((p) => live(p.steps).forEach((s) => { if (s.painPoint && s.toolId) toolPain[s.toolId] = (toolPain[s.toolId] || 0) + 1; }));
  const tById = byId(state.tools);
  Object.entries(toolPain).filter(([, c]) => c >= 2).forEach(([tid, c]) => tById[tid] && add('Tools × Process', 'medium', `${tById[tid].name} is linked to ${c} pain points`, 'This tool shows up in several painful steps. It may be the wrong tool, or badly configured.'));
  // People load
  const load = personLoad(state);
  people.forEach((p) => {
    const cap = (num(p.fte) || 1) * HOURS_PER_FTE_MONTH;
    const l = load[p.id];
    if (l && l.hours > cap * 0.8) add('People × Process', 'high', `${nm(p)} is overloaded on mapped work`, `${Math.round(l.hours)} hrs/month on ${l.processes.size} processes vs ${Math.round(cap)} hrs capacity.`);
    if (l && l.processes.size >= 3) add('People × Process', 'low', `${nm(p)} touches ${l.processes.size} processes`, 'High dependency. Check for cross-training and handover risk.');
  });
  // Org structure
  people.forEach((p) => {
    const reports = people.filter((x) => x.managerId === p.id);
    if (reports.length === 1) add('Org structure', 'low', `${nm(p)} manages only one person`, `${p.title || ''} → ${nm(reports[0])}. Possible extra management layer.`);
    if (reports.length > 8) add('Org structure', 'medium', `${nm(p)} has ${reports.length} direct reports`, 'Span of control may be too wide.');
  });
  const depth = (id, seen = new Set()) => { const p = pById[id]; if (!p || !p.managerId || seen.has(id)) return 1; seen.add(id); return 1 + depth(p.managerId, seen); };
  const maxDepth = Math.max(0, ...people.map((p) => depth(p.id)));
  if (maxDepth > 4) add('Org structure', 'medium', `${maxDepth} management layers`, 'A deep hierarchy for the headcount. Decisions may be slow.');
  // Customers
  const tc = eng.topClients.slice().sort((a, b) => num(b.annualRevenue) - num(a.annualRevenue));
  if (rev > 0 && tc.length) {
    const top1 = num(tc[0].annualRevenue) / rev * 100;
    const top3 = sum(tc.slice(0, 3), (c) => c.annualRevenue) / rev * 100;
    if (top1 > 15 || top3 > 40) add('Customers × Finance', top1 > 25 ? 'high' : 'medium', `Revenue concentration: top client ${top1.toFixed(0)}%, top 3 ${top3.toFixed(0)}%`, `${tc[0].name} is the largest account. Losing it would hit run-rate revenue hard.`);
  }
  eng.segments.forEach((s) => {
    if (num(s.churnPct) >= 15) add('Customers', 'medium', `${s.name}: ${num(s.churnPct)}% churn`, 'Churn is high in this segment. Look into onboarding, value delivery and fit.');
  });
  // Interviews
  themeCounts(eng).filter((t) => t.count >= 2).slice(0, 6).forEach((t) => add('Interviews', t.count >= 3 ? 'high' : 'medium', `"${t.theme}" raised in ${t.count} interviews`, 'Several people raised the same issue independently. That makes it a strong signal.'));
  // Market & competition
  (eng.competitors || []).forEach((c) => {
    if (c.threat === 'High') add('Market × Competition', 'medium', `${c.name} rated a high threat`, c.whereWeLose ? `Where ${eng.client.name} loses: ${c.whereWeLose}` : 'Record where deals are lost to them.');
    if (num(eng.client.pricePoint) > 0 && num(c.pricePoint) > 0 && num(c.pricePoint) < num(eng.client.pricePoint) && typeof capabilityScore === 'function') {
      const mine = capabilityScore(eng, (cap) => cap.client), theirs = capabilityScore(eng, (cap) => (cap.scores || {})[c.id]);
      if (mine != null && theirs != null && theirs >= mine) add('Market × Price', 'high', `Price pressure: ${c.name} is cheaper with equal or better capability`, `${fmtMoney(num(c.pricePoint))} vs ${fmtMoney(num(eng.client.pricePoint))} per location / month; capability ${Math.round(theirs)}% vs ${Math.round(mine)}%.`);
    }
  });
  const unsourced = (eng.competitors || []).filter((c) => !String(c.sources || '').trim());
  if (unsourced.length) add('Market × Competition', 'low', `${unsourced.length} competitor profile${unsourced.length > 1 ? 's have' : ' has'} no sources`, 'Add sources before these appear in a founder report.');
  // Department cost vs size
  const order = { high: 0, medium: 1, low: 2 };
  return out.sort((a, b) => order[a.severity] - order[b.severity]);
}

/** Department scorecard: crosses people, tools, processes and interviews per department. */
function departmentScorecard(eng, state) {
  const pById = byId(state.people);
  const ivByPerson = {};
  eng.interviews.forEach((iv) => { if (iv.personId) ivByPerson[iv.personId] = (ivByPerson[iv.personId] || 0) + splitList(iv.painPoints).length; });
  return live(state.departments).map((d) => {
    const ppl = live(state.people).filter((p) => p.departmentId === d.id);
    const tools = live(state.tools).filter((t) => splitList(t.departmentIds).includes(d.id));
    const procs = live(state.processes).filter((p) => p.departmentId === d.id);
    const hours = sum(procs, processHours), manual = sum(procs, processManualHours);
    return {
      dept: d, headcount: ppl.length, fte: sum(ppl, (p) => num(p.fte) || 1), payroll: sum(ppl, (p) => p.annualCost),
      toolSpend: sum(tools, (t) => num(t.monthlyCost) * 12 / Math.max(1, splitList(t.departmentIds).length)),
      processes: procs.length, hours, manualPct: hours ? manual / hours * 100 : 0,
      pain: sum(ppl, (p) => ivByPerson[p.id] || 0),
      head: pById[d.headId]
    };
  });
}

/** Completeness of each compartment, used on the overview. */
function completeness(eng) {
  const c = eng.client;
  return [
    ['Business profile', ['sector', 'businessModel', 'revenueModel', 'description', 'goals'].filter((k) => c[k]).length / 5],
    ['Org & people', Math.min(1, eng.people.length / 5) * (eng.people.some((p) => p.annualCost) ? 1 : 0.6)],
    ['Tools', Math.min(1, eng.tools.length / 5)],
    ['Processes', Math.min(1, eng.processes.filter((p) => p.steps.length).length / 3)],
    ['Finance', Math.min(1, eng.financePeriods.length / 4)],
    ['Customers & market', Math.min(1, (eng.segments.length + eng.markets.length + eng.topClients.length) / 6)],
    ['Interviews', Math.min(1, eng.interviews.length / 6)],
    ['Recommendations', Math.min(1, eng.recommendations.length / 5)]
  ];
}

/* ============================================================
   Engagement tracking — phases, time log, delays & changes, client requests,
   activities, contract savings tracker, discovery coverage.
