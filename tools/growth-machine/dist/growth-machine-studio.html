const DELAY_CAUSES = ['Client: information late', 'Client: access not granted', 'Client: decision / approval pending', 'Client: availability / cooperation',
  'New information / finding', 'Scope change (agreed)', 'TGM side', 'External / other'];
const PHASE_STATUSES = ['Not started', 'In progress', 'Done', 'On hold'];
const ACTIVITY_STATUSES = ['Next', 'In progress', 'Waiting on client', 'Done'];
const REC_STAGES = ['Identified', 'Approved', 'In progress', 'Realised', 'Rejected'];
const LEGACY_STATUS = { Proposed: 'Identified', Agreed: 'Approved', Done: 'Realised' };

/* Dates are calendar days (YYYY-MM-DD). All arithmetic is done in UTC so it is identical in every timezone
   (local-time arithmetic + toISOString() shifts by a day east of UTC, e.g. South Africa). */
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const addDaysISO = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const addMonthsISO = (iso, k) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + k); return d.toISOString().slice(0, 10); };
const weekdayISO = (iso) => new Date(iso + 'T00:00:00Z').getUTCDay();
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const fmtD = (iso, o) => (iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', o || { day: 'numeric', month: 'short' }) : '—');

function blankEngagementBlock() {
  return { contact: '', contactRole: '', start: '', end: '', daysTotal: 30, daysPerMonth: 10, targetMonthly: 0, baselineMonthly: 0,
    reviewDates: '', phases: [], timeLog: [], delays: [], requests: [], activities: [] };
}
function normaliseEngagementBlock(e) {
  e.engagement = Object.assign(blankEngagementBlock(), e.engagement || {});
  ['phases', 'timeLog', 'delays', 'requests', 'activities'].forEach((k) => {
    if (!Array.isArray(e.engagement[k])) e.engagement[k] = [];
    e.engagement[k].forEach((x) => { if (!x.id) x.id = uid(k.slice(0, 2)); });
  });
  // Work diary: whole or half days only; what happened is a simple list (no durations)
  e.engagement.timeLog.forEach((t) => {
    if (t.dayType !== 'Full' && t.dayType !== 'Half') t.dayType = num(t.days) >= 0.75 ? 'Full' : 'Half';
    t.days = t.dayType === 'Full' ? 1 : 0.5;
    if (t.items == null) t.items = [t.activity, t.notes].filter(Boolean).join('\n');
    delete t.activity;
    if (!t.phaseId) t.phaseId = phaseForDate(e.engagement, t.date);
  });
  // One-time repair: plans created east of UTC before 2 Nov 2026 were saved one day early (timezone bug).
  const g0 = e.engagement;
  if (!g0._tzFixed && g0.start && g0.phases.length && g0.phases[0].id === 'ph0' && g0.phases[0].start === addDaysISO(g0.start, -1)) {
    const shift = (v) => (v ? addDaysISO(v, 1) : v);
    g0.phases.forEach((p) => { p.start = shift(p.start); p.end = p.id === 'ph5' && p.end === addDaysISO(g0.end, -1) ? g0.end : shift(p.end); });
    g0.requests.forEach((r) => { if (r.requestedDate === addDaysISO(g0.start, -1)) r.requestedDate = g0.start; if (!r.receivedDate) r.dueDate = shift(r.dueDate); });
    g0.activities.forEach((a) => { if (a.status !== 'Done') a.due = shift(a.due); });
    const rd = splitList(g0.reviewDates);
    if (rd.length && rd.every((d) => weekdayISO(d) === 4)) g0.reviewDates = rd.map(shift).join(', ');
    g0._tzFixed = true;
  }
  if (g0.start) g0._tzFixed = true;
  e.engagement.status = Object.assign({ headline: '', delivered: '', next: '', includeDiary: false }, e.engagement.status || {});
  if (!Array.isArray(e.intake)) e.intake = [];
  if (!Array.isArray(e.staffSurvey)) e.staffSurvey = [];
  e.recommendations.forEach((r) => { if (LEGACY_STATUS[r.status]) r.status = LEGACY_STATUS[r.status]; if (!r.status) r.status = 'Identified'; });
  e.interviews.forEach((iv) => { if (!iv.answers || typeof iv.answers !== 'object') iv.answers = {}; if (!Array.isArray(iv.outliers)) iv.outliers = []; });
  return e;
}

/** Seed the standard 3-month plan, document requests and first activities. */
function seedStandardPlan(e) {
  const g = e.engagement; const start = g.start || todayISO();
  g.start = start;
  if (!g.end) g.end = addDaysISO(addMonthsISO(start, 3), -1);
  g.phases = standardPlan(start).map((p, i) => Object.assign(p, { status: i === 0 ? 'In progress' : 'Not started' }));
  g.requests = DOCUMENT_REQUESTS.map((d) => ({ id: d.id, item: d.item, crit: d.crit, owner: g.contact || '', requestedDate: start, dueDate: addDaysISO(start, d.dueDays), receivedDate: '', status: '', notes: '' }));
  const A = (phaseId, title, due, status) => ({ id: uid('ac'), phaseId, title, due, status: status || 'Next', doneDate: '' });
  g.activities = [
    A('ph0', 'Kick-off meeting with founders; agreement signed', start, 'In progress'),
    A('ph0', 'Send founder questionnaire link + secure folder link', start),
    A('ph0', 'Team announcement sent by founders', addDaysISO(start, 3)),
    A('ph1', 'Receive org chart, payroll and P&L', addDaysISO(start, 4)),
    A('ph1', 'Systems & data map', addDaysISO(start, 9)),
    A('ph1', 'Draft cost baseline', addDaysISO(start, 11)),
    A('ph2', 'Schedule manager and staff interviews', addDaysISO(start, 4)),
    A('ph2', 'Complete all interviews', addDaysISO(start, 18)),
    A('ph3', 'Opportunity register with monthly impact', addDaysISO(start, 24)),
    A('ph3', 'Month-1 readout to founders', g.phases[3].end)
  ];
  if (!g.reviewDates) {
    let first = start; while (weekdayISO(first) !== 5) first = addDaysISO(first, 1); first = addDaysISO(first, 7);
    const out = [];
    const holidays = ['12-16', '12-24', '12-25', '12-26', '12-31', '01-01']; // skip SA year-end public holidays
    for (let d = first, i = 0; d <= g.end && i < 60; d = addDaysISO(d, 14), i++) { if (!holidays.includes(d.slice(5))) out.push(d); }
    g.reviewDates = out.join(', ');
  }
}

/** The phase a date falls in (latest-starting phase that contains it). */
function phaseForDate(g, iso) {
  if (!iso || !g.phases || !g.phases.length) return '';
  const hits = g.phases.filter((p) => p.start <= iso && iso <= p.end).sort((a, b) => (b.start || '').localeCompare(a.start || ''));
  if (hits.length) return hits[0].id;
  return iso < g.phases[0].start ? g.phases[0].id : g.phases[g.phases.length - 1].id;
}
/** Things the Studio recorded on a given date, so the diary fills itself in. Roles, never names. */
function dayEvents(e, iso) {
  const g = e.engagement; const out = [];
  const pById = byId(e.people);
  const roleOf = (iv) => iv.role || (pById[iv.personId] && pById[iv.personId].title) || 'team member';
  const ivs = e.interviews.filter((iv) => iv.date === iso);
  if (ivs.length) out.push(`Interview${ivs.length > 1 ? 's' : ''}: ${ivs.map(roleOf).join(', ')}`);
  const fs = e.intake.filter((r) => (r.sessionDates || []).includes(iso));
  if (fs.length) out.push(`Founder session: ${fs.map((r) => r.role || 'founder').join(', ')}`);
  const rec = g.requests.filter((r) => r.receivedDate === iso);
  if (rec.length) out.push(`Information received: ${rec.length} item${rec.length > 1 ? 's' : ''}`);
  g.activities.filter((a) => a.status === 'Done' && a.doneDate === iso).forEach((a) => out.push(`Done: ${a.title}`));
  g.delays.filter((d) => d.dateRaised === iso).forEach((d) => out.push(`Delay logged: ${d.cause || 'see log'}`));
  const ss = e.staffSurvey.filter((r) => r.date === iso);
  if (ss.length) out.push(`Staff questionnaires received: ${ss.length}`);
  return out;
}
/** Start of the current reporting period: the most recent review date before today (or the engagement start). */
function statusPeriodStart(g) {
  const t = todayISO();
  const past = splitList(g.reviewDates).filter((d) => d < t).sort();
  return past.length ? past[past.length - 1] : g.start;
}

/** Contract month (1-based) for a date, from the engagement start. */
function contractMonth(g, iso) {
  if (!g.start || !iso) return 0;
  const s = new Date(g.start + 'T00:00:00'), d = new Date(iso + 'T00:00:00');
  let k = (d.getFullYear() - s.getFullYear()) * 12 + (d.getMonth() - s.getMonth());
  if (d.getDate() < s.getDate()) k -= 1;
  return k + 1;
}

function requestStatus(r, today) {
  if (r.status === 'Not needed' || r.status === 'Not available') return r.status;
  if (r.receivedDate) return 'Received';
  if (r.dueDate && r.dueDate < today) return 'Overdue';
  return 'Waiting';
}

function engagementStatus(e) {
  const g = e.engagement; const today = todayISO();
  const phases = g.phases;
  const current = phases.find((p) => p.status === 'In progress') || phases.find((p) => p.start <= today && today <= p.end) || phases.find((p) => p.status !== 'Done') || null;
  const used = sum(g.timeLog, (t) => t.days);
  const byMonth = {}; g.timeLog.forEach((t) => { const m = contractMonth(g, t.date); byMonth[m] = (byMonth[m] || 0) + num(t.days); });
  const byPhase = {}; g.timeLog.forEach((t) => { byPhase[t.phaseId || '—'] = (byPhase[t.phaseId || '—'] || 0) + num(t.days); });
  const openDelays = g.delays.filter((d) => d.status !== 'Resolved');
  const slipByPhase = {}; g.delays.forEach((d) => { if (d.phaseId) slipByPhase[d.phaseId] = (slipByPhase[d.phaseId] || 0) + num(d.daysImpact); });
  const totalSlip = sum(g.delays, (d) => d.daysImpact);
  const reqs = g.requests.map((r) => Object.assign({}, r, { _status: requestStatus(r, today) }));
  const overdue = reqs.filter((r) => r._status === 'Overdue');
  const thisMonth = contractMonth(g, today);
  const termDays = g.start && g.end ? daysBetween(g.start, g.end) + 1 : 0;
  const elapsed = g.start ? Math.max(0, Math.min(termDays, daysBetween(g.start, today) + 1)) : 0;
  return { today, current, used, byMonth, byPhase, openDelays, slipByPhase, totalSlip, reqs, overdue, thisMonth, termDays, elapsed,
    daysLeftInTerm: g.end ? Math.max(0, daysBetween(today, g.end)) : 0, remaining: num(g.daysTotal) - used,
    done: g.activities.filter((a) => a.status === 'Done').sort((a, b) => (b.doneDate || '').localeCompare(a.doneDate || '')),
    doing: g.activities.filter((a) => a.status === 'In progress' || a.status === 'Waiting on client'),
    next: g.activities.filter((a) => a.status === 'Next').sort((a, b) => (a.due || '').localeCompare(b.due || '')) };
}

/** Contract savings tracker: monthly recurring, net of new recurring costs, by stage. */
function savingsTracker(e) {
  const rows = scoreRecommendations(e).map((r) => ({ rec: r.rec, monthlyNet: r.cash / 12, oneOffSaving: num(r.rec.oneOffSaving), oneOffCost: r.oneOff, hoursMonth: r.hoursSaved, stage: r.rec.status || 'Identified' }));
  const live = rows.filter((r) => r.stage !== 'Rejected');
  const by = (st) => sum(live.filter((r) => st.includes(r.stage)), (r) => Math.max(0, r.monthlyNet));
  return { rows, target: num(e.engagement.targetMonthly), baseline: num(e.engagement.baselineMonthly),
    identified: by(['Identified', 'Approved', 'In progress', 'Realised']), approved: by(['Approved', 'In progress', 'Realised']), realised: by(['Realised']),
    oneOffSavings: sum(live, (r) => r.oneOffSaving), oneOffCosts: sum(live.filter((r) => r.stage !== 'Identified'), (r) => r.oneOffCost), hours: sum(live, (r) => Math.max(0, r.hoursMonth)) };
}

/* ---------- Discovery coverage: how well each criterion is evidenced ---------- */
const QINDEX = (() => { const m = {}; [...INTAKE_SECTIONS, ...STAFF_SECTIONS].forEach((s) => s.questions.forEach((q) => { m[q.id] = q; })); INTERVIEW_QUESTIONS.forEach((q) => { m[q.id] = q; }); return m; })();
/** Question metadata: built-in bank first, then engagement-specific custom questions (kept in client data, not in code). */
function qMeta(e, id) { return QINDEX[id] || ((e && e.customQuestions) || []).find((q) => q.id === id); }
function coverage(e) {
  const cols = ['Founder questionnaire', 'Staff questionnaire', 'Founder interviews', 'Manager interviews', 'Staff interviews', 'Unexpected points'];
  const m = {}; CRITERIA.forEach((c) => { m[c.id] = cols.map(() => 0); });
  const hit = (crit, col) => { if (m[crit]) m[crit][col]++; };
  e.intake.forEach((r) => Object.entries(r.answers || {}).forEach(([qid, v]) => { if (String(v || '').trim() && QINDEX[qid]) hit(QINDEX[qid].crit, 0); }));
  e.staffSurvey.forEach((r) => Object.entries(r.answers || {}).forEach(([qid, v]) => { if (String(v || '').trim() && QINDEX[qid] && !/_name$|_role$/.test(qid)) hit(QINDEX[qid].crit, 1); }));
  e.interviews.forEach((iv) => {
    const col = iv.level === 'founder' ? 2 : iv.level === 'manager' ? 3 : 4;
    Object.entries(iv.answers || {}).forEach(([qid, v]) => { const m = qMeta(e, qid); if (String(v || '').trim() && m) hit(m.crit, col); });
    (iv.outliers || []).forEach((o) => { if (o.text && o.crit) hit(o.crit, 5); });
  });
  return { cols, rows: CRITERIA.map((c) => ({ c, counts: m[c.id], total: sum(m[c.id]) })) };
}

/** Guess a department's question set from its name if no type was set. */
function deptType(d) {
  if (!d) return '';
  if (d.type) return d.type;
  const n = (d.name || '').toLowerCase();
  if (/revenue|\bcro\b/.test(n)) return 'revenue';
  if (/sales|business dev|commercial/.test(n)) return 'sales';
  if (/success|support|account|client|customer|service/.test(n)) return 'cs';
  if (/oper|data|listing|delivery|fulfil/.test(n)) return 'ops';
  if (/financ|account(ing|s)|billing|admin/.test(n)) return 'finance';
  if (/product|engineer|tech|dev|it\b/.test(n)) return 'tech';
  if (/market|brand|growth/.test(n)) return 'marketing';
  if (/lead|exec|founder|management|board/.test(n)) return 'leadership';
  return '';
}
function guessLevel(e, p) {
  if (!p) return 'staff';
  const reports = e.people.filter((x) => x.managerId === p.id).length;
  if (!p.managerId || /founder|ceo|owner|director|md\b|managing/i.test(p.title || '')) return 'founder';
  return reports > 0 || /head|manager|lead|chief/i.test(p.title || '') ? 'manager' : 'staff';
}
function questionSet(level, dtype) {
  return {
    core: INTERVIEW_QUESTIONS.filter((q) => q.level === 'all' && q.dept === 'all'),
    level: INTERVIEW_QUESTIONS.filter((q) => q.level === level && q.dept === 'all'),
    dept: dtype ? INTERVIEW_QUESTIONS.filter((q) => q.dept === dtype) : []
  };
}

/* ---------- CSV (Google Form / Sheet export) ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
/** Map Google Form response columns (question titles) back to question ids, then merge into the target list.
    Answers are merged per person: a later form submission fills gaps without wiping answers captured live. */
function importFormCSV(e, text, kind) {
  const isStaff = kind === 'staff';
  const sections = isStaff ? STAFF_SECTIONS : INTAKE_SECTIONS; const list = isStaff ? e.staffSurvey : e.intake;
  const nameQ = isStaff ? 'st_name' : 'i_name', roleQ = isStaff ? 'st_role' : 'i_role';
  const rows = parseCSV(text); if (rows.length < 2) return { added: 0, updated: 0, unmatched: [] };
  const head = rows[0];
  const byTitle = {}; sections.forEach((s) => s.questions.forEach((q) => { byTitle[q.q.trim().toLowerCase()] = q.id; }));
  const map = head.map((h) => byTitle[h.trim().toLowerCase()] || null);
  const unmatched = head.filter((h, i) => !map[i] && !/timestamp/i.test(h));
  let added = 0, updated = 0;
  rows.slice(1).forEach((r) => {
    const answers = {}; map.forEach((qid, i) => { if (qid && String(r[i] || '').trim()) answers[qid] = r[i]; });
    const ts = r[head.findIndex((h) => /timestamp/i.test(h))] || '';
    const respondent = (answers[nameQ] || 'Unknown').trim();
    const person = e.people.find((p) => (p.name || '').trim().toLowerCase() === respondent.toLowerCase());
    const id = (isStaff ? 'ss_' : 'in_') + respondent.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 40);
    const existing = list.find((x) => x.id === id || String(x.respondent).toLowerCase() === respondent.toLowerCase());
    if (existing) { existing.answers = Object.assign({}, existing.answers, answers); existing.timestamp = ts; existing.source = (existing.source || '') + (existing.source && !/Google Form/.test(existing.source) ? ' + Google Form' : existing.source ? '' : 'Google Form'); if (person) existing.personId = person.id; updated++; }
    else { list.push({ id, respondent, role: answers[roleQ] || '', personId: person ? person.id : '', timestamp: ts, date: todayISO(), source: 'Google Form', answers }); added++; }
  });
  return { added, updated, unmatched };
}
const importIntakeCSV = (e, text) => importFormCSV(e, text, 'intake');

/** Founder questionnaire completeness: which questions nobody has answered yet. */
function intakeOutstanding(e) {
  const answered = new Set(); e.intake.forEach((r) => Object.entries(r.answers || {}).forEach(([q, v]) => { if (String(v || '').trim() && !/^\s*partly\b/i.test(String(v))) answered.add(q); }));
  const all = INTAKE_SECTIONS.filter((s) => s.id !== 'about').flatMap((s) => s.questions.map((q) => Object.assign({ section: s.title }, q)));
  const open = all.filter((q) => !answered.has(q.id));
  return { total: all.length, open, openPriority: open.filter((q) => q.p), answered: all.length - open.length };
}

/* ---- charts.js ---- */
/* ============================================================
   Charts, org chart and swimlane renderers (return HTML/SVG strings)
   ============================================================ */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slotVar = (i) => (i >= 0 && i < 8 ? `var(--s${i + 1})` : 'var(--s-other)');
const SEQ = ['var(--seq-1)', 'var(--seq-2)', 'var(--seq-3)', 'var(--seq-4)', 'var(--seq-5)', 'var(--seq-6)', 'var(--seq-7)'];

function deptColor(depts, id) {
  const i = depts.findIndex((d) => d.id === id);
  return slotVar(i);
}

function wrapText(text, maxChars, maxLines) {
  const words = String(text || '').split(/\s+/); const lines = []; let cur = '';
  words.forEach((w) => {
    if ((cur + ' ' + w).trim().length > maxChars) { if (cur) lines.push(cur); cur = w; }
    else cur = (cur + ' ' + w).trim();
  });
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/.{0,2}$/, '…'); }
  return lines;
}
const trunc = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

/* ---- Horizontal bars (magnitude comparison) ---- */
function hbars(items, { fmt = (v) => v, color = 'var(--s1)', max } = {}) {
  if (!items.length) return '<p class="empty">No data yet.</p>';
  const mx = max || Math.max(1, ...items.map((i) => Math.abs(i.value)));
  return `<div class="hbars">${items.map((i) => `
    <div class="hbar" data-tip="${esc(i.label)}: ${esc(fmt(i.value))}${i.tip ? ' · ' + esc(i.tip) : ''}">
      <span class="hb-label">${i.swatch ? `<i class="swatch" style="background:${i.swatch}"></i>` : ''}${esc(i.label)}</span>
      <span class="hb-track"><span class="hb-fill" style="display:block;width:${Math.max(0.5, Math.abs(i.value) / mx * 100)}%;background:${i.color || color}"></span></span>
      <span class="hb-val">${esc(fmt(i.value))}</span>
    </div>`).join('')}</div>`;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

/* ---- Line chart (change over time, one shared y-axis) ---- */
function lineChart(labels, series, { fmt = (v) => v, height = 240, tickEvery = 1 } = {}) {
  if (!labels.length) return '<p class="empty">Add finance periods to see trends.</p>';
  const W = 640, H = height, L = 64, R = 16, T = 12, B = 28;
  const all = series.flatMap((s) => s.values.map(num));
  const ymax = niceMax(Math.max(0, ...all)); const ymin = 0;
  const x = (i) => L + (labels.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (labels.length - 1));
  const y = (v) => T + (H - T - B) * (1 - (v - ymin) / (ymax - ymin));
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => ymin + f * (ymax - ymin));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  svg += `<g class="grid">${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>`;
  svg += `<g class="axis">${ticks.map((t) => `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${esc(fmt(t))}</text>`).join('')}`;
  svg += labels.map((l, i) => ((i % tickEvery || labels.length - 1 - i < tickEvery / 1.5) && i !== labels.length - 1 ? '' : `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`)).join('') + '</g>';
  series.forEach((s) => {
    const pts = s.values.map((v, i) => `${x(i)},${y(num(v))}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    svg += s.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(num(v))}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
  });
  const colW = labels.length > 1 ? (W - L - R) / (labels.length - 1) : W - L - R;
  svg += labels.map((l, i) => `<rect class="hit" x="${x(i) - colW / 2}" y="${T}" width="${colW}" height="${H - T - B}" data-tip="${esc(l)} — ${series.map((s) => `${esc(s.name)}: ${esc(fmt(s.values[i]))}`).join(' · ')}"/>`).join('');
  svg += '</svg>';
  return `<div class="chart">${legend(series)}${svg}</div>`;
}

function legend(series) {
  return `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

/* ---- Stacked columns (composition over time) ---- */
function stackedColumns(labels, stacks, { fmt = (v) => v, height = 260 } = {}) {
  if (!labels.length) return '<p class="empty">No data yet.</p>';
  const W = 640, H = height, L = 64, R = 16, T = 12, B = 28;
  const totals = labels.map((_, i) => sum(stacks, (s) => num(s.values[i])));
  const ymax = niceMax(Math.max(1, ...totals));
  const y = (v) => T + (H - T - B) * (1 - v / ymax);
  const band = (W - L - R) / labels.length; const bw = Math.min(56, band * 0.6);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * ymax);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  svg += `<g class="grid">${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>`;
  svg += `<g class="axis">${ticks.map((t) => `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${esc(fmt(t))}</text>`).join('')}`;
  svg += labels.map((l, i) => `<text x="${L + band * i + band / 2}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join('') + '</g>';
  labels.forEach((l, i) => {
    let acc = 0; const cx = L + band * i + (band - bw) / 2;
    const visible = stacks.filter((s) => num(s.values[i]) > 0);
    visible.forEach((s, k) => {
      const v = num(s.values[i]); const y0 = y(acc), y1 = y(acc + v); acc += v;
      const h = Math.max(0, y0 - y1 - (k < visible.length - 1 ? 2 : 0));
      const isTop = k === visible.length - 1;
      const r = isTop ? Math.min(4, h / 2) : 0;
      const top = y1 + (k < visible.length - 1 ? 0 : 0);
      svg += isTop
        ? `<path d="M${cx},${top + h} V${top + r} Q${cx},${top} ${cx + r},${top} H${cx + bw - r} Q${cx + bw},${top} ${cx + bw},${top + r} V${top + h} Z" fill="${s.color}" data-tip="${esc(l)} · ${esc(s.name)}: ${esc(fmt(v))}"/>`
        : `<rect x="${cx}" y="${top + 2}" width="${bw}" height="${h}" fill="${s.color}" data-tip="${esc(l)} · ${esc(s.name)}: ${esc(fmt(v))}"/>`;
    });
  });
  svg += '</svg>';
  return `<div class="chart">${legend(stacks)}${svg}</div>`;
}

/* ---- Heatmap (sequential, one hue) ---- */
function heatmap(rowLabels, colLabels, matrix, { fmt = (v) => v } = {}) {
  const mx = Math.max(0, ...matrix.flat().map(num));
  if (!mx) return '<p class="empty">No mapped process steps yet. Add steps with an actor to see who carries which work.</p>';
  let h = '<table class="heat"><tr><th></th>' + colLabels.map((c) => `<th class="col">${esc(trunc(c, 22))}</th>`).join('') + '</tr>';
  rowLabels.forEach((r, i) => {
    h += `<tr><th>${esc(r)}</th>` + matrix[i].map((v, j) => {
      const n = num(v); if (!n) return '<td style="background:var(--surface-2)"></td>';
      const k = Math.min(6, Math.floor(n / mx * 6.999));
      return `<td style="background:${SEQ[k]};color:${k >= 4 ? '#fff' : 'var(--ink)'}" data-tip="${esc(r)} · ${esc(colLabels[j])}: ${esc(fmt(n))}">${esc(fmt(n))}</td>`;
    }).join('') + '</tr>';
  });
  return h + '</table>';
}

/* ---- Org chart ---- */
function orgChart(people, departments, { anonymise = false, showGhosts = true, fmtMoney = (v) => v, showCost = true } = {}) {
  const nodes = people.filter((p) => showGhosts || !p._removed);
  if (!nodes.length) return '<p class="empty">No people added yet.</p>';
  const ids = new Set(nodes.map((n) => n.id));
  const kids = {}; const roots = [];
  nodes.forEach((n) => { if (n.managerId && ids.has(n.managerId) && n.managerId !== n.id) (kids[n.managerId] = kids[n.managerId] || []).push(n); else roots.push(n); });
  const NW = 184, NH = 66, HG = 16, VG = 46, LEAF_GAP = 10, MAX_STACK = 6;
  const deptName = byId(departments);
  const isLeafGroup = (n) => (kids[n.id] || []).length > 3 && (kids[n.id] || []).every((k) => !(kids[k.id] || []).length);
  const memo = {};
  function width(n, seen = new Set()) {
    if (memo[n.id]) return memo[n.id];
    if (seen.has(n.id)) return NW; seen.add(n.id);
    const ks = kids[n.id] || []; let w;
    if (!ks.length) w = NW;
    else if (isLeafGroup(n)) { const cols = Math.ceil(ks.length / MAX_STACK); w = Math.max(NW, cols * NW + (cols - 1) * HG + 24); }
    else w = Math.max(NW, sum(ks, (k) => width(k, seen)) + HG * (ks.length - 1));
    return (memo[n.id] = w);
  }
  const pos = []; const edges = []; let maxY = 0;
  function place(n, x, y, seen = new Set()) {
    if (seen.has(n.id)) return; seen.add(n.id);
    const w = width(n); const nx = x + w / 2 - NW / 2; pos.push({ n, x: nx, y }); maxY = Math.max(maxY, y + NH);
    const ks = kids[n.id] || []; if (!ks.length) return;
    if (isLeafGroup(n)) {
      const cols = Math.ceil(ks.length / MAX_STACK); const gw = cols * NW + (cols - 1) * HG; const gx = x + (w - gw) / 2 + 12;
      ks.forEach((k, i) => {
        const c = Math.floor(i / MAX_STACK), r = i % MAX_STACK; const kx = gx + c * (NW + HG), ky = y + NH + VG + r * (NH + LEAF_GAP);
        pos.push({ n: k, x: kx, y: ky }); maxY = Math.max(maxY, ky + NH);
        edges.push(`M${nx + NW / 2},${y + NH} V${y + NH + VG / 2} H${kx - 8} V${ky + NH / 2} H${kx}`);
      });
      return;
    }
    let cx = x + (w - (sum(ks, (k) => width(k)) + HG * (ks.length - 1))) / 2;
    ks.forEach((k) => {
      const kw = width(k); const kx = cx + kw / 2;
      edges.push(`M${nx + NW / 2},${y + NH} V${y + NH + VG / 2} H${kx} V${y + NH + VG}`);
      place(k, cx, y + NH + VG, seen); cx += kw + HG;
    });
  }
  let x0 = 0; roots.forEach((r) => { place(r, x0, 0); x0 += width(r) + HG * 3; });
  const W = Math.max(NW, x0 - HG * 3), H = maxY;
  let svg = `<svg width="${W + 20}" height="${H + 20}" viewBox="-10 -10 ${W + 20} ${H + 20}" role="img" aria-label="Organisation chart">`;
  svg += edges.map((d) => `<path class="edge" d="${d}"/>`).join('');
  pos.forEach(({ n, x, y }) => {
    const st = n._removed ? 'removed' : n._added ? 'added' : (n._changed && n._changed.length) ? 'changed' : '';
    const d = deptName[n.departmentId];
    const title = n.title || '';
    const label = anonymise ? (title || 'Role') : (n.name || 'Unnamed');
    const sub = anonymise ? (d ? d.name : '') : title;
    const meta = [anonymise ? '' : (d ? d.name : ''), n.employmentType && n.employmentType !== 'Full-time' ? n.employmentType : '', showCost && num(n.annualCost) ? fmtMoney(num(n.annualCost)) : ''].filter(Boolean).join(' · ');
    const tip = [label, sub, meta, st === 'removed' ? 'Removed by: ' + (n._by || '') : '', st === 'added' ? 'New role: ' + (n._by || '') : '', st === 'changed' ? 'Changed (' + n._changed.join(', ') + ')' : ''].filter(Boolean).join(' · ');
    svg += `<g class="node ${st}" transform="translate(${x},${y})" data-tip="${esc(tip)}">`;
    svg += `<rect class="card" width="${NW}" height="${NH}" rx="8"/>`;
    svg += `<rect x="0" y="0" width="5" height="${NH}" rx="2" fill="${deptColor(departments, n.departmentId)}"/>`;
    svg += `<text class="n-name" x="14" y="21">${esc(trunc(label, 24))}</text>`;
    svg += `<text class="n-title" x="14" y="38">${esc(trunc(sub, 28))}</text>`;
    svg += `<text class="n-meta" x="14" y="54">${esc(trunc(meta, 32))}</text>`;
    if (st) {
      const txt = st === 'removed' ? '✕ REMOVED' : st === 'added' ? '+ NEW' : '~ CHANGED'; const bw = txt.length * 6 + 10;
      svg += `<g class="badge b-${st}" transform="translate(${NW - bw - 6},-8)"><rect width="${bw}" height="16" rx="8"/><text x="${bw / 2}" y="11.5" text-anchor="middle">${txt}</text></g>`;
    }
    svg += '</g>';
  });
  svg += '</svg>';
  return `<div class="org">${svg}</div>`;
}

function orgLegend(departments) {
  return `<div class="legend">${live(departments).map((d, i) => `<span><i style="background:${deptColor(departments, d.id)}"></i>${esc(d.name)}</span>`).join('')}
    <span><span class="chip st-added">+ New</span></span><span><span class="chip st-changed">~ Changed</span></span><span><span class="chip st-removed">✕ Removed</span></span></div>`;

/* ---- Swimlane process map ---- */
function swimlane(proc, people, tools, { anonymise = false, exec = true } = {}) {
  const steps = proc.steps || [];
  if (!steps.length) return '<p class="empty">This process has no steps yet. Add steps in Data → Processes, or paste them from Claude.</p>';
  const pById = byId(people), tById = byId(tools);
  const laneKey = (s) => s.automated && !s.actorId ? 'sys' : s.actorId ? 'p:' + s.actorId : s.actorLabel ? 'r:' + s.actorLabel : 'none';
  const lanes = [];
  steps.forEach((s) => { const k = laneKey(s); if (!lanes.find((l) => l.key === k)) lanes.push({ key: k, s }); });
  const laneInfo = (l) => {
    if (l.key === 'sys') return ['System / automation', ''];
    if (l.key === 'none') return ['Unassigned', ''];
    if (l.key.startsWith('r:')) return [l.s.actorLabel, 'role'];
    const p = pById[l.s.actorId];
    if (!p) return ['Unknown person', ''];
    return anonymise ? [p.title || 'Role', ''] : [p.name, p.title || ''];
  };
  const LW = 160, CW = 186, LH = 100, BW = 162, BH = 72, TOP = 34;
  const W = LW + steps.length * CW + 20, H = TOP + lanes.length * LH + 10;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Process map: ${esc(proc.name)}">`;
  svg += `<defs><marker id="arr-${esc(proc.id)}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker></defs>`;
  svg += `<text class="io" x="${LW + 8}" y="20">▶ Input: ${esc(trunc(proc.inputs || steps[0].input || '—', 60))}</text>`;
  svg += `<text class="io" x="${W - 12}" y="20" text-anchor="end">Output: ${esc(trunc(proc.outputs || steps[steps.length - 1].output || '—', 60))} ■</text>`;
  lanes.forEach((l, i) => {
    const [a, b] = laneInfo(l);
    svg += `<rect class="band ${i % 2 ? 'alt' : ''}" x="0" y="${TOP + i * LH}" width="${W}" height="${LH}"/>`;
    svg += `<text class="lane-label" x="12" y="${TOP + i * LH + LH / 2 - 2}">${esc(trunc(a, 20))}</text>`;
    if (b) svg += `<text class="lane-sub" x="12" y="${TOP + i * LH + LH / 2 + 13}">${esc(trunc(b, 24))}</text>`;
  });
  const cpos = steps.map((s, i) => ({ x: LW + i * CW + (CW - BW) / 2, y: TOP + lanes.findIndex((l) => l.key === laneKey(s)) * LH + (LH - BH) / 2 }));
  steps.forEach((s, i) => {
    if (!i) return; const a = cpos[i - 1], b = cpos[i];
    const ghost = s._removed || steps[i - 1]._removed;
    const x1 = a.x + BW, y1 = a.y + BH / 2, x2 = b.x, y2 = b.y + BH / 2, mx = (x1 + x2) / 2;
    svg += `<path class="flow ${ghost ? 'ghost' : ''}" d="M${x1},${y1} H${mx} V${y2} H${x2 - 2}" marker-end="url(#arr-${esc(proc.id)})"/>`;
  });
  steps.forEach((s, i) => {
    const { x, y } = cpos[i];
    const st = s._removed ? 'removed' : s._added ? 'added' : (s._changed && s._changed.length) ? 'changed' : '';
    const t = tById[s.toolId];
    const lines = wrapText(s.name, 24, 2);
    const time = `${num(s.durationMins) ? num(s.durationMins) + ' min' : '—'} · ${s.automated ? 'automated' : 'manual'}`;
    const tip = [s.name, t ? 'Tool: ' + t.name : '', time, s.input ? 'In: ' + s.input : '', s.output ? 'Out: ' + s.output : '', exec && s.painPoint ? 'Pain: ' + s.painPoint : '', s._by ? 'Change: ' + s._by : ''].filter(Boolean).join(' · ');
    svg += `<g class="step ${s.automated ? 'auto' : 'manual'} ${st}" transform="translate(${x},${y})" data-tip="${esc(tip)}">`;
    svg += `<rect class="box" width="${BW}" height="${BH}" rx="8"/>`;
    svg += lines.map((ln, k) => `<text class="s-name" x="10" y="${18 + k * 14}">${esc(ln)}</text>`).join('');
    svg += `<text class="s-tool" x="10" y="${BH - 22}">${esc(trunc(t ? t.name : (s.toolLabel || 'No tool'), 26))}${t && t._removed ? ' (removed)' : ''}</text>`;
    svg += `<text class="s-time" x="10" y="${BH - 9}">${esc(time)}</text>`;
    if (exec && s.painPoint) svg += `<g class="pain" transform="translate(${BW - 4},4)"><circle r="8"/><text y="3.5" text-anchor="middle">!</text></g>`;
    if (st) svg += `<text x="${BW - 8}" y="${BH - 9}" text-anchor="end" style="font-size:9.5px;font-weight:800;fill:${st === 'removed' ? 'var(--crit-ink)' : st === 'added' ? 'var(--good-ink)' : 'var(--warn-ink)'}">${st === 'removed' ? '✕ REMOVED' : st === 'added' ? '+ NEW' : '~ CHANGED'}</text>`;
    svg += '</g>';
  });
  svg += '</svg>';
  return `<div class="lane">${svg}</div>`;
}

/* ---- flows.js ---- */
/* Flow schematics: a serpentine process flow with warning markers, sense-check and exports.
   Data (all optional, backward compatible):
   process: stage, confidence ('heard'|'corroborated'|'measured'), sources, summary, talkingPoints, findingIds
   step:    team, actorLabel/actorId, toolId, automated, durationMins, painPoint, flags:[{type,text,by,date}] */

const TEAMS = [
  ['client', 'Client', 'var(--s-other)'], ['marketing', 'Marketing', 'var(--s5)'], ['sales', 'Sales', 'var(--s1)'],
  ['cs', 'Client Success', 'var(--s3)'], ['ops_onb', 'Ops: Onboarding', 'var(--s2)'], ['ops_tech', 'Ops: Tech & maintenance', 'var(--s9)'], ['ops', 'Operations', 'var(--s2)'], ['product', 'Product & Dev', 'var(--s7)'],
  ['leadership', 'Leadership', 'var(--s4)'], ['finance', 'Finance', 'var(--s6)'], ['system', 'System', 'var(--faint)']
];
const CONFIDENCE = { heard: ['Heard', 'Based on what people told us; not yet checked', 'warn'], corroborated: ['Corroborated', 'Confirmed by more than one source', 's1'], measured: ['Measured', 'Checked against data or observed', 'good'] };
const FLAG_TYPES = { issue: ['Issue', 'raised by the team or interviews'], unverified: ['Unverified', 'to confirm'], weakness: ['Weakness', 'flagged by the machine'] };
/** Size of a flow schematic for n steps in c columns (keep in step with flowSchematic). */
const flowDims = (n, c) => { c = Math.max(1, Math.min(c, n)); const rows = Math.ceil(n / c); return [34 * 2 + c * 262 + (c - 1) * 78, 74 + rows * (150 + 96) - 96 + 92]; };
const REVIEW_STATUS = { assumed: ['Assumed', 'Not yet checked with the team'], confirmed: ['Confirmed', 'Checked: this is how it works'], corrected: ['Corrected', 'Checked and corrected'], unsure: ['Unsure', 'Reviewer was not sure'], 'not-done': ['Does not happen', 'Reviewer says this step does not happen'] };
const stepTimeBasis = (s) => s.timeBasis || ((s.review && (s.review.status === 'confirmed' || s.review.status === 'corrected')) && (num(s.durationMins) || num(s.elapsedDays)) ? 'confirmed' : 'assumed');
/** "≈15 min · 2 d wait" — ≈ marks an assumed time. */
function stepTimeText(s, long = false) {
  const m = num(s.durationMins), d = num(s.elapsedDays); if (!m && !d) return long ? 'Time not known' : 'time ?';
  const pre = stepTimeBasis(s) === 'assumed' ? '≈' : '';
  const mt = m ? (m >= 60 ? `${+(m / 60).toFixed(1)} h` : `${m} min`) : '';
  const dt = d ? `${d} d${long ? ' elapsed' : ''}` : '';
  return pre + [mt, dt].filter(Boolean).join(' · ') + (long ? ` (${stepTimeBasis(s)})` : '');
}
/** A step where work waits or takes long enough to matter (shown in executive view). */
const isHotspot = (s) => num(s.elapsedDays) >= 2 || num(s.durationMins) >= 60;
/** Rank steps by how badly they break: 2 per issue, 1.5 per weakness, 1 for a time hotspot. Top N get the strong highlight. */
function breakPoints(steps, flags, topN) {
  const n = topN == null ? 0 : topN; // 0 = no cap: every step that stands out is marked
  const score = {}, why = {}; const pos = {}; steps.forEach((s, i) => { pos[s.id] = i; });
  steps.forEach((s) => {
    if (!s || s.collapsed || s._removed) return;
    const f = flags.filter((x) => x.stepId === s.id && x.type !== 'unverified');
    const W = { high: 4, medium: 2, low: 1 };
    const issues = f.filter((x) => x.type === 'issue'); const wk = f.filter((x) => x.type === 'weakness').length, hot = isHotspot(s) ? 1 : 0;
    const iw = sum(issues, (x) => (x.on === 'node' && x.idx == null ? W[s.painSeverity] || 2 : W[x.severity] || 2));
    const sc = iw + wk * 1.5 + hot;
    const sev = s.painSeverity && s.painPoint ? ` (${s.painSeverity})` : '';
    if (sc > 0) { score[s.id] = sc; why[s.id] = [issues.length && `${issues.length} issue${issues.length > 1 ? 's' : ''}${sev}`, wk && `${wk} weak hand-off${wk > 1 ? 's' : ''}`, hot && 'time hotspot'].filter(Boolean).join(' · '); }
  });
  const order = Object.keys(score).sort((a, c) => score[c] - score[a] || pos[a] - pos[c]);
  // A break point must stand out: at least half the top score, never splitting a tie at the cut-off,
  // and nothing is marked when every scored step scores the same.
  const max = order.length ? score[order[0]] : 0; const cap = n ? n : order.length;
  const groups = []; order.forEach((id) => { const g = groups[groups.length - 1]; if (g && g.s === score[id]) g.ids.push(id); else groups.push({ s: score[id], ids: [id] }); });
  const picked = []; let flat = false; let cut = 0;
  for (const g of groups) { if (g.s < max * 0.5) break; if (picked.length + g.ids.length > cap) { cut = g.ids.length; break; } picked.push(...g.ids); }
  if ((groups.length === 1 && order.length >= 3) || (!picked.length && order.length)) { picked.length = 0; flat = true; }
  const ranks = {}; const label = {};
  picked.forEach((id, i) => { const first = order.findIndex((x) => score[x] === score[id]); const tied = order.filter((x) => score[x] === score[id]).length > 1; ranks[id] = i + 1; label[id] = `#${first + 1}${tied ? '=' : ''}`; });
  return { ranks, label, order, score, why, flat, cut: flat ? 0 : cut };
}
const teamInfo = (id) => TEAMS.find((t) => t[0] === id) || ['', 'Unassigned', 'var(--line)'];

function stepTeam(s, pById, dById) {
  if (s.team) return s.team;
  const p = s.actorId && pById[s.actorId]; const d = p && dById[p.departmentId];
  const map = { revenue: 'sales', tech: 'product' };
  if (d && d.type) return map[d.type] || d.type;
  return s.automated ? 'system' : '';
}

/** Every warning along a process, numbered in path order. Hand-off weaknesses sit on the connector into a step. */
function flowFlags(proc, people, tools, departments, clientSafe = false) {
  const steps = proc.steps || []; const pById = byId(people), tById = byId(tools), dById = byId(departments);
  const list = []; const add = (f) => { f.n = list.length + 1; list.push(f); };
  steps.forEach((s, i) => {
    if (i && !s._removed) {
      let j = i - 1; while (j >= 0 && steps[j]._removed) j--;
      const prev = steps[j];
      if (prev) {
        const a = stepTeam(prev, pById, dById), b = stepTeam(s, pById, dById);
        if (a && b && a !== b && a !== 'client' && b !== 'client') {
          const ta = tById[prev.toolId], tb = tById[s.toolId];
          if (!isClosed(s.linkState)) {
            if (!tb) add({ type: 'weakness', on: 'link', stepId: s.id, src: 'link', text: `Hand-off from ${teamInfo(a)[1]} to ${teamInfo(b)[1]} with no system to receive it: relies on email, chat or memory`, by: 'Machine' });
            else if (ta && tb && ta.id !== tb.id) add({ type: 'weakness', on: 'link', stepId: s.id, src: 'link', text: `Hand-off from ${teamInfo(a)[1]} to ${teamInfo(b)[1]} switches tool (${ta.name} → ${tb.name}): information re-entered?`, by: 'Machine' });
          }
        }
      }
    }
    if (s.painPoint && !isClosed(s.painState)) add({ type: 'issue', on: 'node', stepId: s.id, src: 'pain', text: s.painPoint, by: proc.sources || 'Interviews' });
    if (!clientSafe) (s.flags || []).forEach((f, k) => { if (!isClosed(f.state)) add({ type: FLAG_TYPES[f.type] ? f.type : 'issue', on: 'node', stepId: s.id, src: 'flag', text: f.text, by: f.by || 'Team', date: f.date, idx: k, severity: f.severity }); });
    if (s._sub && s._sub.n) add({ type: 'issue', on: 'node', stepId: s.id, src: 'sub', text: `${s._sub.n} issue${s._sub.n === 1 ? '' : 's'} inside the sub-process "${s._sub.name}"`, by: 'Sub-process', idx: 'sub', severity: s._sub.sev });
  });
  return list;
}

/** Issues can be resolved (gone for good) or put on hold (set aside); either way they stop counting until reopened. */
const isClosed = (state) => !!(state && (state.status === 'resolved' || state.status === 'hold'));
/** Resolved and on-hold issues on a step, for the side panel. */
function closedIssues(s) {
  const out = [];
  if (s.painPoint && isClosed(s.painState)) out.push({ src: 'pain', type: 'issue', text: s.painPoint, state: s.painState });
  (s.flags || []).forEach((f, k) => { if (isClosed(f.state)) out.push({ src: 'flag', idx: k, type: FLAG_TYPES[f.type] ? f.type : 'issue', text: f.text, state: f.state }); });
  if (isClosed(s.linkState)) out.push({ src: 'link', type: 'weakness', text: s.linkState.text || 'Weak hand-off into this step', state: s.linkState });
  return out;
}

function flagShape(type, n, x, y, r = 11) {
  const t = esc(String(n));
  if (type === 'unverified') return `<g class="fl fl-unverified" transform="translate(${x},${y})"><path d="M0,${-r - 1} L${r + 2},${r - 2} L${-r - 2},${r - 2} Z"/><text y="${r - 5}" text-anchor="middle">${t}</text></g>`;
  if (type === 'weakness') return `<g class="fl fl-weakness" transform="translate(${x},${y})"><path d="M0,${-r - 1} L${r + 1},0 L0,${r + 1} L${-r - 1},0 Z"/><text y="4" text-anchor="middle">${t}</text></g>`;
  return `<g class="fl fl-issue" transform="translate(${x},${y})"><circle r="${r}"/><text y="4" text-anchor="middle">${t}</text></g>`;
}
const flagIcon = (type, n = '') => `<svg class="fl-ico" width="24" height="24" viewBox="-12 -12 24 24" aria-hidden="true">${flagShape(type, n, 0, type === 'unverified' ? 2 : 0, 10)}</svg>`;

/** Serpentine flow: Start → numbered step nodes (team-coloured) → End, with warning markers on nodes and links. */
function flowSchematic(proc, people, tools, departments, { cols = 3, selected = '', anonymise = false, interactive = true, zoom = 0, clientSafe = false, exec = true, ranks = null } = {}) {
  const steps = proc.steps || [];
  if (!steps.length) return '<p class="empty">This process has no steps yet.</p>';
  const pById = byId(people), tById = byId(tools), dById = byId(departments);
  const flags = exec ? flowFlags(proc, people, tools, departments, clientSafe) : [];
  const bpx = exec ? (ranks ? { ranks, label: (ranks._label || {}) } : breakPoints(steps, flags)) : { ranks: {}, label: {} }; const rk = bpx.ranks;
  cols = Math.max(1, Math.min(cols, steps.length));
  const NW = 262, NH = 150, GX = 78, GY = 96, PX = 34, TOP = 74;
  const rows = Math.ceil(steps.length / cols);
  const W = PX * 2 + cols * NW + (cols - 1) * GX, H = TOP + rows * (NH + GY) - GY + 92;
  const pos = steps.map((s, i) => { const r = Math.floor(i / cols); let c = i % cols; if (r % 2) c = cols - 1 - c; return { x: PX + c * (NW + GX), y: TOP + r * (NH + GY), r }; });
  const mid = `fa-${esc(proc.id)}`;
  const si = selected ? steps.findIndex((x) => x.id === selected) : -1;
  const near = si < 0 ? null : new Set([si - 1, si, si + 1]);
  let svg = `<svg class="flow-svg" viewBox="0 0 ${W} ${H}" ${zoom ? `width="${Math.round(W * zoom)}" height="${Math.round(H * zoom)}" style="max-width:none"` : `width="100%" style="max-width:${W}px"`} role="img" aria-label="Flow: ${esc(proc.name)}" data-w="${W}" data-h="${H}">`;
  svg += `<defs><marker id="${mid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker></defs>`;
  // start / end pills
  const pill = (x, y, label, text) => `<g class="pill"><rect x="${x}" y="${y}" width="${NW}" height="34" rx="17"/><text x="${x + 16}" y="${y + 22}"><tspan class="pl">${label}</tspan> ${esc(trunc(text, 29))}</text></g>`;
  const p0 = pos[0], pl = pos[pos.length - 1];
  svg += `<path class="link" d="M${p0.x + NW / 2},${p0.y - 40 + 34} V${p0.y - 3}" marker-end="url(#${mid})"/>`;
  svg += pill(p0.x, p0.y - 40 - 6, 'START', proc.inputs || 'Trigger');
  svg += `<path class="link" d="M${pl.x + NW / 2},${pl.y + NH} V${pl.y + NH + 40}" marker-end="url(#${mid})"/>`;
  svg += pill(pl.x, pl.y + NH + 44, 'END', proc.outputs || 'Outcome');
  // links with hand-off and weakness markers
  steps.forEach((s, i) => {
    if (!i) return; const a = pos[i - 1], b = pos[i];
    const ghost = s._removed || steps[i - 1]._removed ? ' ghost' : '';
    let d, mx, my;
    if (a.r === b.r) { const ltr = b.x > a.x; const x1 = ltr ? a.x + NW : a.x, x2 = ltr ? b.x - 3 : b.x + NW + 3, y = a.y + NH / 2; d = `M${x1},${y} H${x2}`; mx = (x1 + x2) / 2; my = y; }
    else { const x = a.x + NW / 2; d = `M${x},${a.y + NH} V${b.y - 3}`; mx = x; my = (a.y + NH + b.y) / 2; }
    const ta = teamInfo(stepTeam(steps[i - 1], pById, dById)), tb = teamInfo(stepTeam(s, pById, dById));
    const handoff = ta[0] && tb[0] && ta[0] !== tb[0];
    const hl = near && (i === si || i - 1 === si) ? ' hl' : near ? ' dim' : '';
    svg += `<path class="link${handoff ? ' handoff' : ''}${ghost}${hl}" d="${d}" marker-end="url(#${mid})"/>`;
    const lf = flags.filter((f) => f.on === 'link' && f.stepId === s.id);
    if (lf.length) svg += lf.map((f, k) => `<g data-tip="${esc(`${f.n}. ${f.text}`)}" ${interactive ? `data-action="flowStep" data-id="${esc(s.id)}" data-flag="link"` : ''} class="clk">${flagShape('weakness', f.n, mx + k * 26, my)}</g>`).join('');
    else if (handoff) svg += `<g class="ho" transform="translate(${mx},${my})" data-tip="${esc(`Hand-off: ${ta[1]} → ${tb[1]}`)}"><circle r="9"/><text y="4" text-anchor="middle">⇄</text></g>`;
  });
  // nodes
  steps.forEach((s, i) => {
    const { x, y } = pos[i]; const tm = teamInfo(stepTeam(s, pById, dById));
    const st = s._removed ? 'removed' : s._added ? 'added' : (s._changed && s._changed.length) ? 'changed' : '';
    const p = s.actorId && pById[s.actorId];
    const actor = p ? (anonymise ? (p.title || 'Team member') : p.name) : (s.actorLabel || '');
    const t = tById[s.toolId];
    const lines = wrapText(s.name || 'Step', 31, 3);
    const nf = flags.filter((f) => f.on === 'node' && f.stepId === s.id);
    const flagged = exec && flags.some((f) => f.stepId === s.id && f.type !== 'unverified'); const rank = rk[s.id];
    const rv = (s.review && s.review.status) || 'assumed';
    const hot = exec && isHotspot(s);
    svg += `<g class="fnode ${rank ? 'bp-top' : flagged ? 'bp-lite' : ''} ${s._focus ? 'focus' : ''} ${s._dim ? 'hl-dim' : ''} ${s.collapsed ? 'collapsed' : ''} ${s.automated ? 'auto' : 'manual'} ${exec && s.kind === 'decision' ? 'decision' : ''} rvs-${rv} ${st} ${selected === s.id ? 'sel' : near && near.has(i) ? 'nbr' : near ? 'dim' : ''} ${interactive ? 'clk' : ''}" transform="translate(${x},${y})" ${interactive ? `data-action="flowStep" data-id="${esc(s.id)}"` : ''} data-tip="${esc([s.name, actor, t ? 'Tool: ' + t.name : 'No system', s.automated ? 'Automated' : 'Manual', stepTimeText(s, true), REVIEW_STATUS[rv][0] + (s.review && s.review.by ? ' by ' + s.review.by : '')].filter(Boolean).join(' · '))}">`;
    svg += `<rect class="nb" width="${NW}" height="${NH}" rx="12"/>`;
    if (s._procStart) svg += `<text class="pstart" x="2" y="${rank ? -27 : -9}">▸ triggers: ${esc(trunc(s._procStart, 34))}</text>`;
    if (rank) svg += `<g class="bp-pill"><rect x="${NW / 2 - 56}" y="-12" width="112" height="21" rx="10.5"/><text x="${NW / 2}" y="3" text-anchor="middle">${bpx.label[s.id] || '#' + rank} BREAK POINT</text></g>`;
    svg += `<rect class="band" width="${NW}" height="28" rx="12" style="fill:${tm[2]}"/><rect class="band" y="16" width="${NW}" height="12" style="fill:${tm[2]}"/>`;
    svg += `<circle class="num" cx="18" cy="14" r="10"/><text class="numt" x="18" y="18" text-anchor="middle" ${String(s.displayNum || '').length > 2 ? 'style="font-size:8px"' : ''}>${esc(s.displayNum || i + 1)}</text>`;
    svg += `<text class="team" x="36" y="18.5">${exec && s.kind === 'decision' ? '◇ DECISION · ' : ''}${esc(s.collapsed ? 'OTHER TEAMS' : tm[1].toUpperCase())}${s._sub ? ' · ⊞ SUB-PROCESS' : ''}</text>`;
    svg += lines.map((ln, k) => `<text class="nm" x="14" y="${50 + k * 16}">${esc(ln)}</text>`).join('');
    if (actor) svg += `<text class="act" x="14" y="${NH - 48}">${esc(trunc(actor, 40))}</text>`;
    const extra = !exec ? '' : s.kind === 'decision' && s.decisionNo ? `If no: ${s.decisionNo}` : s.involves ? `With: ${s.involves}` : '';
    if (extra) svg += `<text class="inv ${s.kind === 'decision' ? 'inv-d' : ''}" x="14" y="${NH - 33}">${esc(trunc(extra, 40))}</text>`;
    svg += `<line class="sep" x1="14" x2="${NW - 14}" y1="${NH - 24}" y2="${NH - 24}"/>`;
    svg += `<text class="tool" x="14" y="${NH - 9}">${s.automated ? '⚙ ' : ''}${esc(trunc(t ? t.name : 'No system', 22))}${t && t._removed ? ' (removed)' : ''}</text>`;
    if (!s.collapsed) svg += `<text class="mode ${hot ? 'm-hot' : stepTimeBasis(s) === 'assumed' ? 'm-assumed' : 'm-confirmed'}" x="${NW - 14}" y="${NH - 9}" text-anchor="end">${hot ? '⏱ ' : ''}${esc(stepTimeText(s))}</text>`;
    nf.forEach((f, k) => { svg += `<g data-tip="${esc(`${f.n}. ${FLAG_TYPES[f.type][0]}: ${f.text}`)}">${flagShape(f.type, f.n, NW - 14 - k * 27, 0)}</g>`; });
    if (st) svg += `<text class="stt stt-${st}" x="${NW - 14}" y="${NH - 48}" text-anchor="end">${st === 'removed' ? '✕ REMOVED' : st === 'added' ? '+ NEW' : '~ CHANGED'}</text>`;
    svg += '</g>';
  });
  svg += '</svg>';
  return `<div class="flow-wrap">${clientSafe ? svg.replace(/ data-tip="[^"]*"/g, '') : svg}</div>`;
}

const flowLegend = (clientSafe = false) => `<div class="legend flow-legend">
  <span>${flagIcon('issue')} Issue <span class="faint">(team / interviews)</span></span>
  ${clientSafe ? '' : `<span>${flagIcon('unverified')} Unverified <span class="faint">(to confirm)</span></span>`}
  <span>${flagIcon('weakness')} Weakness <span class="faint">(flagged by the machine)</span></span>
  <span><span class="ho-ico">⇄</span> Hand-off between teams</span>
  <span><span class="chip" style="border-style:dashed">⚙ Automated</span></span>
  <span><span class="rv-dot rv-assumed"></span>Assumed</span><span><span class="rv-dot rv-confirmed"></span>Confirmed by the team</span><span><span class="rv-dot rv-unsure"></span>Unsure</span><span><span class="rv-dot rv-not-done"></span>Doesn't happen</span>
  <span class="faint">≈ time is an estimate · ◇ decision point</span></div>`;

/** Confidence shown: measured if set; corroborated once the team has sense-checked it; otherwise what was set. */
function effConfidence(p) {
  if (p.confidence === 'measured') return 'measured';
  const done = (p.reviews || []).some((r) => Object.keys(r.verdicts || {}).length);
  return done ? 'corroborated' : (p.confidence || '');
}
function reviewSummary(p) {
  return (p.reviews || []).filter((r) => Object.keys(r.verdicts || {}).length).map((r) => {
    const v = Object.values(r.verdicts); const c = (k) => v.filter((x) => x === k).length;
    return `${r.label || 'Reviewer'} (${r.date}): ${[c('confirmed') && c('confirmed') + ' confirmed', c('corrected') && c('corrected') + ' corrected', c('not-done') && c('not-done') + ' not done', c('unsure') && c('unsure') + ' unsure', (r.added || []).length && (r.added || []).length + ' added'].filter(Boolean).join(', ')}`;
  });
}
function flowTimeTotals(p) {
  const st = live(p.steps); const mins = sum(st, (x) => x.durationMins), days = sum(st, (x) => x.elapsedDays);
  const timed = st.filter((x) => num(x.durationMins) || num(x.elapsedDays)).length; const assumed = st.some((x) => (num(x.durationMins) || num(x.elapsedDays)) && stepTimeBasis(x) === 'assumed');
  return { mins, days, timed, total: st.length, assumed };
}

function svgStandalone(markup) {
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-100000px;top:0;width:2400px';
  Object.entries(LIGHT_TOKENS).forEach(([k, v]) => holder.style.setProperty(k, v));

  const props = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'font-size', 'font-weight', 'letter-spacing'];
  const parts = [...holder.querySelectorAll('svg.flow-svg')].map((svg) => {
    const W = +svg.dataset.w, H = +svg.dataset.h;
    const els = [...svg.querySelectorAll('*')];
    const styles = els.map((el) => { const cs = getComputedStyle(el); const out = props.map((pr) => `${pr}:${cs.getPropertyValue(pr)}`); if (el.tagName === 'text' || el.tagName === 'tspan') out.push('font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif'); return out.join(';'); });
    els.forEach((el, i) => { el.setAttribute('style', styles[i]); el.removeAttribute('class'); });
    const h = svg.closest('.flow-wrap') && svg.closest('.flow-wrap').previousElementSibling;
    return { svg, W, H, label: h && h.classList.contains('chain-h') ? h.textContent.replace(/\s+/g, ' ').trim() : '' };
  });
  const NS = 'http://www.w3.org/2000/svg';
  const W = Math.max(...parts.map((p) => p.W)); const LBL = parts.length > 1 ? 34 : 0;
  const H = parts.reduce((a, p) => a + p.H + LBL, 0);
  const out = document.createElementNS(NS, 'svg'); out.setAttribute('xmlns', NS); out.setAttribute('width', W); out.setAttribute('height', H); out.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const bg = document.createElementNS(NS, 'rect'); bg.setAttribute('width', W); bg.setAttribute('height', H); bg.setAttribute('fill', '#fffdf9'); out.appendChild(bg);
  let y = 0;
  parts.forEach((p) => {
    if (LBL) { const t = document.createElementNS(NS, 'text'); t.setAttribute('x', 24); t.setAttribute('y', y + 24); t.setAttribute('style', 'font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#171715'); t.textContent = p.label; out.appendChild(t); y += LBL; }
    p.svg.setAttribute('x', 0); p.svg.setAttribute('y', y); p.svg.setAttribute('width', p.W); p.svg.setAttribute('height', p.H); p.svg.removeAttribute('style'); out.appendChild(p.svg); y += p.H;
  });
  const xml = new XMLSerializer().serializeToString(out); holder.remove();
  return { xml, W, H };
}

   Processes have an optional group label and can trigger other processes (leadsTo); there are no fixed stages. */

const procGroup = (p) => p.group || (p.stage ? 'Client lifecycle' : 'Ungrouped');
const procDepts = (p, pById, dById) => { const s = new Set(); (p.steps || []).filter((x) => !x._removed).forEach((x) => { const t = stepTeam(x, pById, dById); if (t) s.add(t); }); return s; };

/** Current selection, with sensible defaults so the page is never empty. */
function pvState(st) {
  const pById = byId(st.people), dById = byId(st.departments);
  const allProcs = st.processes.filter((p) => !p._removed);
  const subOf = {}; allProcs.forEach((p) => (p.steps || []).forEach((x, i) => { if (x.subProcessId && !subOf[x.subProcessId]) subOf[x.subProcessId] = { p, s: x, i }; }));
  // a step that opens into a sub-process carries a summary of what is inside, so its issues count on the parent map
  const decorate = (p) => Object.assign({}, p, { steps: (p.steps || []).map((x) => { const sp = x.subProcessId && allProcs.find((y) => y.id === x.subProcessId); if (!sp) return x;
    const iss = flowFlags(sp, st.people, st.tools, st.departments, true).filter((f) => f.type === 'issue');
    return Object.assign({}, x, { _sub: { id: sp.id, name: sp.name, n: iss.length, mapped: !!(sp.steps || []).length, sev: (sp.steps || []).some((y) => y.painSeverity === 'high' && y.painPoint) ? 'high' : 'medium' } }); }) });
  const procs = allProcs.filter((p) => (p.steps || []).length).map(decorate);
  const deptsOf = Object.fromEntries(procs.map((p) => [p.id, procDepts(p, pById, dById)]));
  const counts = {}; procs.forEach((p) => (p.steps || []).forEach((s) => { const t = stepTeam(s, pById, dById); if (t) counts[t] = (counts[t] || 0) + 1; }));
  const allDepts = TEAMS.map((t) => t[0]).filter((t) => counts[t] && t !== 'client' && t !== 'system');
  const V = ui.pv || {};
  const mode = V.mode === 'proc' ? 'proc' : 'dept';
  const busiest = allDepts.slice().sort((a, b) => counts[b] - counts[a])[0] || '';
  const dept = allDepts.includes(V.dept) ? V.dept : busiest;
  const deptProcs = procs.filter((p) => deptsOf[p.id].has(dept)).map((p) => p.id);
  const dSel = (V.dprocs || []).filter((id) => deptProcs.includes(id));
  const focus = allProcs.some((p) => p.id === V.focus) ? V.focus : ''; const focusP = allProcs.find((p) => p.id === focus);
  const focusMapped = !!(focusP && (focusP.steps || []).length);

  else if (!focusMapped) procIds = [];
  else if (V.journey) { const grp = procGroup(focusP); const ch = procChains(procs, procs.filter((p) => procGroup(p) === grp).map((p) => p.id)).find((c) => c.some((p) => p.id === focus)); procIds = ch ? ch.map((p) => p.id) : [focus]; }
  else procIds = [focus];
  const availDepts = TEAMS.map((t) => t[0]).filter((t) => procIds.some((id) => deptsOf[id].has(t)));

  const hl = mode === 'proc' && availDepts.includes(V.hl) ? V.hl : '';
  return { mode, dept, deptProcs, procIds, availDepts, shownDepts, allDepts, counts, procs, deptsOf, layout: V.layout === 'lanes' ? 'lanes' : 'flow', allProcs, subOf, focus, focusP, focusMapped, journey: !!V.journey, hl };
}

/** Order the selected processes into chains following "triggers" links; unlinked processes stand alone. */
function procChains(procs, ids) {
  const sel = ids.map((id) => procs.find((p) => p.id === id)).filter(Boolean);
  const inSel = new Set(sel.map((p) => p.id));
  const next = (p) => splitList(p.leadsTo).filter((id) => inSel.has(id));
  const hasIn = new Set(sel.flatMap((p) => next(p)));
  const used = new Set(); const chains = [];
  const walk = (p, chain) => { if (!p || used.has(p.id)) return; used.add(p.id); chain.push(p); next(p).forEach((id, k) => { if (k === 0) walk(sel.find((x) => x.id === id), chain); }); };
  sel.filter((p) => !hasIn.has(p.id)).forEach((p) => { const c = []; walk(p, c); if (c.length) chains.push(c); });
  sel.filter((p) => !used.has(p.id)).forEach((p) => { const c = []; walk(p, c); if (c.length) chains.push(c); });
  return chains;
}

/** Steps to draw, numbered across the whole visual. Unticked departments (process view) collapse into grey cards. */
function pvSeq(st, P) {
  const pById = byId(st.people), dById = byId(st.departments);
  const chains = procChains(P.procs, P.procIds); let n = 0;
  return chains.map((chain) => {
    const items = [];
    chain.forEach((p, pi) => (p.steps || []).filter((x) => !x._removed).forEach((s, si) => {
      n++; const dept = stepTeam(s, pById, dById) || 'other';
      items.push({ s, p, dept, num: n, procStart: si === 0 && pi > 0, shown: P.mode === 'dept' || P.shownDepts.includes(dept) || dept === 'client' || dept === 'system' || dept === 'other' });
    }));
    return { chain, items };
  });
}

/** One merged pseudo-process per chain, for the serpentine flow. */
function chainAsProcess(c, P) {
  const steps = [];
  c.items.forEach((it) => {
    if (!it.shown) {
      const last = steps[steps.length - 1];
      if (last && last.collapsed) { last._n++; last._d.add(teamInfo(it.dept)[1]); last.name = `${[...last._d].join(', ')}: ${last._n} steps`; last.displayNum = `${last._from}–${it.num}`; return; }
      steps.push({ id: it.s.id, collapsed: true, _n: 1, _from: it.num, displayNum: it.num, _d: new Set([teamInfo(it.dept)[1]]), name: `${teamInfo(it.dept)[1]}: ${it.s.name}`, team: '', automated: false, toolId: '', actorLabel: '' }); return;
    }
    steps.push(Object.assign({}, it.s, { team: it.dept === 'other' ? '' : it.dept, displayNum: it.num, _procStart: it.procStart ? it.p.name : '', _focus: P.mode === 'dept' && it.dept === P.dept, _dim: !!(P.hl && it.dept !== P.hl) }));
  });
  const first = c.chain[0], last = c.chain[c.chain.length - 1];
  return { id: 'chain_' + first.id, name: c.chain.map((p) => p.name).join(' → '), inputs: first.inputs, outputs: last.outputs, steps, sources: c.chain.map((p) => p.sources).filter(Boolean).join('; ') };
}

/** Swimlanes across all chains: one row per department, steps in sequence, hand-offs crossing rows. */

    g += `<circle class="num" cx="${P2.x + 18}" cy="${P2.y + 16}" r="9"/>${T(P2.x + 18, P2.y + 20, it.num, 'numt', 'middle')}`;
    if (dec) g += T(P2.x + 32, P2.y + 20, '◇ DECISION', 'jl-dec');
    if (rank) g += `<g class="bp-pill"><rect x="${P2.x + P2.w / 2 - 52}" y="${P2.y - 11}" width="104" height="19" rx="9.5"/><text x="${P2.x + P2.w / 2}" y="${P2.y + 3}" text-anchor="middle">${bpx.label[it.s.id] || '#' + rank} BREAK POINT</text></g>`;

  return `<div class="flow-wrap zoomed"><div class="jl-grid"><div class="jl-stick">${ov}</div>${g}</div></div>`;

/** The visual for the current selection (flow: one serpentine per chain; swimlane: all chains in one). */
function pvVisual(st, P, seqChains, { exec, interactive = true, zoom = 0, cols = 3, selected = '', clientSafe = false, ranks = null } = {}) {
  if (P.layout === 'lanes') return pvLanes(st, P, seqChains, { exec, interactive, zoom, selected, clientSafe: true, ranks });
  return seqChains.map((c) => {
    const mp = chainAsProcess(c, P);
    const head = c.chain.length > 1 ? `<div class="chain-h"><span class="faint small">Linked processes:</span> ${c.chain.map((p) => `<b>${esc(p.name)}</b>`).join(' <span class="faint">→ triggers →</span> ')}</div>` : (seqChains.length > 1 ? `<div class="chain-h"><b>${esc(c.chain[0].name)}</b> <span class="faint small">${esc(procGroup(c.chain[0]))}</span></div>` : '');
    return head + flowSchematic(mp, st.people, st.tools, st.departments, { cols, selected, interactive, zoom, clientSafe, exec, anonymise: ui.anon, ranks });
  }).join('<div class="chain-gap"></div>');
}

/* ---------- Page ---------- */
function processPage(e) {

  const exec = ui.execView !== false;
  const pById = byId(st.people), dById = byId(st.departments);
  const seqChains = pvSeq(st, P); const all = seqChains.flatMap((c) => c.items);

  const groups = (ids) => { const out = {}; ids.slice().sort((a, b) => order.indexOf(a) - order.indexOf(b)).forEach((id) => { const p = P.procs.find((x) => x.id === id); (out[procGroup(p)] = out[procGroup(p)] || []).push(p); }); return out; };
  const procTick = (p, kind, on) => { const ds = [...P.deptsOf[p.id]].filter((t) => t !== 'client' && t !== 'system'); return `<label class="jtick ${on ? 'on' : ''}"><input type="checkbox" data-action="pvTick" data-kind="${kind}" data-id="${esc(p.id)}" ${on ? 'checked' : ''}><span>${esc(p.name)}</span><span class="pdots">${ds.map((t) => `<i class="tdot" title="${esc(teamInfo(t)[1])}" style="background:${teamInfo(t)[2]}"></i>`).join('')}</span></label>`; };
  const groupBlock = (ids, kind, isOn) => Object.entries(groups(ids)).map(([gname, ps]) => `<div class="pv-group"><span class="pv-gl">${esc(gname)}</span>${ps.map((p) => procTick(p, kind, isOn(p.id))).join('')}</div>`).join('');

  const single = procs.length === 1 ? e.processes.find((x) => x.id === procs[0].id) : null;
  const groupsList = [...new Set(e.processes.map((p) => p.group).filter(Boolean))];

/* ---------- Process view: index (every process, mapped or not) and the focus header ---------- */
const JOURNEYS = ['Client lifecycle', 'Product', 'Admin & finance', 'People'];
function procTeam(p, st) {
  if (p.team) return p.team;
  const pById = byId(st.people), dById = byId(st.departments); const c = {};
  (p.steps || []).forEach((x) => { const t = stepTeam(x, pById, dById); if (t && t !== 'client' && t !== 'system') c[t] = (c[t] || 0) + 1; });
  return Object.keys(c).sort((a, b) => c[b] - c[a])[0] || '';
}
/** Mapped? Checked with the team? */
function procStatus(p) {
  const steps = (p.steps || []).filter((x) => !x._removed);
  if (!steps.length) return { k: 'none', t: 'Not mapped' };
  const ok = steps.filter((x) => x.review && ['confirmed', 'corrected'].includes(x.review.status)).length;
  return ok / steps.length >= 0.5 ? { k: 'ok', t: `Checked ${ok}/${steps.length}` } : { k: 'as', t: ok ? `Assumed · ${ok}/${steps.length} checked` : 'Assumed' };
}
const teamChip = (t) => t ? `<span class="pi-team"><i class="tdot" style="background:${teamInfo(t)[2]}"></i>${esc(teamInfo(t)[1])}</span>` : '<span class="pi-team faint">No owner yet</span>';

function pvIndex(e, st, P, sw) {
  const all = P.allProcs; const pick = (ui.pv || {}).pick || '';
  const head = `<div class="pv-toprow">${sw}<button class="btn ${pick ? 'on' : ''}" data-action="pvPick" data-id="${pick ? '' : 'open'}">Choose process ${pick ? '▴' : '▾'}</button></div>`;
  if (!pick) return `<section class="card pv-top pv-index">${head}</section>`;
  // break points across everything mapped, so each list shows where the trouble sits
  const steps = P.procs.flatMap((p) => (p.steps || []).filter((x) => !x._removed));
  const flags = P.procs.flatMap((p) => flowFlags(p, st.people, st.tools, st.departments));
  const BP = breakPoints(steps, flags);
  const info = {}; all.forEach((p) => { const dp = P.procs.find((x) => x.id === p.id) || p; const fl = (dp.steps || []).length ? flowFlags(dp, st.people, st.tools, st.departments) : [];
    info[p.id] = { st: procStatus(p), iss: fl.filter((f) => f.type === 'issue').length, bp: (dp.steps || []).filter((x) => BP.ranks[x.id]).length, n: (p.steps || []).length }; });
  const grpOf = (p) => procGroup(P.subOf[p.id] ? P.subOf[p.id].p : p);
  const names = [...JOURNEYS, ...[...new Set(all.map(grpOf))].filter((g) => !JOURNEYS.includes(g)).sort()];
  const tiles = names.map((g) => { const inG = all.filter((p) => grpOf(p) === g); const m = inG.filter((p) => (p.steps || []).length).length; const bp = sum(inG, (p) => info[p.id].bp);
    return `<button class="ps-tile ${pick === g ? 'on' : ''}" data-action="pvPick" data-id="${esc(g)}"><b>${esc(g)}</b><span>${inG.length ? `${m} of ${inG.length} mapped` : 'Nothing listed yet'}</span>${bp ? `<em>⚑ ${bp} break point${bp === 1 ? '' : 's'}</em>` : ''}</button>`; }).join('');
  let list = '';
  if (pick !== 'open') {
    const chainOrder = procChains(P.procs, P.procs.map((p) => p.id)).flat().map((p) => p.id);
    const ord = (p) => { const k = chainOrder.indexOf(p.id); return k < 0 ? 999 : k; };
    const row = (p, depth) => { const I = info[p.id]; const kids = all.filter((c) => P.subOf[c.id] && P.subOf[c.id].p.id === p.id);
      return `<button class="pi-row pi-${I.st.k} ${depth ? 'pi-sub' : ''}" data-action="pvFocus" data-id="${esc(p.id)}">
        <span class="pi-name">${depth ? '<span class="faint">↳</span> ' : ''}${esc(p.name)}</span>
        ${teamChip(procTeam(p, st))}
        <span class="pi-st st-${I.st.k}">${I.st.k === 'ok' ? '✓ ' : I.st.k === 'as' ? '○ ' : ''}${esc(I.st.t)}</span>
        <span class="pi-bp">${I.bp ? `⚑ ${I.bp}` : I.iss ? `<span class="pi-iss"><span class="pi-dot"></span>${I.iss}</span>` : ''}</span>
      </button>${kids.map((c) => row(c, depth + 1)).join('')}`; };
    const ps = all.filter((p) => !P.subOf[p.id] && procGroup(p) === pick).sort((a, b) => ((a.steps || []).length ? 0 : 1) - ((b.steps || []).length ? 0 : 1) || ord(a) - ord(b) || a.name.localeCompare(b.name));
    list = ps.length ? `<div class="pi-list">${ps.map((p) => row(p, 0)).join('')}</div><p class="faint small" style="margin:8px 2px 0">✓ checked with the team · ○ assumed · dashed = not mapped yet · ⚑ top break points · ● issues</p>`
      : '<p class="empty">No processes listed in this section yet. Use + New process.</p>';
  }
  return `<section class="card pv-top pv-index">${head}<div class="ps-tiles">${tiles}</div>${list}</section>`;
}

function pvFocusHead(e, st, P, sw, all) {
  const p = P.focusP; const parent = P.subOf[p.id];
  const grpName = procGroup(parent ? parent.p : p);
  const from = P.allProcs.filter((x) => splitList(x.leadsTo).includes(p.id));
  const to = splitList(p.leadsTo).map((id) => P.allProcs.find((x) => x.id === id)).filter(Boolean);
  const link = (x) => `<button class="pl-chip" data-action="pvFocus" data-id="${esc(x.id)}">${esc(x.name)}</button>`;
  const status = procStatus(p);
  const counts = {}; all.filter((it) => it.shown).forEach((it) => { counts[it.dept] = (counts[it.dept] || 0) + 1; });
  const who = Object.entries(counts).filter(([t]) => t !== 'system' && t !== 'other').sort((a, b) => b[1] - a[1]);
  const crumb = `<span class="faint">${esc(grpName)}</span> › ${parent ? `<button class="crumb-l" data-action="pvFocus" data-id="${esc(parent.p.id)}">${esc(parent.p.name)}</button> › ` : ''}<b>${esc(p.name)}</b>`;
  return `<section class="card pv-top pv-focus"><div class="pv-toprow">${sw}<button class="btn sm" data-action="pvBack" data-id="${esc(grpName)}">◂ Choose another process</button><span class="pv-crumb">${crumb}</span><span class="pi-st st-${status.k}">${esc(status.t)}</span>${teamChip(procTeam(p, st))}</div>
    ${P.focusMapped ? `<div class="pv-links">${parent ? `<span><span class="faint small">Part of</span> ${link(parent.p)} <span class="faint small">at step ${parent.i + 1}</span></span>` : ''}
      <span><span class="faint small">← Comes from</span> ${from.length ? from.map(link).join(' ') : '<span class="faint small">nothing linked</span>'}</span>
      <span><span class="faint small">Leads to →</span> ${to.length ? to.map(link).join(' ') : '<span class="faint small">nothing linked</span>'}</span>
      ${from.length || to.length ? `<label class="tog small"><input type="checkbox" data-action="pvJourney" ${P.journey ? 'checked' : ''}> Show the whole journey</label>` : ''}</div>
    <div class="pv-who"><span class="faint small">Who touches it</span>${who.map(([t, n]) => `<button class="pw-chip ${P.hl === t ? 'on' : ''} ${P.hl && P.hl !== t ? 'off' : ''}" data-action="pvHl" data-id="${esc(t)}" title="Highlight this department's steps"><i class="tdot" style="background:${teamInfo(t)[2]}"></i>${esc(teamInfo(t)[1])} <b>${n}</b></button>`).join('')}${P.hl ? '<button class="btn sm ghost" data-action="pvHl" data-id="">Clear</button>' : '<span class="faint small">Click one to highlight its steps</span>'}</div>` : ''}</section>`;
}

function pvUnmapped(e, P) {
  const p = P.focusP; const q = p.askId && e.customQuestions.find((x) => x.id === p.askId); const who = q && e.people.find((x) => x.id === q.personId);
  const parent = P.subOf[p.id];
  return card('Not mapped yet', `<p style="margin-top:0">${esc(p.summary || 'We know this process exists, but nobody has walked us through it yet.')}</p>
    ${q ? `<div class="pu-q"><span class="faint small">Question to ask${who ? ` · ${esc(who.name)}${who.title ? ', ' + esc(who.title) : ''}` : ''}</span><div>${esc(q.q)}</div>${q.note ? `<div class="faint small">${esc(q.note)}</div>` : ''}</div>` : ''}
    ${parent ? `<p class="small">Sub-process of <b>${esc(parent.p.name)}</b>, step ${parent.i + 1}: ${esc(parent.s.name)}.</p>` : ''}
    <div class="btn-row"><button class="btn" data-action="procMapStart">+ Start mapping: add the first step</button><button class="btn ghost" data-action="pvBack" data-id="${esc(procGroup(parent ? parent.p : p))}">◂ Choose another process</button></div>`);
}

/* ============================================================
   Views — each returns an HTML string for the main panel
   ============================================================ */
const TABS = [
  ['home', 'Leaks & opportunities'], ['plan', 'Plan'], ['processes', 'Processes'], ['evidence', 'Evidence'],
  ['talk', 'Conversations'], ['progress', 'Progress & reports'], ['data', 'Sources & data']
];

const card = (title, body, { sub = '', cls = '', actions = '' } = {}) =>
  `<section class="card ${cls}"><header class="card-h"><div><h3>${title}</h3>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${actions}</header>${body}</section>`;
const sevChip = (s) => `<span class="chip sev-${s}">${s === 'high' ? '▲ High' : s === 'medium' ? '● Medium' : '○ Low'}</span>`;
const stChip = (x) => x._removed ? '<span class="chip st-removed">✕ Removed</span>' : x._added ? '<span class="chip st-added">+ New</span>' : (x._changed && x._changed.length) ? '<span class="chip st-changed">~ Changed</span>' : '';
const empty = (msg) => `<p class="empty">${msg}</p>`;
const pct = (v) => `${Math.round(v)}%`;
const hrs = (v) => `${Math.round(v).toLocaleString('en-GB')} h`;

function deltaHTML(cur, next, fmt, lowerIsGood = true) {
  const d = next - cur; if (Math.abs(d) < 0.5) return '<span class="k-delta">no change</span>';
  const good = lowerIsGood ? d < 0 : d > 0;
  return `<span class="k-delta ${good ? 'delta-good' : 'delta-bad'}">${d > 0 ? '▲' : '▼'} ${fmt(Math.abs(d))} vs current</span>`;
}
const kpi = (label, value, delta = '') => `<div class="kpi"><div class="k-label">${label}</div><div class="k-value${String(value).replace(/<[^>]+>/g, '').length > 14 ? ' k-text' : ''}">${value}</div>${delta}</div>`;

function scenarioBanner(e) {
  if (ui.scenario === 'current') return '';
  return `<div class="banner">Showing the <strong>${esc(scenarioName(e, ui.scenario))}</strong> scenario. Changes are flagged: <span class="chip st-added">+ New</span> <span class="chip st-changed">~ Changed</span> <span class="chip st-removed">✕ Removed</span> <button class="link" data-action="setScenario" data-id="current">Back to current state</button></div>`;
}

/* ---------------- Business & market ---------------- */
function field(path, label, value, { type = 'text', area = false, ph = '' } = {}) {
  return `<label class="fld"><span>${label}</span>${area
    ? `<textarea data-bind="${path}" rows="3" placeholder="${esc(ph)}">${esc(value)}</textarea>`
    : `<input data-bind="${path}" type="${type}" value="${esc(value)}" placeholder="${esc(ph)}">`}</label>`;
}
