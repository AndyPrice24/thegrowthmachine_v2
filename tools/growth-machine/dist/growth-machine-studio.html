/* ============================================================
   Leaks & opportunities: everything the machine has found, in one ranked list.
   Sources: findings (kind, valueMonthly, basis, partOf, fixId), opportunities, and the
   crossover rule engine (signals spotted automatically by combining data).
   ============================================================ */
const LENSES = [
  ['leak', 'Leaks', 'Money, time or customers being lost'],
  ['weakness', 'Weaknesses', 'Processes, people, structure or decisions that hold the business back'],
  ['hole', 'Holes', 'Things that should exist and don\'t'],
  ['opportunity', 'Opportunities', 'Revenue or advantage not yet taken'],
  ['tool', 'Tools', 'Systems and vendors to replace, consolidate or cut'],
];
const LENS_ICON = { leak: '💧', weakness: '⚠', hole: '◌', opportunity: '★', tool: '⚙' };
const BASES = ['Leaking', 'At risk', 'Spend to review', 'Upside'];
const SEV_W = { high: 3, medium: 2, low: 1 };
/* Ranking weight per basis: money leaking counts in full; at risk and upside at half; spend to review at a fifth,
   because only part of a cost base is a realistic saving. Shown on the page so the ranking is transparent. */
const BASIS_W = { 'Leaking': 1, 'At risk': 0.5, 'Upside': 0.5, 'Spend to review': 0.2 };
const stake = (x) => x.value * (BASIS_W[x.basis] != null ? BASIS_W[x.basis] : 1);

/** Best guess at a lens when a finding has none set (the page lets you change it). */
function guessLens(f) {
  const a = String(f.area || '').toLowerCase(), t = String(f.title || '').toLowerCase();
  if (/opportunit|upsell|win-back/.test(t)) return 'opportunity';
  if (a === 'tools') return 'tool';
  if (/^no |missing|not defined|no agreed|nobody/.test(t) || a === 'data') return 'hole';
  if (a === 'revenue' || a === 'cost' || /leak|lost|churn|spend|cost/.test(t)) return 'leak';
  return 'weakness';
}
function signalLens(area) {
  if (/^Tools/.test(area)) return 'tool';
  if (/Cost|Finance|Customers|Price/.test(area)) return 'leak';
  if (/Competition/.test(area)) return 'opportunity';
  return 'weakness';
}

/** One flat list of items from every source. Findings with kind 'context' are background, not issues. */
function leakItems(e, { signals = true } = {}) {
  const recs = byId(e.recommendations);
  const items = [];
  e.findings.forEach((f) => {
    const kind = f.kind || guessLens(f); if (kind === 'context') return;
    items.push({ src: 'finding', pinned: !!f.pinned, id: f.id, kind, kindSet: !!f.kind, sev: f.severity || 'low', title: f.title || f.id, detail: f.evidence || '', area: f.area || '',
      value: num(f.valueMonthly), basis: f.basis || (num(f.valueMonthly) ? 'Leaking' : ''), partOf: f.partOf || '', fix: recs[f.fixId] || null, next: f.nextStep || '', rec: f });
  });
  e.opportunities.forEach((o) => {
    if (o.status === 'Recommendation' && !o.recommendationId) return;
    items.push({ src: 'opportunity', id: o.id, kind: 'opportunity', kindSet: true, sev: ({ High: 'high', Medium: 'medium', Low: 'low' })[o.impact] || 'low', title: o.title, detail: o.description || '', area: o.area || '',
      value: num(o.valueMonthly), basis: num(o.valueMonthly) ? 'Upside' : '', partOf: '', fix: recs[o.recommendationId] || null, next: o.nextStep || '', rec: o });
  });
  if (signals) insights(e, fmtMoney, ui.anon).filter((x) => x.severity !== 'low').forEach((x, i) => items.push({ src: 'signal', id: 'sig_' + i, kind: signalLens(x.area), kindSet: true, sev: x.severity, title: x.title, detail: x.detail, area: x.area, value: 0, basis: '', partOf: '', fix: null }));
  const ids = new Set(items.map((x) => x.id)); items.forEach((x) => { if (x.partOf && !ids.has(x.partOf)) x.partOf = ''; });
  return items;
}

/** Totals per basis, counting only top-level items so nested parts are never double counted. */
function leakTotals(items) {
  const t = {}; BASES.forEach((b) => { t[b] = 0; });
  items.filter((x) => !x.partOf && x.value > 0 && t[x.basis] != null).forEach((x) => { t[x.basis] += x.value; });
  return t;
}
function rankItems(items, sort) {
  const cmp = sort === 'severity' ? (a, b) => (SEV_W[b.sev] || 0) - (SEV_W[a.sev] || 0) || b.value - a.value
    : (a, b) => stake(b) - stake(a) || (SEV_W[b.sev] || 0) - (SEV_W[a.sev] || 0);
  const top = items.filter((x) => !x.partOf).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || cmp(a, b));
  const kids = (id) => items.filter((x) => x.partOf === id).sort(cmp);
  const out = []; top.forEach((x) => { out.push(x); kids(x.id).forEach((k) => out.push(Object.assign(k, { nested: true }))); });
  items.filter((x) => x.partOf && !out.includes(x)).forEach((x) => out.push(x));
  return out;
}

function leakFixChip(x) {
  if (x.fix) return `<span class="lo-fix" title="${esc(x.fix.title)}">→ ${esc(trunc(x.fix.title, 46))} <span class="chip">${esc(x.fix.status || 'Identified')}</span></span>`;
  if (x.next) return `<span class="lo-next" title="${esc(x.next)}">Next: ${esc(trunc(x.next, 52))}</span>`;
  if (x.src === 'signal') return '<span class="faint small">Spotted automatically</span>';
  return '<span class="chip lo-nofix">No action yet</span>';
}

function viewLeaks(e) {
  const L = ui.lo = Object.assign({ lens: 'all', sort: 'size', signals: true, noFix: false, open: '' }, ui.lo || {});
  const all = leakItems(e, { signals: L.signals });
  const tot = leakTotals(all);
  const count = (k) => all.filter((x) => x.kind === k).length;
  let list = all.filter((x) => L.lens === 'all' || x.kind === L.lens);
  if (L.noFix) list = list.filter((x) => !x.fix && !x.next && x.src !== 'signal');
  if (L.unsized) list = list.filter((x) => !x.value && x.src !== 'signal');
  const rankedAll = rankItems(list, L.sort);
  const tops = rankedAll.filter((x) => !x.nested); const keep = new Set(topN('home', tops).map((x) => x.id));
  const ranked = rankedAll.filter((x) => keep.has(x.nested ? x.partOf : x.id));
  const sv = savingsTracker(e);
  const noFix = all.filter((x) => !x.fix && !x.next && x.src !== 'signal').length, unsized = all.filter((x) => !x.value && x.src !== 'signal').length;
  const kp = (label, v, sub) => kpi(label, v ? fmtMoney(v) + '/mo' : '—', `<div class="k-delta">${sub}</div>`);
  const seg = (on, k, v, label) => `<button class="seg ${on ? 'on' : ''}" data-action="loSet" data-k="${k}" data-id="${v}">${label}</button>`;
  const recOpts = (cur) => `<option value="">— none —</option>${e.recommendations.map((r) => `<option value="${esc(r.id)}" ${cur === r.id ? 'selected' : ''}>${esc(trunc(r.title, 70))}</option>`).join('')}`;
  const parentOpts = (x) => `<option value="">— top level —</option>${all.filter((y) => y.src === 'finding' && y.id !== x.id && !y.partOf).map((y) => `<option value="${esc(y.id)}" ${x.partOf === y.id ? 'selected' : ''}>${esc(trunc(y.title, 70))}</option>`).join('')}`;
  const cell = (x, field, html) => (x.src === 'finding' ? html.replace('<select', `<select data-cell data-coll="findings" data-id="${esc(x.id)}" data-field="${field}"`) : '');
  const editor = (x) => x.src !== 'finding' ? (x.src === 'opportunity' ? '<p class="faint small">Edit this opportunity in Evidence → Market, or in Sources &amp; data.</p>' : '<p class="faint small">Spotted by combining data already in the Studio (crossing finance, people, tools, processes and interviews). Fix the cause, or add a finding if it matters.</p>') : `
      <div class="lo-edit">
        <label>Lens ${cell(x, 'kind', `<select>${LENSES.map(([k, n]) => `<option value="${k}" ${x.kind === k ? 'selected' : ''}>${n}</option>`).join('')}<option value="context">Background only (hide)</option></select>`)}</label>
        <label>Size per month <input type="number" data-cell data-type="num" data-coll="findings" data-id="${esc(x.id)}" data-field="valueMonthly" value="${x.value || ''}" placeholder="R / month"></label>
        <label>Basis ${cell(x, 'basis', `<select><option value=""></option>${BASES.map((b) => `<option ${x.basis === b ? 'selected' : ''}>${b}</option>`).join('')}</select>`)}</label>
        <label>Fix ${cell(x, 'fixId', `<select>${recOpts(x.fix && x.fix.id)}</select>`)}</label>
        <label>Part of ${cell(x, 'partOf', `<select>${parentOpts(x)}</select>`)}</label>
        <label class="lo-wide">Next step (question or data request) <input type="text" data-cell data-coll="findings" data-id="${esc(x.id)}" data-field="nextStep" value="${esc(x.next)}" placeholder="e.g. Ask Natalie: revenue by partner"></label>
      </div>`;
  const row = (x, i) => {
    const open = L.open === x.id;
    return `<div class="lo-row ${x.nested ? 'nested' : ''} ${open ? 'open' : ''}">
      <button class="lo-main" data-action="loOpen" data-id="${esc(x.id)}">
        <span class="lo-rank">${x.nested ? '↳' : i}</span>
        <span class="lo-lens lo-${x.kind}" title="${esc((LENSES.find((l) => l[0] === x.kind) || [])[1] || '')}">${LENS_ICON[x.kind] || ''}</span>
        <span class="lo-title">${x.pinned ? '<span class="chip pin-chip" title="Pinned above the money ranking because the client named it a priority">★ Founder priority</span> ' : ''}${sevChip(x.sev)} ${esc(x.title)}${x.src === 'signal' ? ' <span class="chip lo-auto">auto</span>' : ''}${x.kindSet ? '' : ' <span class="chip lo-auto" title="Lens guessed from the area. Open to set it.">lens?</span>'}</span>
        <span class="lo-val">${x.value ? `<b>${fmtMoney(x.value)}</b>/mo<em>${esc((x.basis || '').toLowerCase())}</em>` : '<span class="faint">Not sized</span>'}</span>
        <span class="lo-fixcol">${leakFixChip(x)}</span>
      </button>
      ${open ? `<div class="lo-detail"><p>${esc(x.detail)}</p>${x.rec && Array.isArray(x.rec.sources) && x.rec.sources.length ? `<div class="lo-srcs"><b class="small">Sources</b><ol>${x.rec.sources.map((r) => `<li class="small">${r.side === 'says' ? '<span class="chip">documents say</span> ' : r.side === 'seen' ? '<span class="chip">evidence</span> ' : ''}${esc(sourceLine(e, r, true))}</li>`).join('')}</ol></div>` : ''}<p class="faint small">${esc(x.area)}${x.partOf ? ` · part of: ${esc((all.find((y) => y.id === x.partOf) || {}).title || x.partOf)}` : ''}${x.fix ? ` · fix: ${esc(x.fix.title)} (${esc(x.fix.horizon || '')})` : ''}${x.next ? ` · next: ${esc(x.next)}` : ''}</p>${editor(x)}</div>` : ''}
    </div>`;
  };
  let n = 0;
  const byLens = LENSES.map(([k, name]) => ({ label: name, value: sum(all.filter((x) => x.kind === k && !x.partOf), (x) => x.value), tip: `${count(k)} items` }));
  return `<div class="page-h"><div><span class="eyebrow">${esc(e.client.name)}</span><h1>Leaks &amp; opportunities</h1><p class="muted">What's leaking, what it's worth, and what needs you today. Ranked by money at stake; each item says what fixes it.</p></div></div>
  <div class="kpis">${(() => { if (!e.client.nrr) return ''; const N = nrrData(e); const v = N && N.ttm.nrr != null ? Math.round(N.ttm.nrr) : num(e.client.nrr.value); if (!v) return ''; const tg = num(e.client.nrr.target) || 125; return kpi('NRR, last 12 months', v + '%', `<div class="k-delta ${v < tg ? 'delta-bad' : ''}">target ${tg}% · ${N ? keyLabel(N.first) + ' to ' + keyLabel(N.last) + ', estimate' : esc(e.client.nrr.note || '')}</div><button class="link small" data-action="tab" data-id="evidence" data-sub="growth">Open the growth view →</button>`); })()}${kp('Leaking now', tot['Leaking'], 'revenue or spend being lost')}${kp('At risk', tot['At risk'], 'could be lost')}${kp('Spend to review', tot['Spend to review'], 'cost base where savings sit')}${kp('Upside', tot['Upside'], 'revenue not yet taken')}${sv.target ? kpi('Savings approved', fmtMoney(sv.approved) + '/mo', `<div class="k-delta">of ${fmtMoney(sv.target)} target · ${fmtMoney(sv.identified)} identified (estimates)</div>`) : ''}</div>
  ${needsInput(e, all)}
  <section class="card">
    <div class="lo-bar">
      <span class="pv-switch sm">${seg(L.lens === 'all', 'lens', 'all', `All (${all.length})`)}${LENSES.map(([k, name]) => seg(L.lens === k, 'lens', k, `${LENS_ICON[k]} ${name} (${count(k)})`)).join('')}</span>
      <span class="pv-switch sm">${seg(L.sort === 'size', 'sort', 'size', 'Biggest first')}${seg(L.sort === 'severity', 'sort', 'severity', 'Most severe first')}</span>
      <label class="small"><input type="checkbox" data-action="loTick" data-k="signals" ${L.signals ? 'checked' : ''}> Include signals spotted automatically</label>
    </div>
    ${L.lens !== 'all' ? `<p class="small muted" style="margin:8px 0 0">${esc((LENSES.find((l) => l[0] === L.lens) || [])[2] || '')}</p>` : ''}
    <div class="lo-head"><span>#</span><span></span><span>What</span><span>At stake</span><span>Fix</span></div>
    <div class="lo-list">${ranked.length ? ranked.map((x) => row(x, x.nested ? 0 : ++n)).join('') : empty('Nothing here yet.')}</div>
    ${showAllBtn('home', tops.length)}
    ${L.noFix || L.unsized ? `<p class="small" style="margin:8px 0 0">Filtered: ${L.noFix ? 'no action yet' : 'not sized'}. <button class="link" data-action="loNeed" data-k="clear">Show everything</button></p>` : ''}
    <p class="faint small" style="margin:10px 0 0">Totals count each item once (parts nested under a bigger item are not added again). Sizes are estimates from the sources named in each item. “Biggest first” counts leaking in full, at risk and upside at half, spend to review at a fifth.</p>
  </section>
  ${card('Where the money is, by lens', hbars(byLens.filter((x) => x.value > 0), { fmt: (v) => fmtMoney(v) + '/mo', color: 'var(--s1)' }), { sub: 'Sized items only, all bases together. Use it to see where the weight sits, not as a single total.' })}`;
}

/* ---- nrr.js ---- */
/* ============================================================
   Client growth (NRR), version 1. Answers Daryl's question: are clients and resellers growing or shrinking, are we
   upselling, and where is the upsell potential? Built from what we hold today: the register's New & Lost movements,
   monthly revenue from the management accounts, the client register (services, adoption, contracts) and location
   counts. Version 2 replaces the estimates with billed revenue per account per month.
   ============================================================ */
const MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
/** "Mar 2025" or "Mar 25" -> 202503 (0 if unreadable). */
function monthKey(s) {
  const m = String(s || '').match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{2,4})/); if (!m) return 0;
  const i = MONS.indexOf(m[1][0].toUpperCase() + m[1].slice(1, 3).toLowerCase()); if (i < 0) return 0;
  return (m[2].length === 2 ? 2000 + +m[2] : +m[2]) * 100 + i + 1;
}
const keyLabel = (k) => `${MONS[(k % 100) - 1]} ${String(Math.floor(k / 100)).slice(2)}`;
const addMonths = (k, n) => { const t = Math.floor(k / 100) * 12 + (k % 100) - 1 + n; return Math.floor(t / 12) * 100 + (t % 12) + 1; };
const normName = (s) => String(s || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]+/g, '');
const pctNum = (s) => { const m = String(s || '').match(/(\d+(?:\.\d+)?)\s*%/); return m ? +m[1] : null; };
const hasSvc = (v) => v != null && String(v).trim() !== '' && !/^(no|false|-)$/i.test(String(v).trim()) && !/^ss$/i.test(String(v).trim());

function nrrData(e) {
  const fin = {}; (e.financePeriods || []).forEach((p) => { const k = monthKey(p.label); if (k && num(p.revenue)) fin[k] = num(p.revenue); });
  const finKeys = Object.keys(fin).map(Number).sort();
  let mv = (e.revenueMovements || []).map((m) => Object.assign({}, m, { k: monthKey(m.from), v: num(m.monthly) })).filter((m) => m.k && m.v);
  // A client that left and signed again is a downgrade (or growth), not churn plus new business.
  const byName = {}; mv.forEach((m) => { (byName[normName(m.client)] = byName[normName(m.client)] || []).push(m); });
  const rebooked = [];
  Object.values(byName).forEach((list) => {
    const lost = list.filter((m) => m.kind === 'lost'); const fresh = list.filter((m) => m.kind === 'new' && lost.some((l) => m.k >= l.k));
    if (!lost.length || !fresh.length) return;
    const l = lost[lost.length - 1]; const n = fresh[fresh.length - 1]; const d = n.v - l.v;
    mv = mv.filter((m) => m !== l && m !== n);
    if (d) mv.push(Object.assign({}, n, { k: l.k, from: l.from, fy: l.fy, kind: d < 0 ? 'downgrade' : 'growth', v: Math.abs(d), cause: d < 0 ? 'Left and re-signed for less' : 'Left and re-signed for more' }));
    rebooked.push({ name: n.client, was: l.v, now: n.v });
  });
  if (!finKeys.length || !mv.length) return null;
  const last = finKeys[finKeys.length - 1]; const first = addMonths(last, -11);
  const base = fin[addMonths(first, -1)] || fin[first];
  const inWin = (m) => m.k >= first && m.k <= last;
  const sumK = (list, kind) => sum(list.filter((m) => m.kind === kind), (m) => m.v);
  const win = mv.filter(inWin);
  const ttm = { growth: sumK(win, 'growth'), downgrade: sumK(win, 'downgrade'), lost: sumK(win, 'lost'), fresh: sumK(win, 'new') };
  ttm.net = ttm.growth - ttm.downgrade - ttm.lost;
  ttm.nrr = base ? (base + ttm.net) / base * 100 : null; ttm.grr = base ? (base - ttm.downgrade - ttm.lost) / base * 100 : null;
  // financial years (March to February), as the client reports them
  const fys = [...new Set(mv.map((m) => m.fy).filter(Boolean))].sort().map((fy) => {
    const list = mv.filter((m) => m.fy === fy); const y = +fy.slice(0, 4); const startK = y * 100 + 3;
    const b = fin[startK] || fin[addMonths(startK, -1)] || base; const lastK = Math.max(...list.map((m) => m.k));
    const r = { fy, growth: sumK(list, 'growth'), downgrade: sumK(list, 'downgrade'), lost: sumK(list, 'lost'), fresh: sumK(list, 'new'), base: b, to: lastK };
    r.net = r.growth - r.downgrade - r.lost; r.nrr = b ? (b + r.net) / b * 100 : null; r.partial = addMonths(startK, 11) > lastK; return r;
  });
  // month by month, from the first movement to the latest
  const k0 = Math.min(...mv.map((m) => m.k)); const k1 = Math.max(...mv.map((m) => m.k)); const months = [];
  for (let k = k0; k <= k1; k = addMonths(k, 1)) { const l = mv.filter((m) => m.k === k); months.push({ k, growth: sumK(l, 'growth'), down: sumK(l, 'downgrade') + sumK(l, 'lost'), fresh: sumK(l, 'new') }); }
  // segments: match movement names to the client register
  const reg = (e.topClients || []).map((c) => ({ c, n: normName(c.name) })).filter((x) => x.n.length > 2);
  const segOf = (name) => { const n = normName(name); const hit = reg.find((x) => x.n === n) || reg.find((x) => n.length > 4 && (x.n.includes(n) || n.includes(x.n))); if (hit) return /reseller|partner/i.test(hit.c.segment || '') ? 'Resellers and partners' : 'Managed clients'; return /\(/.test(name) ? 'Resellers and partners' : 'No longer in the register'; };
  const bySeg = {}; win.forEach((m) => { const s = segOf(m.client); const o = bySeg[s] = bySeg[s] || { growth: 0, down: 0, lost: 0, fresh: 0 }; if (m.kind === 'growth') o.growth += m.v; else if (m.kind === 'downgrade') o.down += m.v; else if (m.kind === 'lost') o.lost += m.v; else if (m.kind === 'new') o.fresh += m.v; });
  // accounts since the first movement, netted per account
  const acc = {}; mv.forEach((m) => { if (m.kind === 'new') return; const a = acc[m.client] = acc[m.client] || { name: m.client, net: 0, lost: false, causes: new Set(), last: 0 }; a.net += m.kind === 'growth' ? m.v : -m.v; if (m.kind === 'lost') a.lost = true; if (m.cause) a.causes.add(m.cause); a.last = Math.max(a.last, m.k); });
  const accounts = Object.values(acc);
  const grew = accounts.filter((a) => a.net > 0).sort((a, b) => b.net - a.net);
  const shrank = accounts.filter((a) => a.net < 0 && !a.lost).sort((a, b) => a.net - b.net);
  const lost = accounts.filter((a) => a.lost).sort((a, b) => a.net - b.net);
  // locations: direct vs resellers, latest month against 12 months earlier
  const lt = (e.client && e.client.locationTrend) || null; let loc = null;
  if (lt && lt.labels && lt.series) {
    const n = lt.labels.length; const j = n - 13; const ser = (re) => lt.series.find((s) => re.test(s.name));
    const pick = (s) => s && j >= 0 ? { now: s.values[n - 1], then: s.values[j], chg: (s.values[n - 1] - s.values[j]) / s.values[j] * 100 } : null;
    loc = { label: lt.labels[n - 1], from: j >= 0 ? lt.labels[j] : '', direct: pick(ser(/direct/i)), resell: pick(ser(/reseller/i)), all: pick(ser(/^all/i)) };
  }
  // upsell and shrink signals from the register (managed clients)
  const managed = (e.topClients || []).filter((c) => c.segment === 'Managed' && c.register);
  const svc = (c) => (c.register.services || {});
  const hasPx = (c) => Object.entries(svc(c)).some(([k, v]) => /percepxion/i.test(k) && hasSvc(v));
  const core = ['Boost', 'Reviews', 'Q&A', 'Posts', 'Store Locator'];
  const missing = (c) => core.filter((k) => !hasSvc(svc(c)[k]) || /^ss$/i.test(String(svc(c)[k] || '').trim()));
  const adopt = (c) => pctNum(c.register.adoptionRate);
  const upsold = managed.filter((c) => /true/i.test(String(c.register.upsell2526)));
  const upsVals = upsold.map((c) => num(c.register.upsellValueMonthly)).filter((v) => v > 0).sort((a, b) => a - b);
  const medianUps = upsVals.length ? upsVals[Math.floor(upsVals.length / 2)] : 0;
  const riskScore = (c) => (c.churnRisk === 'High' ? 3 : c.churnRisk === 'Medium' ? 1 : 0) + (num(c.satisfaction) && num(c.satisfaction) <= 6 ? 2 : 0) + ((adopt(c) ?? 100) <= 38 ? 1 : 0);
  const atRisk = managed.filter((c) => /90 days|Out of contract|Month to month/i.test(c.contractStatus || '') && riskScore(c) > 0)
    .sort((x, y) => riskScore(y) - riskScore(x));
  const riskSet = new Set(atRisk);
  const cand = managed.filter((c) => (adopt(c) || 0) >= 63 && !hasPx(c) && c.churnRisk !== 'High' && !riskSet.has(c))
    .map((c) => ({ c, a: adopt(c), miss: missing(c) })).sort((x, y) => (y.a - x.a) || (num(y.c.satisfaction) - num(x.c.satisfaction)));
  return { rebooked, base, first, last, ttm, fys, months, bySeg, grew, shrank, lost, loc, managed, upsold, medianUps, cand, atRisk, pxCount: managed.filter(hasPx).length,
    target: num((e.client.nrr || {}).target) || 125 };
}

/** Month-by-month bars: expansion above the line, contraction and churn below, new business as a thin bar. */
function nrrMonthChart(months) {
  const W = 760, H = 252, pad = 34, mid = 118; const bw = (W - pad * 2) / months.length;
  const mx = Math.max(1, ...months.map((m) => Math.max(m.growth, m.down)));
  const sc = (v) => v / mx * (mid - 22);
  const bars = months.map((m, i) => { const x = pad + i * bw; const net = m.growth - m.down;
    return `<g><title>${keyLabel(m.k)}: expansion ${fmtMoney(m.growth)}, contraction and churn ${fmtMoney(m.down)}, net ${fmtMoney(net)}${m.fresh ? ', new business ' + fmtMoney(m.fresh) + ' (not in NRR)' : ''}</title>
      ${m.growth ? `<rect x="${x + 3}" y="${mid - sc(m.growth)}" width="${bw - 6}" height="${sc(m.growth)}" rx="2" fill="var(--nrr-up)"/>` : ''}
      ${m.down ? `<rect x="${x + 3}" y="${mid}" width="${bw - 6}" height="${sc(m.down)}" rx="2" fill="var(--nrr-down)"/>` : ''}
      ${net ? `<circle cx="${x + bw / 2}" cy="${mid - sc(net)}" r="3.2" fill="var(--nrr-ink)"/>` : ''}
      ${i % 2 === 0 || months.length <= 12 ? `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" class="nrr-ax">${keyLabel(m.k)}</text>` : ''}</g>`; }).join('');
  return `<svg class="nrr-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Expansion versus contraction and churn by month">
    <line x1="${pad}" x2="${W - pad}" y1="${mid}" y2="${mid}" class="nrr-zero"/>
    <text x="${pad}" y="12" class="nrr-ax">+${fmtShort(mx)}</text><text x="${pad}" y="${mid * 2 - 16}" class="nrr-ax">−${fmtShort(mx)}</text>${bars}</svg>
    <div class="nrr-key"><span><i style="background:var(--nrr-up)"></i>Expansion (upsells, price, more locations)</span><span><i style="background:var(--nrr-down)"></i>Contraction and churn</span><span><i class="dot"></i>Net for the month</span></div>`;
}

/** The view. forClient: no internal notes, worded for the founder. */
function nrrView(e, { forClient = false } = {}) {
  const D = nrrData(e);
  if (!D) return `<p class="empty">No revenue movements or monthly revenue yet. Merge the client register's New &amp; Lost tabs and the management accounts first.</p>`;
  const R = (v) => fmtMoney(Math.round(v)); const P = (v) => v == null ? '—' : Math.round(v) + '%';
  const sign = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + fmtMoney(Math.abs(Math.round(v)));
  const t = D.ttm; const win = `${keyLabel(D.first)} to ${keyLabel(D.last)}`;
  const tile = (label, value, sub, cls = '') => `<div class="nrr-tile ${cls}"><div class="nrr-tl">${label}</div><div class="nrr-tv">${value}</div><div class="nrr-ts">${sub}</div></div>`;
  const accRow = (a) => `<tr><td>${esc(a.name)}</td><td class="r ${a.net < 0 ? 'nrr-neg' : 'nrr-pos'}">${sign(a.net)}/mo</td><td class="small">${esc([...a.causes].join(', '))}</td><td class="small">${keyLabel(a.last)}</td></tr>`;
  const accTable = (title, list, n = 8) => list.length ? `<div><h4>${title} <span class="faint small">(${list.length})</span></h4><table class="nrr-t"><thead><tr><th>Account</th><th class="r">Change</th><th>Why</th><th>When</th></tr></thead><tbody>${list.slice(0, n).map(accRow).join('')}</tbody></table>${list.length > n ? `<p class="faint small">and ${list.length - n} more</p>` : ''}</div>` : '';
  const segRows = Object.entries(D.bySeg).map(([s, o]) => `<tr><td>${esc(s)}</td><td class="r nrr-pos">${sign(o.growth)}</td><td class="r nrr-neg">${sign(-o.down)}</td><td class="r nrr-neg">${sign(-o.lost)}</td><td class="r"><b>${sign(o.growth - o.down - o.lost)}</b></td><td class="r faint">${o.fresh ? sign(o.fresh) : '—'}</td></tr>`).join('');
  const L = D.loc; const locLine = (lab, x) => x ? `<tr><td>${lab}</td><td class="r">${Math.round(x.then).toLocaleString('en-GB')}</td><td class="r">${Math.round(x.now).toLocaleString('en-GB')}</td><td class="r ${x.chg < 0 ? 'nrr-neg' : 'nrr-pos'}">${x.chg > 0 ? '+' : ''}${x.chg.toFixed(0)}%</td></tr>` : '';
  const potential = D.cand.length * D.medianUps;
  const candRows = D.cand.slice(0, 10).map((x) => `<tr><td>${esc(x.c.name)}</td><td class="r">${x.a}%</td><td class="small">${esc(x.miss.length ? x.miss.join(', ') : 'all core services')} · no PercepXion</td><td class="small">${esc(x.c.contractStatus || '')}</td></tr>`).join('');
  const riskRows = D.atRisk.slice(0, 10).map((c) => `<tr><td>${esc(c.name)}</td><td class="small">${esc(c.contractStatus || '')}</td><td class="small">${esc([c.churnRisk ? 'risk ' + c.churnRisk.toLowerCase() : '', c.satisfaction ? 'satisfaction ' + c.satisfaction : '', c.register.adoptionRate ? 'adoption ' + c.register.adoptionRate : ''].filter(Boolean).join(' · '))}</td></tr>`).join('');
  const fyRows = D.fys.map((f) => `<tr><td>${esc(f.fy)}${f.partial ? ` <span class="faint small">(to ${keyLabel(f.to)})</span>` : ''}</td><td class="r nrr-pos">${sign(f.growth)}</td><td class="r nrr-neg">${sign(-f.downgrade)}</td><td class="r nrr-neg">${sign(-f.lost)}</td><td class="r"><b>${sign(f.net)}</b></td><td class="r"><b>${P(f.nrr)}</b>${f.partial ? '<span class="faint small"> so far</span>' : ''}</td><td class="r faint">${sign(f.fresh)}</td></tr>`).join('');
  const gap = D.base * (D.target - 100) / 100 - t.net;
  return `<div class="nrr">
  <div class="nrr-tiles">
    ${tile('Net revenue retention, last 12 months', P(t.nrr), `${win} · target ${D.target}% · estimate`, t.nrr != null && t.nrr < D.target ? 'nrr-bad' : '')}
    ${tile('Gross revenue retention', P(t.grr), 'kept before any expansion')}
    ${tile('Expansion', sign(t.growth) + '/mo', 'upsells, price rises, more locations')}
    ${tile('Contraction and churn', sign(-(t.downgrade + t.lost)) + '/mo', `downgrades ${R(t.downgrade)} · lost ${R(t.lost)}`, 'nrr-bad')}
    ${tile('New business', sign(t.fresh) + '/mo', 'not part of NRR')}
  </div>
  <p class="nrr-lead"><b>What it says:</b> over the last 12 months existing clients ${t.net >= 0 ? 'grew' : 'shrank'} by ${R(Math.abs(t.net))} a month net, on a base of about ${R(D.base)} a month: NRR of about ${P(t.nrr)} against the ${D.target}% objective. Reaching ${D.target}% over a year needs about ${R(D.base * (D.target - 100) / 100)} a month of net growth from existing clients, ${R(gap)} a month more than the last 12 months delivered.${L && L.resell && L.direct ? ` Locations tell the same story by channel: direct locations ${L.direct.chg >= 0 ? 'up' : 'down'} ${Math.abs(L.direct.chg).toFixed(0)}% and reseller locations ${L.resell.chg >= 0 ? 'up' : 'down'} ${Math.abs(L.resell.chg).toFixed(0)}% in a year.` : ''}</p>
  <h3>Month by month</h3>${nrrMonthChart(D.months)}
  <h3>By year</h3><table class="nrr-t"><thead><tr><th>Financial year</th><th class="r">Expansion</th><th class="r">Downgrades</th><th class="r">Lost</th><th class="r">Net</th><th class="r">NRR</th><th class="r">New (not in NRR)</th></tr></thead><tbody>${fyRows}</tbody></table>
  <div class="nrr-2">
    <div><h3>Clients versus resellers, last 12 months</h3><table class="nrr-t"><thead><tr><th></th><th class="r">Expansion</th><th class="r">Downgrades</th><th class="r">Lost</th><th class="r">Net</th><th class="r">New</th></tr></thead><tbody>${segRows}</tbody></table>
      <p class="faint small">Matched by name to the client register. Lost clients no longer appear in it, so some losses can't be placed.${D.bySeg['Resellers and partners'] ? '' : ' The New &amp; Lost tabs record no reseller changes, so resellers show only in the location counts.'}</p></div>
    ${L ? `<div><h3>Locations by channel</h3><table class="nrr-t"><thead><tr><th></th><th class="r">${esc(L.from)}</th><th class="r">${esc(L.label)}</th><th class="r">Change</th></tr></thead><tbody>${locLine('Direct clients', L.direct)}${locLine('Resellers and partners', L.resell)}${locLine('All', L.all)}</tbody></table>
      <p class="faint small">Resellers are mostly billed per location, so this is the best view of reseller growth until billing per partner arrives.</p></div>` : ''}
  </div>
  <h3>Who is growing, shrinking or leaving</h3>
  <div class="nrr-3">${accTable('Growing', D.grew)}${accTable('Shrinking', D.shrank)}${accTable('Lost', D.lost)}</div>
  <h3>Where the next growth can come from</h3>
  <div class="nrr-2">
    <div><h4>Upsell candidates <span class="faint small">(${D.cand.length})</span></h4>
      <p class="small">Managed clients using at least 63% of what they bought, without PercepXion, and not on the shrink-risk list. ${D.pxCount} managed clients already have PercepXion; ${D.upsold.length} were upsold in 2025/26${D.medianUps ? ` (typical upsell ${R(D.medianUps)}/month)` : ''}.${potential ? ` <b>If every candidate took a typical upsell: about ${R(potential)}/month</b> (an upper bound, not a forecast).` : ''}</p>
      <table class="nrr-t"><thead><tr><th>Client</th><th class="r">Adoption</th><th>Not taken yet</th><th>Contract</th></tr></thead><tbody>${candRows}</tbody></table>${D.cand.length > 10 ? `<p class="faint small">and ${D.cand.length - 10} more</p>` : ''}</div>
    <div><h4>Shrink risk at renewal <span class="faint small">(${D.atRisk.length})</span></h4>
      <p class="small">Managed clients renewing within 90 days, out of contract or month to month, with a warning sign: high or medium churn risk, satisfaction of 6 or below, or low adoption.</p>
      <table class="nrr-t"><thead><tr><th>Client</th><th>Contract</th><th>Warning signs</th></tr></thead><tbody>${riskRows}</tbody></table>${D.atRisk.length > 10 ? `<p class="faint small">and ${D.atRisk.length - 10} more</p>` : ''}</div>
  </div>
  <div class="nrr-note"><b>How far to trust this (version 1).</b> NRR here is an estimate: changes come from the register's New &amp; Lost tabs, which don't yet tie to billing (some rows show R0 for active clients), and the base is total monthly revenue from the management accounts, which includes some non-recurring income. Accounts with no recorded change are not shown.${D.rebooked.length ? ` A client that left and re-signed counts as a downgrade or growth, not as churn plus new business (${esc(D.rebooked.map((r) => r.name).join(', '))}).` : ''} Upsell candidates come from the register's adoption and services columns; values are indicative.
  <b>Version 2</b> uses billed revenue per client and per reseller each month, so every account shows as growing, flat or shrinking, NRR is exact, and resellers are measured by revenue, not locations.${forClient ? '' : ' Needs: the billing export (request to finance) and Pipedrive access for the upsell pipeline.'}</div>
</div>`;
}

function viewNRR(e) {
  return `<div class="page-h"><div><span class="eyebrow">Evidence · Client growth</span><h1>Are clients and resellers growing or shrinking?</h1><p class="muted">Company objective 1: NRR ${esc((e.client.nrr || {}).target || 125)}%. Version 1, built from the data we hold today. To send it to Daryl: Progress &amp; reports → Reports → Client growth (NRR).</p></div>
    <div class="btn-row"><button class="btn" data-action="nrrReport">Open as a report →</button></div></div>

/* ---- pages.js ---- */
/* ============================================================
   The seven pages. Each answers one question for TGM:
   Home (what's leaking and what needs me), Plan (what we suggest and what it saves), Processes (where work breaks),
   Evidence (what proves it), Conversations (who we ask what next), Progress & reports (are we on track),
   Sources & data (where every number comes from). Older page ids still work: they redirect here.
   ============================================================ */
const TAB_ALIAS = {
  overview: ['home'], leaks: ['home'], crossover: ['home'],
  recs: ['plan'], scenarios: ['plan'],
  finance: ['evidence', 'money'], business: ['evidence', 'clients'], org: ['evidence', 'people'], tools: ['evidence', 'tools'], competitors: ['evidence', 'market'],
  interviews: ['talk', 'interviews'], discovery: ['talk', 'discovery'],
  report: ['progress', 'report']
};
const SUBTABS = {
  evidence: [['growth', 'Client growth (NRR)'], ['money', 'Money'], ['clients', 'Clients'], ['people', 'People'], ['tools', 'Tools'], ['market', 'Market']],
  talk: [['people', 'By person'], ['interviews', 'Interviews'], ['discovery', 'Discovery']],
  progress: [['progress', 'Progress & time'], ['report', 'Reports']]
};
/** Pages where "View as" (current state or a scenario) changes what is shown. */
const SCENARIO_TABS = ['plan', 'evidence', 'processes'];

function normaliseTab() {
  ui.sub = ui.sub || {};
  const a = TAB_ALIAS[ui.tab];
  if (a) { ui.tab = a[0]; if (a[1]) ui.sub[a[0]] = a[1]; }
  if (!TABS.some((t) => t[0] === ui.tab)) ui.tab = 'home';
  Object.keys(SUBTABS).forEach((t) => { if (!SUBTABS[t].some((s) => s[0] === ui.sub[t])) ui.sub[t] = SUBTABS[t][0][0]; });
}
const subOf = (t) => (ui.sub || {})[t] || SUBTABS[t][0][0];
function subBar(t) {
  return `<nav class="subnav">${SUBTABS[t].map(([id, n]) => `<button class="sub-btn ${subOf(t) === id ? 'on' : ''}" data-action="sub" data-tab="${t}" data-id="${id}">${n}</button>`).join('')}</nav>`;
}

/* ---------- "Top 5, then Show all" for long lists ---------- */
const TOP_N = 5;
function topN(key, list, n = TOP_N) { ui.all = ui.all || {}; return ui.all[key] ? list : list.slice(0, n); }
function showAllBtn(key, total, n = TOP_N) {
  if (total <= n) return '';
  const on = (ui.all || {})[key];
  return `<div class="show-all"><button class="link" data-action="showAll" data-id="${esc(key)}">${on ? 'Show the top ' + n + ' only' : `Show all ${total}`}</button></div>`;
}

/* ---------- Home: needs your input ---------- */
function needsInput(e, all) {
  const g = e.engagement || {}; const today = todayISO();
  const st = (g.phases || []).length ? engagementStatus(e) : null;
  const overdue = st ? st.overdue : [];
  const noFix = all.filter((x) => !x.fix && !x.next && x.src !== 'signal').length;
  const unsized = all.filter((x) => !x.value && x.src !== 'signal').length;
  const stale = (g.activities || []).filter((a) => a.status !== 'Done' && a.due && a.due < today && !(ui.share && a.private));
  const L = ui.lo || {};
  const chip = (n, label, attrs, tip, on) => n ? `<button class="need ${on ? 'on' : ''}" ${attrs} title="${esc(tip)}"><b>${n}</b> ${label}</button>` : '';
  const chips = [
    chip(overdue.length, `overdue from the client`, 'data-action="tab" data-id="progress"', overdue.slice(0, 4).map((r) => r.item).join(' · ')),
    chip(noFix, 'with no action yet', 'data-action="loNeed" data-k="noFix"', 'Each needs a recommendation, a question for a named role, or a data request. Click to filter the list.', L.noFix),
    chip(unsized, 'not sized', 'data-action="loNeed" data-k="unsized"', 'Add a rand figure, even a rough one, so they can be ranked. Click to filter the list.', L.unsized),
    chip(stale.length, 'to-dos past their date', 'data-action="tab" data-id="progress"', stale.slice(0, 4).map((a) => a.title).join(' · '))
  ].filter(Boolean);
  return `<div class="needs"><span class="needs-h">Needs your input</span>${chips.length ? chips.join('') : '<span class="faint small">Nothing right now.</span>'}</div>`;
}

/* ---------- Plan: recommendations by stage, the savings tracker, scenarios ---------- */
function viewPlan(e) {
  const sv = savingsTracker(e); const rows = scoreRecommendations(e);
  const stageOf = (r) => (REC_STAGES.includes(r.rec.status) ? r.rec.status : 'Identified');
  const groups = [['Identified', 'Identified: our suggestions, for the client to decide'], ['Approved', 'Approved by the client'], ['In progress', 'In progress'], ['Realised', 'Realised: saving or gain confirmed']];
  const head = '<thead><tr><th>#</th><th>Recommendation</th><th>Score</th><th class="r">Value / yr</th><th class="r">Hours freed / mo</th><th class="r">One-off</th><th class="r">Payback</th><th>Stage</th></tr></thead>';
  const row = (r, i) => `<tr class="${r.rec.status === 'Rejected' ? 'row-removed' : ''}"><td>${i + 1}</td><td>${r.rec.pinned ? '<span class="chip pin-chip">★ Founder priority</span> ' : ''}<strong>${esc(r.rec.title)}</strong> <span class="chip">${esc(r.rec.type || '—')}</span> <span class="chip">${esc(r.rec.horizon || '—')}</span>
      <div class="muted small">${esc(trunc(r.rec.description || '', 260))}</div>
      <div class="small plan-stick">${r.rec.stick ? `<b>How it sticks:</b> ${esc(r.rec.stick)}` : '<span class="chip lo-nofix">How it sticks: not set</span> <span class="faint">system, ease, visibility, incentive, owner</span>'}${r.rec.owner ? ` · <b>Owner:</b> ${esc(r.rec.owner)}` : ''}</div></td>
    <td><div class="score-bar"><span style="width:${r.score}%"></span></div><span class="small">${r.score}</span></td>
    <td class="r">${fmtMoney(r.cash + r.revenue)}</td><td class="r">${Math.round(r.hoursSaved)}</td><td class="r">${fmtMoney(r.oneOff)}</td><td class="r">${r.payback == null ? '—' : r.payback.toFixed(1) + ' mo'}</td>
    <td><select data-cell data-coll="recommendations" data-id="${r.rec.id}" data-field="status">${REC_STAGES.map((s) => `<option ${r.rec.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`;
  const block = ([stage, title]) => {
    const list = rows.filter((r) => stageOf(r) === stage).sort((a, b) => (b.rec.pinned ? 1 : 0) - (a.rec.pinned ? 1 : 0)); if (!list.length) return '';
    const key = 'plan_' + stage;
    return card(`${title} (${list.length})`, `<table class="tbl recs">${head}<tbody>${topN(key, list).map(row).join('')}</tbody></table>${showAllBtn(key, list.length)}`, { cls: 'scroll-x' });
  };
  const rejected = rows.filter((r) => r.rec.status === 'Rejected');
  const impacts = e.scenarios.map((s) => ({ s, i: scenarioImpact(e, s.id) }));
  const scenTable = impacts.length ? `<table class="tbl"><thead><tr><th>Scenario</th><th class="r">Headcount Δ</th><th class="r">Cash saving / yr</th><th class="r">Revenue uplift</th><th class="r">Hours freed / mo</th><th class="r">One-off</th><th class="r">Payback</th><th></th></tr></thead><tbody>
    ${impacts.map(({ s, i }) => `<tr><td><strong>${esc(s.name)}</strong><div class="muted small">${esc(s.description || '')}</div></td><td class="r">${i.headcountDelta}</td><td class="r">${fmtMoney(i.cashSaving)}</td><td class="r">${fmtMoney(i.revenueUplift)}</td><td class="r">${hrs(i.hoursSaved)}</td><td class="r">${fmtMoney(i.oneOff)}</td><td class="r">${i.paybackMonths == null ? '—' : i.paybackMonths.toFixed(1) + ' mo'}</td><td><button class="btn sm" data-action="setScenario" data-id="${s.id}">View</button></td></tr>`).join('')}</tbody></table>` : empty('No scenarios yet.');
  const builder = e.scenarios.length ? `<table class="tbl"><thead><tr><th>Recommendation</th>${e.scenarios.map((s) => `<th class="c"><input class="inline" data-cell data-coll="scenarios" data-id="${s.id}" data-field="name" value="${esc(s.name)}"></th>`).join('')}</tr></thead><tbody>
    ${rows.map((r) => `<tr><td>${esc(r.rec.title)} <span class="faint small">(score ${r.score})</span></td>${e.scenarios.map((s) => `<td class="c"><input type="checkbox" data-action="toggleRecInScenario" data-scenario="${s.id}" data-rec="${r.rec.id}" ${splitList(s.recommendationIds).includes(r.rec.id) ? 'checked' : ''}></td>`).join('')}</tr>`).join('')}
    <tr><td></td>${e.scenarios.map((s) => `<td class="c"><button class="btn sm ghost" data-action="delScenario" data-id="${s.id}" title="Delete scenario">✕</button></td>`).join('')}</tr></tbody></table>` : '';
  return `${scenarioBanner(e)}<div class="page-h"><div><span class="eyebrow">Plan</span><h1>What we suggest, and what it saves</h1><p class="muted">Recommendations are suggestions for the client to decide, ordered from identified to realised. Each says how it will stick. Only approved and realised savings count towards the target.</p></div>
    <div class="btn-row"><button class="btn" data-action="addRec">+ Add recommendation</button></div></div>
  ${sv.target ? card('Savings against the target', savingsBlock(sv, { rows: false }), { sub: 'Monthly recurring savings, net of new recurring costs. Stage comes from each recommendation.' }) : ''}
  ${groups.map(block).join('')}
  ${rejected.length ? `<details class="card"><summary class="small"><b>Rejected (${rejected.length})</b></summary><table class="tbl recs">${head}<tbody>${rejected.map(row).join('')}</tbody></table></details>` : ''}
  ${card('Scenarios: bundles of recommendations', `<div class="scroll-x">${scenTable}</div>
    <details class="small"><summary><b>Build or edit scenarios</b></summary><div class="btn-row"><button class="btn sm" data-action="addScenario">+ Add scenario</button></div><div class="scroll-x">${builder}</div></details>`,
    { sub: 'A scenario is the current state with a set of recommendations applied. "View" switches Processes and Evidence to it.' })}
  <p class="muted small">Score = 50% value, 20% low effort, 15% low risk, 15% confidence. Value = cash saving + revenue uplift + half the value of freed hours (freed hours are capacity, not cash, unless headcount changes). Edit details, "how it sticks", owner and modelled changes in Sources &amp; data → Recommendations.</p>`;
}

/* ---------- Evidence: the detail behind findings ---------- */
function viewEvidence(e) {
  const s = subOf('evidence');
  const body = s === 'growth' ? viewNRR(e) : s === 'money' ? viewFinance(e) : s === 'clients' ? viewBusiness(e) : s === 'people' ? viewOrg(e) + peopleCrossCards(e) : s === 'tools' ? viewTools(e) : viewCompetitors(e) + profileCard(e);
  return subBar('evidence') + body;
}

/** Department scorecard and who carries which process (formerly on the Crossover page). */
function peopleCrossCards(e) {
  const st = stateFor(e, ui.scenario);
  const sc = departmentScorecard(e, st);
  const people = live(st.people).filter((p) => personLoad(st)[p.id]);
  const procs = live(st.processes);
  const matrix = people.map((p) => procs.map((pr) => sum(live(pr.steps).filter((x) => x.actorId === p.id && !x.automated), (x) => stepHours(x, pr))));
  const maxPay = Math.max(1, ...sc.map((d) => d.payroll + d.toolSpend));
  return `${card('Department scorecard', sc.length ? `<table class="tbl"><thead><tr><th>Department</th><th class="r">People</th><th>People + tool cost / yr</th><th class="r">Processes</th><th class="r">Process hrs/mo</th><th class="r">Manual</th><th class="r">Pain points raised</th></tr></thead><tbody>
    ${sc.map((d) => `<tr><td><i class="swatch" style="background:${deptColor(e.departments, d.dept.id)}"></i>${esc(d.dept.name)}</td><td class="r">${d.headcount}</td><td><div class="inline-bar"><span style="width:${(d.payroll + d.toolSpend) / maxPay * 100}%"></span></div>${fmtMoney(d.payroll + d.toolSpend)}</td><td class="r">${d.processes}</td><td class="r">${Math.round(d.hours)}</td><td class="r">${d.hours ? pct(d.manualPct) : '—'}</td><td class="r">${d.pain}</td></tr>`).join('')}</tbody></table>` : empty('Add departments.'), { cls: 'scroll-x', sub: 'Crosses people, tools, processes and interview pain points for each department.' })}
  ${people.length && procs.length ? card('Who carries which process (hours / month)', heatmap(people.map((p) => ui.anon ? p.title : p.name), procs.map((p) => p.name), matrix, { fmt: (v) => Math.round(v) }), { cls: 'scroll-x', sub: 'Darker means more hours. Look for one person carrying a whole process, or senior people doing manual work.' }) : ''}`;
}

/* ---------- Conversations ---------- */
/** An answer that starts with "Partly" records what is known so far; the question stays open until it is fully answered. */
const isPartly = (v) => /^\s*partly\b/i.test(String(v || ''));
/** Every recorded answer, by question id, from every interview (an answer can come from someone other than the person the question was set for). */
function answerIndex(e, skipId) {
  const ix = {};
  e.interviews.forEach((iv) => { if (skipId && iv.id === skipId) return; Object.entries(iv.answers || {}).forEach(([k, v]) => { if (String(v || '').trim()) (ix[k] = ix[k] || []).push({ v: String(v), date: iv.date, pid: iv.personId, partly: isPartly(v) }); }); });
  return ix;
}
function viewTalk(e) {
  if (ui.capture || ui.session) return viewDiscovery(e);
  const s = subOf('talk');
  return subBar('talk') + (s === 'interviews' ? viewInterviews(e) : s === 'discovery' ? viewDiscovery(e) : talkPeople(e));
}
/** Does a request owner (free text such as "Gabby / Genevieve" or "Head of Client Operations") name this person? */
function ownerMatches(owner, p) {
  const o = String(owner || '').toLowerCase(); if (!o) return false;
  const tokens = o.split(/[^a-z]+/).filter(Boolean);
  const name = String(p.name || '').toLowerCase(); const first = name.split(/[\s(]+/)[0];
  const nick = (name.match(/\(([^)]+)\)/) || [])[1];
  const title = String(p.title || '').toLowerCase();
  const acro = String(p.title || '').split(/\s+/).filter((w) => /^[A-Z]/.test(w)).map((w) => w[0]).join('').toLowerCase();
  return (first && tokens.includes(first)) || (nick && tokens.includes(nick)) || (title.length > 6 && o.includes(title)) || (acro.length >= 2 && tokens.includes(acro));
}
function talkPeople(e) {
  const pById = byId(e.people); const qs = e.customQuestions || [];
  const nm = (p) => (ui.anon ? p.title || 'Role' : p.name);
  const AX = answerIndex(e);
  const ansOf = (q) => { let list = AX[q.id] || []; if (ui.share) list = list.filter((a) => a.pid === q.personId); return list.length ? { list, done: list.some((a) => !a.partly) } : null; };
  const isDone = (q) => !!(ansOf(q) || {}).done;
  const ids = [...new Set([...qs.map((q) => q.personId), ...e.interviews.map((i) => i.personId)])].filter((id) => pById[id]);
  const stats = ids.map((id) => { const mine = qs.filter((q) => q.personId === id); const open = mine.filter((q) => !isDone(q));
    return { p: pById[id], n: mine.length, open: open.length, partly: open.filter((q) => ansOf(q)).length, star: open.filter((q) => q.p).length, ivs: e.interviews.filter((i) => i.personId === id).length }; })
    .sort((a, b) => b.star - a.star || b.open - a.open || (a.p.name || '').localeCompare(b.p.name || ''));
  if (!stats.length) return `<div class="page-h"><div><span class="eyebrow">Conversations</span><h1>Who we ask what next</h1></div></div>${empty('No questions or interviews yet. Prepare questions with Claude (customQuestions) or capture an interview.')}`;
  const sel = stats.some((x) => x.p.id === ui.talkP) ? ui.talkP : stats[0].p.id; const p = pById[sel];
  const mine = qs.filter((q) => q.personId === sel).map((q, i) => [q, i]).sort((a, b) => ((a[0].ord ?? 1e6 + a[1]) - (b[0].ord ?? 1e6 + b[1]))).map((x) => x[0]);
  const shown = ui.talkOpen ? mine.filter((q) => !isDone(q)) : mine;
  let sec = '';
  const qList = shown.map((q) => { const h = q.section && q.section !== sec ? `<h5>${esc((sec = q.section))}</h5>` : ''; const a = ansOf(q);
    return `${h}<div class="tq ${a ? (a.done ? 'tq-done' : 'tq-part') : ''}"><div>${q.p ? '<b class="star">★</b> ' : ''}${esc(q.q)} <span class="chip">${esc((CRITERIA.find((c) => c.id === q.crit) || {}).label || q.crit || "")}</span>${q.qWas ? ` <span class="faint small" title="Originally: ${esc(q.qWas)}">· narrowed to what's still missing</span>` : ''}</div>${q.note ? `<div class="faint small">${esc(q.note)}</div>` : ''}${a ? a.list.map((x) => `<div class="${x.partly ? 'tq-p' : 'tq-a'} small"><b>${x.partly ? 'Partly answered' : 'Answered'}${x.pid !== q.personId && pById[x.pid] ? ' by ' + esc(ui.anon ? pById[x.pid].title || 'another person' : pById[x.pid].name + (pById[x.pid].title ? ' (' + pById[x.pid].title + ')' : '')) : ''}${x.date ? ' · ' + esc(fmtD(x.date)) : ''}:</b> ${esc(trunc(x.v.replace(/^\s*partly\b[:\s-]*/i, ''), 600))}</div>`).join('') : ''}</div>`; }).join('');
  const reqs = ((e.engagement || {}).requests || []).filter((r) => !r.receivedDate && ownerMatches(r.owner, p));
  const ivs = e.interviews.filter((i) => i.personId === sel).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const st = stats.find((x) => x.p.id === sel);
  return `<div class="page-h"><div><span class="eyebrow">Conversations</span><h1>Who we ask what next</h1><p class="muted">Pick a person: what to ask them (★ first), what they have already answered, and what they owe us.</p></div></div>
  <div class="talk">
    <aside class="card talk-list">${stats.map((x) => `<button class="talk-p ${x.p.id === sel ? 'on' : ''}" data-action="talkP" data-id="${esc(x.p.id)}"><b>${esc(nm(x.p))}</b><span class="faint small">${ui.anon ? '' : esc(x.p.title || '')}</span><span class="small">${x.open ? `${x.open} to ask${x.star ? ` · <b class="star">★</b> ${x.star}` : ''}` : '<span class="faint">all answered</span>'}${x.ivs ? ` · ${x.ivs} interview${x.ivs > 1 ? 's' : ''}` : ''}</span></button>`).join('')}</aside>
    <div>
      ${card(`${esc(nm(p))}${!ui.anon && p.title ? ` <span class="faint small">· ${esc(p.title)}</span>` : ''}`, `
        <div class="btn-row"><button class="btn" data-action="startCapture" data-id="${esc(sel)}">▶ Start interview</button>${ivs.map((iv) => `<button class="btn sm ghost" data-action="editInterview" data-id="${esc(iv.id)}">Open interview ${esc(fmtD(iv.date) || '')}</button>`).join('')}
          <label class="small tog"><input type="checkbox" data-ui="talkOpen" ${ui.talkOpen ? 'checked' : ''}> Still to ask only</label></div>
        <p class="small muted">${st.n} questions · ${st.n - st.open} answered · ${st.open} to ask${st.star ? ` (${st.star} starred)` : ''}${st.partly ? ` · ${st.partly} of those partly answered` : ''}</p>
        ${reqs.length ? `<div class="talk-reqs"><b class="small">Waiting on them (${reqs.length})</b><ul>${reqs.map((r) => `<li class="small">${esc(r.item)}${r.dueDate ? ` <span class="faint">· due ${esc(fmtD(r.dueDate))}</span>` : ''}</li>`).join('')}</ul></div>` : ''}
        <div class="talk-qs">${qList || empty(ui.talkOpen ? 'Everything prepared for them has been answered.' : 'No prepared questions for this person.')}</div>`)}
    </div>
  </div>`;
}

    ${e.opportunities.filter((o) => o.status !== 'Idea').length ? `<h3>Opportunities</h3><ul>${e.opportunities.filter((o) => o.status !== 'Idea').map((o) => `<li><b>${esc(o.title)}</b> <span class="muted small">(${esc(o.area || '')} · impact ${esc(o.impact || '—')})</span>${o.description ? ' · ' + esc(o.description) : ''}</li>`).join('')}</ul>` : ''}

/** Client feedback cheatsheet: the client's own rules vs what the data shows, with the numbers. Suggestions, not decisions. */

  const item = (f) => `<article class="fb-i fb-${esc(f.priority || 'medium')}">

function doMerge(obj, label) {
  const e = E(); e.meta.mergeLog = Array.isArray(e.meta.mergeLog) ? e.meta.mergeLog : [];
  const fp = (obj._meta && obj._meta.fileId) || hashStr(JSON.stringify(obj));
  const prior = e.meta.mergeLog.find((l) => l.fp === fp);
  if (prior && !confirm(`You already merged "${prior.label}" on ${new Date(prior.mergedAt).toLocaleString('en-GB')}.\n\nMerge it again? (Nothing will be duplicated, and newer data is protected.)`)) return false;
  if (!obj._meta && !confirm(`"${label}" has no date stamp (it was made before freshness tracking).\n\nIt can ADD new records but will NOT overwrite anything already in the Studio. Continue?`)) return false;
  const { engagement, counts, skipped } = mergeEngagement(e, obj);
  engagement.id = db.activeId; db.engagements[db.activeId] = engagement;
  const sum = Object.entries(counts).filter(([, v]) => v.added || v.updated || v.skipped).map(([k, v]) => `${k} +${v.added}/~${v.updated}${v.skipped ? `/✕${v.skipped}` : ''}`).join(', ');

  save(); render();

  flowZoom: (el) => {

      const availW = wrap.clientWidth - 26, availH = window.innerHeight - 170;

      const ns = [...document.querySelectorAll('.pv-visual .flow-svg')].map((x) => x.querySelectorAll('g.fnode').length).filter(Boolean); if (!ns.length) return;
      const fitFor = (c) => { const w = Math.max(...ns.map((n) => flowDims(n, c)[0])); const h = sum(ns.map((n) => flowDims(n, c)[1])) + (ns.length - 1) * 40; return Math.min(availW / w, availH / h); };
      if (!ui.flowCols) { let best = 1; for (let c = 1; c <= Math.min(6, Math.max(...ns)); c++) if (fitFor(c) > fitFor(best) + 0.001) best = c; ui.flowColsAuto = best; }

    openModal(`${COLL_LABELS[coll]} → ${row.name || row.title || id} → ${field}`, JSON.stringify(row[field] || [], null, 2), (txt) => {

      row[field] = v; touch(row); Object.assign(E(), normalise(E())); save(); render(); return true;
    });
  },
  addRec: () => { const r = { id: uid('r'), title: 'New recommendation', type: 'Process', horizon: '0-3 months', effort: 3, risk: 3, confidence: 3, status: 'Proposed', ops: [] }; E().recommendations.push(r); ui.tab = 'data'; ui.coll = 'recommendations'; save(); render(); },
  addScenario: () => { const n = prompt('Scenario name?', `Scenario ${String.fromCharCode(65 + E().scenarios.length)}`); if (!n) return; E().scenarios.push({ id: uid('sc'), name: n, description: '', recommendationIds: [] }); save(); render(); },
  delScenario: (el) => { if (!confirm('Delete this scenario?')) return; E().scenarios = E().scenarios.filter((s) => s.id !== el.dataset.id); if (ui.scenario === el.dataset.id) ui.scenario = 'current'; save(); render(); },
  toggleRecInScenario: (el) => {
    const s = E().scenarios.find((x) => x.id === el.dataset.scenario); const ids = new Set(splitList(s.recommendationIds));
    el.checked ? ids.add(el.dataset.rec) : ids.delete(el.dataset.rec); s.recommendationIds = [...ids]; touch(s); save(); render();
  },
  toggleReportProc: (el) => { const r = E().report; const ids = new Set(r.processIds || []); el.checked ? ids.add(el.dataset.id) : ids.delete(el.dataset.id); r.processIds = [...ids]; save(); render(); },
  printReport: () => { if (!(ui.tab === 'progress' && subOf('progress') === 'report')) { ui.tab = 'report'; render(); } setTimeout(() => window.print(), 50); },
  downloadReport: () => downloadReportHTML(E(), ui.reportType)
};

/* ---------- modal ---------- */
function openModal(title, text, onSave) {
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="modal-card"><h3>${esc(title)}</h3><textarea id="modalText" rows="20" spellcheck="false">${esc(text)}</textarea><div class="btn-row"><button class="btn" id="modalSave">Save</button><button class="btn ghost" id="modalCancel">Cancel</button></div></div>`;
  m.hidden = false;
  document.getElementById('modalCancel').onclick = () => { m.hidden = true; };
  document.getElementById('modalSave').onclick = () => { if (onSave(document.getElementById('modalText').value) !== false) m.hidden = true; };
}

/* ---------- events ---------- */
document.addEventListener('wheel', (ev) => {
  const wrap = ev.target.closest && ev.target.closest('.flow-wrap'); if (!wrap || !ev.ctrlKey) return;
  ev.preventDefault(); const svg = wrap.querySelector('.flow-svg'); if (!svg) return;
  const cur = ui.flowZoom || svg.getBoundingClientRect().width / +svg.dataset.w;
  ui.flowZoom = Math.max(0.2, Math.min(2.5, +(cur * (ev.deltaY < 0 ? 1.08 : 0.926)).toFixed(3))); ui.flowWhole = false;
  const sl = wrap.scrollLeft, st = wrap.scrollTop; render(); const w2 = document.querySelector('.flow-wrap'); if (w2) { w2.scrollLeft = sl; w2.scrollTop = st; }
}, { passive: false });
let panning = null;
document.addEventListener('mousedown', (ev) => {
  const wrap = ev.target.closest && ev.target.closest('.flow-wrap.zoomed'); if (!wrap || ev.target.closest('.clk') || ev.button) return;
  panning = { wrap, x: ev.clientX, y: ev.clientY, l: wrap.scrollLeft, t: wrap.scrollTop }; wrap.classList.add('panning'); ev.preventDefault();
});
document.addEventListener('mousemove', (ev) => { if (!panning) return; panning.wrap.scrollLeft = panning.l - (ev.clientX - panning.x); panning.wrap.scrollTop = panning.t - (ev.clientY - panning.y); });
document.addEventListener('mouseup', () => { if (panning) { panning.wrap.classList.remove('panning'); panning = null; } });
document.addEventListener('toggle', (ev) => { if (ev.target.id === 'mergeHist') { ui.mergeOpen = ev.target.open; const sm = ev.target.querySelector('summary b'); if (sm) sm.textContent = ev.target.open ? 'Hide history' : 'Show history'; } }, true);
document.addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-action]'); if (!a) return;
  if (a.type === 'checkbox') return; // handled on change
  const fn = actions[a.dataset.action]; if (fn) { ev.preventDefault(); fn(a, ev); }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'engSel') { db.activeId = t.value; ui.scenario = 'current'; ui.processId = ''; save(); render(); return; }
  if (t.id === 'scSel') { ui.scenario = t.value; render(); return; }
  if (t.id === 'importFile' && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const obj = JSON.parse(fr.result);
        const list = obj.engagements ? obj.engagements : [obj];
        list.forEach((x) => { const e = normalise(x); if (!e.meta.tsMigrated) stampAll(e, LEGACY_CUTOFF); db.engagements[e.id] = e; db.activeId = e.id; });
        ui.scenario = 'current'; save(); render(); toast(`Imported ${list.length} client${list.length > 1 ? 's' : ''}`);
      } catch (err) { toast('Could not read file: ' + err.message); }
    };
    fr.readAsText(t.files[0]); return;
  }
  if (t.id === 'mergeFile' && t.files[0]) {
    const fr = new FileReader(); const fname = t.files[0].name;
    fr.onload = () => {
      let obj; try { obj = JSON.parse(fr.result); } catch (err) { return toast('That file is not valid JSON: ' + err.message); }
      doMerge(obj, fname);
    };
    fr.readAsText(t.files[0]); t.value = ''; return;
  }
  if (t.id === 'staffFile' && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { const res = importFormCSV(E(), fr.result, 'staff'); save(); render(); toast(`Staff responses: ${res.added} added, ${res.updated} updated${res.unmatched.length ? `, ${res.unmatched.length} columns not matched` : ''}`); };
    fr.readAsText(t.files[0]); return;
  }
  if (t.dataset.capcell) { const cap = E().capabilities.find((x) => x.id === t.dataset.capcell); if (cap) { if (t.dataset.comp === '__client') cap.client = t.value; else { cap.scores = cap.scores || {}; cap.scores[t.dataset.comp] = t.value; } touch(cap); save(); render(); } return; }
  if (t.dataset.intakesel || t.dataset.intakemulti) { intakeWrite(t); return; }
  if (t.dataset.intake) { intakeWrite(t); return; }
  if (t.id === 'intakeFile' && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { const res = importIntakeCSV(E(), fr.result); save(); render(); toast(`Founder responses: ${res.added} added, ${res.updated || 0} updated${res.unmatched.length ? `, ${res.unmatched.length} columns not matched` : ''}`); };
    fr.readAsText(t.files[0]); return;
  }
  if (t.dataset.draftsel) { setPath(ui.draft, t.dataset.draftsel, t.value); if (t.dataset.draftsel === 'personId') { const p = E().people.find((x) => x.id === t.value); ui.draft.level = guessLevel(E(), p); ui.draft.deptType = ''; } saveDraft(ui.draft); render(); return; }
  if (t.dataset.draftchk) { ui.draft[t.dataset.draftchk] = t.checked; saveDraft(ui.draft); return; }
  if (t.dataset.action && t.type === 'checkbox') { const fn = actions[t.dataset.action]; if (fn) fn(t, ev); return; }
  if (t.dataset.pe) { const proc = E().processes.find((x) => x.id === ui.processId); if (!proc) return; proc[t.dataset.pe] = t.value; touch(proc); save(); render(); return; }
  if (t.dataset.ed) {
    const proc = procOfStep(ui.editStep); const step = proc && (proc.steps || []).find((x) => x.id === ui.editStep); if (!step) return;
    const f = t.dataset.ed; let v = t.value;
    if (f === 'durationMins' || f === 'elapsedDays') { v = v === '' ? '' : num(v); if (!(step.review && ['confirmed', 'corrected'].includes(step.review.status))) step.timeBasis = 'assumed'; }
    if (f === 'automated') v = v === 'yes';
    if (f === 'painPoint' && v !== step.painPoint) step.painState = null; // a new or changed issue starts open
    step[f] = v; if (f === 'actorLabel') step.actorId = '';
    touch(proc); save(); render(); return;
  }
  if (t.dataset.rv || t.hasAttribute('data-rvnote')) {
    const { proc, step, rev } = reviewCtx(); if (!step) return;
    if (t.hasAttribute('data-rvnote')) { rev.notes[step.id] = t.value; touch(proc); save(); return; }
    const f = t.dataset.rv; let v = t.value;
    if (f === 'durationMins' || f === 'elapsedDays') { v = v === '' ? '' : num(v); step.timeBasis = 'confirmed'; }
    if (f === 'automated') v = v === 'yes';
    step[f] = v; if (f === 'actorLabel') step.actorId = '';
    if (!rev.verdicts[step.id] || rev.verdicts[step.id] === 'confirmed') { rev.verdicts[step.id] = 'corrected'; step.review = { status: 'corrected', by: rev.label, date: rev.date }; }
    touch(proc); save(); render(); return;
  }
  if (t.dataset.ui) { ui[t.dataset.ui] = t.type === 'checkbox' ? t.checked : t.value; saveUI(); render(); return; }
  if (t.dataset.bind) {
    const v = t.type === 'checkbox' ? t.checked : t.value; setPath(E(), t.dataset.bind, v); touch(E()[t.dataset.bind.split('.')[0]]); save();
    if (ui.tab === 'report' || ui.tab === 'progress' || t.dataset.bind === 'meta.currency' || t.dataset.bind === 'client.name') render();
    return;
  }
  if (t.hasAttribute('data-cell')) {
    const { coll, id, field, type } = t.dataset; const arr = getPath(E(), coll) || []; const row = arr.find((x) => x.id === id); if (!row) return;
    let v = t.value; if (type === 'num') v = v === '' ? '' : num(v);
    if (field === 'id') {
      if (!v || arr.some((x) => x.id === v)) { toast('ids must be unique and not empty'); t.value = id; return; }
      t.closest('tr').querySelectorAll('[data-id]').forEach((n) => { n.dataset.id = v; });
    }
    row[field] = v; touch(row);
    if (coll === 'engagement.timeLog' && field === 'dayType') row.days = v === 'Full' ? 1 : 0.5;
    if (coll === 'engagement.timeLog' && field === 'date') row.phaseId = phaseForDate(E().engagement, v);
    if (coll === 'engagement.activities' && field === 'status') row.doneDate = v === 'Done' ? (row.doneDate || todayISO()) : '';
    if (coll === 'engagement.phases' && field === 'status' && v === 'Done') { const ps = E().engagement.phases; const i = ps.indexOf(row); if (ps[i + 1] && ps[i + 1].status === 'Not started') ps[i + 1].status = 'In progress'; }
    save();
    if ((coll === 'recommendations' && ui.tab === 'plan') || ui.tab === 'home' || (ui.tab === 'progress' && (t.tagName === 'SELECT' || t.type === 'date' || t.type === 'number'))) render();
  }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.tagName === 'TEXTAREA' && t.dataset.bind) { setPath(E(), t.dataset.bind, t.value); touch(E()[t.dataset.bind.split('.')[0]]); save(); }
  if (t.dataset.intake || t.dataset.intakeother) { intakeWrite(t); return; }
  if (t.dataset.draft && ui.draft) { setPath(ui.draft, t.dataset.draft, t.type === 'number' ? t.value : t.value); saveDraft(ui.draft); }
});

/* ---------- tooltip (hover layer for every chart mark) ---------- */
(function tooltip() {
  const tip = document.getElementById('tip');
  document.addEventListener('mouseover', (ev) => {
    const el = ev.target.closest('[data-tip]'); if (!el) { tip.hidden = true; return; }
    tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
  });
  document.addEventListener('mousemove', (ev) => {
    if (tip.hidden) return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
    if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  document.addEventListener('mouseleave', () => { tip.hidden = true; });
})();

loadDB();
render();

</script>
